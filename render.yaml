# Render blueprint. Deploy with: New > Blueprint, pointed at this repo.
#
# No secret values appear here. `sync: false` means Render prompts for the
# value once at deploy time and stores it encrypted; it is never in git.
services:
  - type: web
    name: relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt && pip install -e .
    # Threads (not extra workers) so the free tier's memory holds, while the
    # SSE run stream and the health poll it races against can overlap.
    # The timeout is generous because a real screen takes a while.
    startCommand: gunicorn --threads 8 --timeout 300 --bind 0.0.0.0:$PORT server.app:app
    healthCheckPath: /api/health
    envVars:
      - key: RELAY_ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SESSION_SECRET
        generateValue: true      # Render generates and stores it
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RELAY_ALLOWED_USERS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Powers the report's "Write narrative" button. Optional: without it the
      # report still exports, using its assembled prose.
      - key: BRAIN_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      # Per-user projects. Render injects the connection string from the
      # database declared below; without it the store falls back to SQLite on
      # the instance's ephemeral disk and every account is lost on redeploy.
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString

databases:
  - name: relay-db
    plan: free
    databaseName: relay
    user: relay
