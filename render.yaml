# Render blueprint. Deploy with: New > Blueprint, pointed at this repo.
#
# No secret values appear here. `sync: false` means Render prompts for the
# value once at deploy time and stores it encrypted; it is never in git.
services:
  - type: web
    name: relay
    runtime: python
    # Starter: 512MB, always on. A screen peaks near 380MB (measured), so one
    # run fits and two do not -- the server allows one at a time and refuses
    # the rest with a 429 rather than being OOM-killed.
    plan: starter
    buildCommand: pip install -r requirements-server.txt && pip install -e .
    # One worker, because the single-run guard is per-process. Threads let the
    # health check and UI requests continue while a run streams. The timeout
    # covers a full research run, which takes minutes rather than seconds.
    startCommand: gunicorn --workers 1 --threads 8 --timeout 600 --bind 0.0.0.0:$PORT server.app:app
    healthCheckPath: /api/health
    envVars:
      - key: RELAY_ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SESSION_SECRET
        generateValue: true      # Render generates and stores it
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RELAY_ALLOWED_USERS
        sync: false
      # Model access. The research pipeline reads these; the compound screen
      # does not need them.
      - key: BRAIN_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: BRAIN_FAST_REASONING_EFFORT
        value: low
      - key: ANTHROPIC_API_KEY
        sync: false
      # Powers the report's "Write narrative" button. Optional: without it the
      # report still exports, using its assembled prose.
      - key: BRAIN_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      # Per-user projects. Render injects the connection string from the
      # database declared below; without it the store falls back to SQLite on
      # the instance's ephemeral disk and every account is lost on redeploy.
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString

databases:
  - name: relay-db
    plan: free
    databaseName: relay
    user: relay
