}
function actionRow(acts){ return `<div class="pane-actions">${acts.map(a=>`<button class="chip-action${a.primary?" primary":""}" data-paneact="${a.id}"${a.disabled?" disabled":""}>${a.icon||""}${esc(a.label)}</button>`).join("")}</div>`; }
const IC={
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 7 5.5z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

};
function paneQuestion(n){const m=n.meta;return `
  <div class="section"><div class="prose"><p>${esc(m.objective||"")}</p></div></div>
  ${sectionKV("Scope & outcome",{Scope:m.scope,"Measurable outcome":m.outcome,Constraints:m.constraints})}
  ${sectionKV("Data & budget",{Data:m.data,Budget:m.budget})}
  ${actionRow([{id:"edit",label:"Edit"},{id:"add-evidence",label:"Add evidence",icon:IC.plus},{id:"propose",label:"Add hypothesis",primary:true}])}`;}
function paneSource(n){const m=n.meta;const cards=(m.sources||[]).map(s=>`
  <div class="evidence-card"><div class="ec-top"><span class="ec-src">${esc(s.src)}</span><span class="ec-meta">${esc(s.meta||"")}</span></div><div class="ec-body">${esc(s.body||"")}</div>${s.url?`<div class="ec-link"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>`:""}</div>`).join("");
  // What this evidence actually bears on, taken from the edges leaving it.
  const bearing=curProj().edges.filter(e=>e.from===n.id).map(e=>({node:nodeById(e.to),rel:e.rel})).filter(x=>x.node);
  const bearingHTML=bearing.length
    ? `<ul class="bullets">${bearing.map(({node,rel})=>
        `<li class="${rel==="contradicts"?"neg":"pos"}"><button class="link-node" data-goto="${node.id}">${esc(nodeHeading(node).title)}</button><span class="rel-tag ${rel}">${esc(REL_LABEL[rel]||rel)}</span></li>`).join("")}</ul>`
    : `<div class="prose"><p class="muted">Not connected to a hypothesis yet.</p></div>`;
  return `<div class="section"><h3>Sources & records</h3>${cards}</div>
  <div class="section"><h3>Bearing on hypotheses</h3>${bearingHTML}</div>
  ${sectionKV("Appraisal",{Relevance:m.relevance,Limitations:m.limitations})}
  ${actionRow([{id:"edit",label:"Edit"},{id:"open-source",label:"Open source",icon:IC.link},{id:"link-claim",label:"Connect to a claim"}])}`;}
/* Evidence shown here is read off the graph, not retyped beside it. A
   hypothesis used to list "supporting evidence" as prose while the edge that
   actually linked it said something else — and one line claimed 12 sources
   next to a node holding 3. Whatever the edges say is what you see. */
function linkedEvidence(n,rels){
  return curProj().edges
    .filter(e=>e.to===n.id&&rels.includes(e.rel))
    .map(e=>({node:nodeById(e.from),rel:e.rel}))
    .filter(x=>x.node);

function evidenceList(items,cls){

    `<li class="${cls}"><button class="link-node" data-goto="${node.id}">${esc(nodeHeading(node).title)}</button>`
    + `<span class="rel-tag ${rel}">${esc(REL_LABEL[rel]||rel)}</span></li>`).join("");
}
function paneHypothesis(n){const m=n.meta;
  const preds=(m.predictions||[]).map(p=>`<li>${esc(p)}</li>`).join("");
  const sup=evidenceList(linkedEvidence(n,["supports","uses"]),"pos");
  const con=evidenceList(linkedEvidence(n,["contradicts"]),"neg");
  // meta.contradict is a caveat the author wrote, not a linked node: say so.
  const caveats=(m.contradict||[]).map(p=>`<li class="neg">${esc(p)}</li>`).join("");
  return `<div class="section"><div class="prose"><p>${esc(m.statement||"")}</p></div></div>
  ${preds?`<div class="section"><h3>Predictions</h3><ul class="bullets">${preds}</ul></div>`:""}
  <div class="section"><h3>Linked evidence</h3>${
    (sup||con) ? `<ul class="bullets">${sup}${con}</ul>`
      : `<div class="prose"><p class="muted">Nothing is connected to this yet. Use “Connect to a claim”.</p></div>`}</div>
  ${caveats?`<div class="section"><h3>Caveats</h3><ul class="bullets">${caveats}</ul></div>`:""}
  ${sectionKV("Appraisal",{Uncertainty:m.uncertainty,"Alternative":m.alt})}
  ${actionRow([{id:"design-test",label:"Design a test",icon:IC.play,primary:true},{id:"link-claim",label:"Connect to a claim"},{id:"edit",label:"Edit"}])}`;}
function paneExperiment(n){const m=n.meta;
  const tests=(m.tests||[]).map(t=>`<div class="evidence-card" style="${t.sel?"border-color:var(--accent);background:var(--accent-soft)":""}"><div class="ec-top"><span class="ec-src">${esc(t.name)}</span>${t.sel?`<span class="rel-tag supports">selected</span>`:""}</div><div class="ec-body">${esc(t.why)}</div></div>`).join("");
  return `<div class="section"><h3>Proposed tests</h3><div class="prose"><p class="muted">What the planner considered for this question. The selected one is what a run executes.</p></div>${tests}</div>
  ${sectionKV("Method & inputs",{Method:m.method,Inputs:m.inputs,Baseline:m.baseline,Controls:m.controls,Parameters:m.params})}

  <div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span>Runs act on real inputs and need approval. In a shared demo this replays a labelled trace; served from your Mac it orchestrates Omnigent.</span></div>

/* chart block = serif title + svg + legend */
function chartBlock(which,d,interactive){
  const c=d[which];
  if(which==="enrichment") return `<div class="chart"><div class="fig-title">${esc(c.title)}</div><div class="fig-sub">${esc(c.sub)}</div>${lineChartSVG(c)}<div class="legend">
    <button class="lg" data-series="proposed" aria-pressed="true"><span class="sw" style="background:var(--series-1)"></span>Proposed method</button>
    <button class="lg" data-series="baseline" aria-pressed="true"><span class="sw" style="background:var(--series-2)"></span>Baseline (random)</button></div></div>`;
  return `<div class="chart"><div class="fig-title">${esc(c.title)}</div><div class="fig-sub">${esc(c.sub)}</div>${barChartSVG(c)}</div>`;
}

/* ============================== charts ================================ */
function niceNum(v){ return (Math.round(v*100)/100).toString(); }
function lineChartSVG(c){
  const W=440,H=236, ml=46,mr=16,mt=12,mb=40; const pw=W-ml-mr, ph=H-mt-mb;
  const X=v=>ml+(v/c.xmax)*pw, Y=v=>mt+ph-(v/c.ymax)*ph;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  // grid + y ticks
  for(const t of c.yticks){ const y=Y(t); g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}"/><text class="tick-lab" x="${ml-8}" y="${y+3}" text-anchor="end">${t}</text>`; }
  for(const t of c.xticks){ const x=X(t); g+=`<text class="tick-lab" x="${x}" y="${H-mb+16}" text-anchor="middle">${t}</text>`; }
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  // confidence band
  let up="",dn="";
  for(let i=0;i<c.x.length;i++){ up+=`${i?"L":"M"}${X(c.x[i])},${Y(Math.min(c.ymax,c.proposed[i]+c.band[i]))} `; }
  for(let i=c.x.length-1;i>=0;i--){ dn+=`L${X(c.x[i])},${Y(Math.max(0,c.proposed[i]-c.band[i]))} `; }
  g+=`<path d="${up}${dn}Z" fill="var(--series-1-band)" stroke="none"/>`;
  // baseline series
  g+=`<path d="${c.x.map((xv,i)=>`${i?"L":"M"}${X(xv)},${Y(c.baseline[i])}`).join(" ")}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-line="baseline"/>`;
  c.x.forEach((xv,i)=>{ g+=`<circle cx="${X(xv)}" cy="${Y(c.baseline[i])}" r="3" fill="var(--series-2)" data-line="baseline"/>`; });
  // proposed series
  g+=`<path d="${c.x.map((xv,i)=>`${i?"L":"M"}${X(xv)},${Y(c.proposed[i])}`).join(" ")}" fill="none" stroke="var(--series-1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-line="proposed"/>`;
  c.x.forEach((xv,i)=>{ g+=`<circle class="data-point" cx="${X(xv)}" cy="${Y(c.proposed[i])}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="1.5" data-px="${xv}" data-py="${c.proposed[i]}"><title>${xv}% → ${niceNum(c.proposed[i])}× enrichment</title></circle>`; });
  // axis titles
  g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-4}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  g+=`<text class="axis-title" transform="translate(13,${mt+ph/2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;
  g+=`</svg>`;
  return g;
}
function barChartSVG(c){
  const rows=c.rows; const rowH=34, top=10, ml=58, mr=22, bottom=26;
  const W=440, pw=W-ml-mr, H=top+rows.length*rowH+bottom;
  const X=v=>ml+(v/c.xmax)*pw;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  for(const t of c.xticks){ const x=X(t); g+=`<line class="grid-line" x1="${x}" y1="${top}" x2="${x}" y2="${top+rows.length*rowH}"/><text class="tick-lab" x="${x}" y="${H-8}" text-anchor="middle">${t}</text>`; }
  rows.forEach((r,i)=>{
    const cy=top+i*rowH+rowH/2; const bw=X(r.score)-ml; const sel=(r.id===state.selCandidate);
    g+=`<g class="bar-row${sel?" sel":""}" data-cand="${esc(r.id)}" style="cursor:pointer">`;
    g+=`<rect x="0" y="${cy-rowH/2}" width="${W}" height="${rowH}" fill="transparent"/>`;
    g+=`<text class="tick-lab" x="${ml-10}" y="${cy+3}" text-anchor="end" style="font-weight:600;fill:var(--ink-2)">${esc(r.id)}</text>`;
    g+=`<rect class="bar-fill" x="${ml}" y="${cy-7}" width="${Math.max(2,bw)}" height="14" rx="4" fill="var(--series-1)"/>`;
    // error bar
    const ex1=X(Math.max(0,r.score-r.err)), ex2=X(Math.min(c.xmax,r.score+r.err));
    g+=`<line x1="${ex1}" y1="${cy}" x2="${ex2}" y2="${cy}" stroke="var(--chart-axis)" stroke-width="1.4"/><line x1="${ex1}" y1="${cy-4}" x2="${ex1}" y2="${cy+4}" stroke="var(--chart-axis)" stroke-width="1.4"/><line x1="${ex2}" y1="${cy-4}" x2="${ex2}" y2="${cy+4}" stroke="var(--chart-axis)" stroke-width="1.4"/>`;
    const labX=Math.min(W-4, Math.max(X(r.score)+10, ex2+9));
    g+=`<text class="tick-lab" x="${labX}" y="${cy+3}" style="fill:var(--ink-2);font-weight:700">${niceNum(r.score)}</text>`;
    g+=`<title>${esc(r.id)} — predicted ${niceNum(r.score)}${c.family&&r.family?" · "+esc(r.family):""}</title></g>`;
  });
  g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-8}" text-anchor="middle" dy="14"></text>`;
  g+=`</svg>`;
  return g;
}
/* ======================= report figure library =========================
   Figures for the exported paper. Each takes a plain data object and returns
   inline SVG, so they print as vector and survive a PDF at any zoom. They are
   deliberately separate from the canvas charts above: a figure in a paper
   needs a legend, axis titles, gridlines and readable ticks, where a preview
   card on the canvas does not.

   Every renderer draws only what it is given. None of them synthesise a
   trend, extend a series, or fill a gap -- an absent series is simply not
   drawn, and `figureSVG` says so rather than inventing a shape. */
const SERIES_VARS=["--series-1","--series-3","--series-5","--series-6","--series-4","--series-2"];
function seriesColor(s,i){ return s.color||SERIES_VARS[i%SERIES_VARS.length]; }

function figLegend(series){
  return `<div class="fig-legend">${series.map((s,i)=>
    `<span class="lg-item"><span class="lg-sw" style="background:var(${seriesColor(s,i)})"></span>${esc(s.name)}</span>`).join("")}</div>`;
}
function niceTicks(max,n){
  const step=max/n, out=[];
  for(let i=0;i<=n;i++) out.push(Math.round(step*i*100)/100);
  return out;
}

/* --- multi-series area + line, gradient filled -------------------------
   For a quantity tracked across an ordered axis (screening depth, epochs,
   days). Mirrors the stacked-trend look while keeping each series readable. */
function areaChartSVG(c){
  const W=560,H=280, ml=52,mr=18,mt=16,mb=54; const pw=W-ml-mr, ph=H-mt-mb;
  const n=(c.x||[]).length; if(!n||!(c.series||[]).length) return "";
  const ymax=c.ymax||Math.max(...c.series.flatMap(s=>s.values))*1.12||1;
  const yticks=c.yticks||niceTicks(ymax,4);
  const X=i=>ml+(n===1?pw/2:(i/(n-1))*pw), Y=v=>mt+ph-(Math.max(0,Math.min(ymax,v))/ymax)*ph;
  const uid="ar"+Math.random().toString(36).slice(2,7);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"")}"><defs>`;
  c.series.forEach((s,i)=>{ const col=seriesColor(s,i);
    g+=`<linearGradient id="${uid}-${i}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(${col})" stop-opacity="0.42"/>
        <stop offset="100%" stop-color="var(${col})" stop-opacity="0.02"/></linearGradient>`; });
  g+=`</defs>`;
  for(const t of yticks){ const y=Y(t); g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke-dasharray="3 3"/><text class="tick-lab" x="${ml-8}" y="${y+3.5}" text-anchor="end">${t}</text>`; }
  // x labels are thinned so they never collide, however long the series is
  const every=Math.max(1,Math.ceil(n/9));
  (c.x||[]).forEach((lab,i)=>{ if(i%every) return;
    g+=`<text class="tick-lab" x="${X(i)}" y="${mt+ph+16}" text-anchor="middle">${esc(String(lab))}</text>`; });
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  c.series.forEach((s,i)=>{
    const col=seriesColor(s,i);
    const line=s.values.map((v,j)=>`${j?"L":"M"}${X(j)},${Y(v)}`).join(" ");
    g+=`<path d="${line} L${X(n-1)},${mt+ph} L${X(0)},${mt+ph} Z" fill="url(#${uid}-${i})" stroke="none"/>`;
    g+=`<path d="${line}" fill="none" stroke="var(${col})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(n<=32) s.values.forEach((v,j)=>{ g+=`<circle cx="${X(j)}" cy="${Y(v)}" r="2.6" fill="var(${col})"><title>${esc(s.name)} · ${esc(String(c.x[j]))}: ${niceNum(v)}</title></circle>`; });
  });
  if(c.xlabel) g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-20}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  if(c.ylabel) g+=`<text class="axis-title" transform="translate(14,${mt+ph/2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;
  return g+`</svg>`+figLegend(c.series);
}

/* --- grouped vertical bars --------------------------------------------
   Categories on x, one bar per series within each category. Used for
   per-stratum breakdowns, where a single bar would hide the comparison. */
function groupedBarSVG(c){
  const cats=c.categories||[], series=c.series||[];
  if(!cats.length||!series.length) return "";
  const W=560,H=280, ml=54,mr=18,mt=16,mb=54; const pw=W-ml-mr, ph=H-mt-mb;
  const ymax=c.ymax||Math.max(...series.flatMap(s=>s.values))*1.14||1;
  const yticks=c.yticks||niceTicks(ymax,4);
  const Y=v=>mt+ph-(Math.max(0,v)/ymax)*ph;
  const gw=pw/cats.length, bw=Math.min(26,(gw*0.68)/series.length);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"")}">`;
  for(const t of yticks){ const y=Y(t); g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke-dasharray="3 3"/><text class="tick-lab" x="${ml-8}" y="${y+3.5}" text-anchor="end">${t}</text>`; }
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  cats.forEach((cat,ci)=>{
    const gx=ml+ci*gw, mid=gx+gw/2;
    const total=series.length*bw+(series.length-1)*3;
    series.forEach((s,si)=>{
      const v=s.values[ci]; if(v==null) return;
      const x=mid-total/2+si*(bw+3), y=Y(v), h=mt+ph-y;
      g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="2.5" fill="var(${seriesColor(s,si)})"><title>${esc(s.name)} · ${esc(cat)}: ${niceNum(v)}</title></rect>`;
    });
    g+=`<text class="tick-lab" x="${mid}" y="${mt+ph+16}" text-anchor="middle">${esc(cat)}</text>`;
  });
  if(c.xlabel) g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-20}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  if(c.ylabel) g+=`<text class="axis-title" transform="translate(14,${mt+ph/2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;
  return g+`</svg>`+figLegend(series);
}

/* --- ROC curve ---------------------------------------------------------
   The chance diagonal is drawn explicitly: an ROC without it invites the
   reader to over-read a curve that may be barely above random. */
function rocCurveSVG(c){
  const pts=c.points||[]; if(pts.length<2) return "";
  const W=360,H=330, ml=50,mr=16,mt=16,mb=52; const pw=W-ml-mr, ph=H-mt-mb;
  const X=v=>ml+v*pw, Y=v=>mt+ph-v*ph;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"ROC curve")}">`;
  for(const t of [0,.25,.5,.75,1]){
    g+=`<line class="grid-line" x1="${ml}" y1="${Y(t)}" x2="${W-mr}" y2="${Y(t)}" stroke-dasharray="3 3"/>`;
    g+=`<text class="tick-lab" x="${ml-8}" y="${Y(t)+3.5}" text-anchor="end">${t}</text>`;
    g+=`<text class="tick-lab" x="${X(t)}" y="${mt+ph+16}" text-anchor="middle">${t}</text>`;
  }
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  g+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="var(--series-2)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  g+=`<text class="tick-lab" x="${X(.62)}" y="${Y(.52)}" transform="rotate(-45 ${X(.62)} ${Y(.52)})" style="fill:var(--ink-3)">chance (AUC 0.50)</text>`;
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(p[0])},${Y(p[1])}`).join(" ");
  g+=`<path d="${d} L${X(1)},${Y(0)} Z" fill="var(--series-1-band)" stroke="none"/>`;
  g+=`<path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2.6" stroke-linejoin="round"/>`;
  if(c.auc!=null) g+=`<text class="fig-title-svg" x="${X(.56)}" y="${Y(.22)}">AUC = ${Number(c.auc).toFixed(3)}</text>`;
  g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-18}" text-anchor="middle">False positive rate</text>`;
  g+=`<text class="axis-title" transform="translate(13,${mt+ph/2}) rotate(-90)" text-anchor="middle">True positive rate</text>`;
  return g+`</svg>`;
}

/* --- paired distribution ----------------------------------------------
   Two overlaid histograms. Separation between them is the visual form of
   what AUC states numerically, so the two belong next to each other. */
function distributionSVG(c){
  const bins=c.bins||[]; if(!bins.length) return "";
  const W=560,H=260, ml=52,mr=18,mt=16,mb=54; const pw=W-ml-mr, ph=H-mt-mb;
  const groups=c.groups||[];
  const ymax=c.ymax||Math.max(...groups.flatMap(gr=>gr.counts))*1.12||1;
  const Y=v=>mt+ph-(Math.max(0,v)/ymax)*ph, bw=pw/bins.length;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"")}">`;
  for(const t of niceTicks(ymax,4)){ const y=Y(t); g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke-dasharray="3 3"/><text class="tick-lab" x="${ml-8}" y="${y+3.5}" text-anchor="end">${t}</text>`; }
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  groups.forEach((gr,gi)=>{
    const col=seriesColor(gr,gi);
    gr.counts.forEach((v,i)=>{ if(v==null) return;
      const x=ml+i*bw, y=Y(v);
      g+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${Math.max(0,mt+ph-y)}" fill="var(${col})" opacity="${gi?0.55:0.78}"><title>${esc(gr.name)} · bin ${esc(String(bins[i]))}: ${v}</title></rect>`;
    });
  });
  const every=Math.max(1,Math.ceil(bins.length/8));
  bins.forEach((b,i)=>{ if(i%every) return; g+=`<text class="tick-lab" x="${ml+i*bw+bw/2}" y="${mt+ph+16}" text-anchor="middle">${esc(String(b))}</text>`; });
  if(c.xlabel) g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-18}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  if(c.ylabel) g+=`<text class="axis-title" transform="translate(14,${mt+ph/2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;
  return g+`</svg>`+figLegend(groups);
}

/* --- horizontal metric comparison with explicit null band --------------
   For method-vs-control comparisons. The shaded band marks "no better than
   chance", so a control sitting inside it reads as a pass at a glance. */
function controlBarSVG(c){
  const rows=c.rows||[]; if(!rows.length) return "";
  const rowH=34, top=14, ml=150, mr=56, bottom=42;
  const W=560, pw=W-ml-mr, H=top+rows.length*rowH+bottom;
  const xmax=c.xmax||Math.max(...rows.map(r=>r.value))*1.15||1;
  const X=v=>ml+(Math.max(0,v)/xmax)*pw;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"")}">`;
  if(c.nullBand){ g+=`<rect x="${X(c.nullBand[0])}" y="${top-4}" width="${Math.max(1,X(c.nullBand[1])-X(c.nullBand[0]))}" height="${rows.length*rowH+8}" fill="var(--series-2)" opacity="0.14"/>`;
    g+=`<text class="tick-lab" x="${X(c.nullBand[1])+4}" y="${top-2}" style="fill:var(--ink-3)">no-effect band</text>`; }
  for(const t of (c.xticks||niceTicks(xmax,4))){ g+=`<line class="grid-line" x1="${X(t)}" y1="${top}" x2="${X(t)}" y2="${top+rows.length*rowH}" stroke-dasharray="3 3"/><text class="tick-lab" x="${X(t)}" y="${H-bottom+22}" text-anchor="middle">${t}</text>`; }
  rows.forEach((r,i)=>{
    const cy=top+i*rowH+rowH/2;
    const col=r.tone==="control"?"--series-2":(r.tone==="alert"?"--series-4":"--series-1");
    g+=`<text class="tick-lab" x="${ml-10}" y="${cy+3.5}" text-anchor="end" style="font-weight:600;fill:var(--ink-2)">${esc(r.label)}</text>`;
    g+=`<rect x="${ml}" y="${cy-9}" width="${Math.max(2,X(r.value)-ml)}" height="18" rx="3" fill="var(${col})"><title>${esc(r.label)}: ${niceNum(r.value)}</title></rect>`;
    g+=`<text class="tick-lab" x="${X(r.value)+8}" y="${cy+3.5}" style="fill:var(--ink-2);font-weight:700">${niceNum(r.value)}${esc(c.unit||"")}</text>`;
  });
  if(c.xlabel) g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-10}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  return g+`</svg>`;
}

/* Dispatcher. An unknown or empty figure returns a stated absence rather
   than a blank box, so a reader never mistakes a missing run for a null
   result. */
function figureSVG(f){
  if(!f||!f.kind) return "";
  const out = f.kind==="area"? areaChartSVG(f)
    : f.kind==="groupedBar"? groupedBarSVG(f)
    : f.kind==="roc"? rocCurveSVG(f)
    : f.kind==="dist"? distributionSVG(f)
    : f.kind==="controls"? controlBarSVG(f)
    : f.kind==="enrichment"? lineChartSVG(f)
    : f.kind==="candidates"? barChartSVG(f) : "";
  return out || `<div class="fig-empty">No data recorded for this figure yet. Run the experiment to populate it.</div>`;
}

function paneAction(act,n,btn){
  switch(act){
    case "run-exp": openRunModal(n.id); break;
    case "activity": n._tab="activity"; renderPaneBody(n); break;
    case "add-canvas": togglePreview(curProj().resultNode||n.id,true); toast("Chart preview added to canvas"); break;

    // Editing and structure: these all have real machinery behind them.
    case "edit": openNodeForm(n.type,null,n.id); break;
    case "add-evidence": openNodeForm("source",null,null,n.id); break;
    case "propose": openNodeForm("hypothesis",null,null,n.id); break;
    case "design-test": openNodeForm("experiment",null,null,n.id); break;
    case "link-claim": linkFromNode(n); break;
    case "pick-next": openNodeForm("experiment",{title:btn.dataset.test||""},null,n.id); break;

    // A source is only openable when it has somewhere to go.
    case "open-source": {
      const url=((n.meta.sources||[])[0]||{}).url;
      if(url) window.open(url,"_blank","noopener");
      else toast("No link on this source — add one with Edit");
      break;
    }
    case "export": exportResult(n); break;
    default: toast("Noted");
  }
}

/* "Link or challenge a claim" means: connect this to something, and say how.
   The graph already supports exactly that, so offer it directly. */
function linkFromNode(n){
  const others=curProj().nodes.filter(x=>x.id!==n.id&&!wouldCycle(n.id,x.id)
    && !curProj().edges.some(e=>e.from===n.id&&e.to===x.id));
  if(!others.length){ toast("Nothing left to connect this to"); return; }
  openMenu(nodeEls[n.id]||el.canvas,`
    <div class="m-head">Connect to…</div>
    ${others.slice(0,12).map(x=>`<button class="mi" data-link="${x.id}"><span class="node-dot" style="width:9px;height:9px;background:${dotColor(x.type)}"></span><span>${esc(nodeHeading(x).title)}</span></button>`).join("")}
  `,m=>{
    $$("[data-link]",m).forEach(b=>b.addEventListener("click",()=>{
      const to=nodeById(b.dataset.link); closeMenus();
      curProj().edges.push({from:n.id,to:to.id,rel:inferRel(n,to)});
      relayout(); savePersist(); toast(`Connected to ${nodeHeading(to).title}`);
    }));
  });
}

/* Download what the result actually holds, rather than claiming to export. */
function exportResult(n){
  const d=curData();
  const rows=[["rank","candidate","score","uncertainty","family"]];
  ((d.candidates&&d.candidates.rows)||[]).forEach((r,i)=>rows.push([i+1,r.id,r.score,r.err==null?"":r.err,r.family||""]));
  rows.push([]); rows.push(["top fraction screened (%)","enrichment (x)","baseline (x)"]);
  const e=d.enrichment||{};
  (e.x||[]).forEach((x,i)=>rows.push([x,(e.proposed||[])[i],(e.baseline||[])[i]]));

  a.download=`${curProj().id}-results.csv`;
  a.click(); URL.revokeObjectURL(a.href);

}

/* ============================== add node ============================== */
/* ============================ graph layout ============================
   A research graph is a DAG that reads left to right: question → evidence →
   hypotheses → experiment → result → next question. Laying it out in layers
   by depth matches how people read it, and ordering each layer by the average
   position of its neighbours removes most edge crossings without needing a
   full crossing-minimisation pass. Hand-placed positions do not survive a run
   that adds dozens of claim nodes, so this has to be one click away. */
const LAYER_GAP=96, ROW_GAP=28;

function layoutGraph(p){
  const nodes=p.nodes, edges=p.edges||[];
  if(!nodes.length) return;
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const out={}, indeg={};
  for(const n of nodes){ out[n.id]=[]; indeg[n.id]=0; }
  for(const e of edges){ if(byId[e.from]&&byId[e.to]&&e.from!==e.to){ out[e.from].push(e.to); indeg[e.to]++; } }

  // Longest-path layering over a topological order, so every edge points
  // forward. Any cycle leaves nodes unvisited; those get appended at the end
  // rather than silently dropped.
  const depth={}; const queue=nodes.filter(n=>!indeg[n.id]).map(n=>n.id);
  for(const id of queue) depth[id]=0;
  const pending={...indeg};
  for(let i=0;i<queue.length;i++){
    const id=queue[i];
    for(const next of out[id]){
      depth[next]=Math.max(depth[next]??0, depth[id]+1);
      if(--pending[next]===0) queue.push(next);
    }
  }
  let maxDepth=0;
  for(const n of nodes){ if(depth[n.id]==null) depth[n.id]=null; else maxDepth=Math.max(maxDepth,depth[n.id]); }
  for(const n of nodes) if(depth[n.id]==null) depth[n.id]=maxDepth+1;   // cycle remnants

  const layers=[];
  for(const n of nodes){ (layers[depth[n.id]] ||= []).push(n); }

  // Order each layer by the mean row of its already-placed predecessors.
  const row={};
  layers.forEach((layer,li)=>{
    if(!layer) return;
    if(li>0) layer.sort((a,b)=>bary(a)-bary(b));
    layer.forEach((n,i)=>{ row[n.id]=i; });
    function bary(n){
      const ins=edges.filter(e=>e.to===n.id&&row[e.from]!=null).map(e=>row[e.from]);
      return ins.length ? ins.reduce((s,v)=>s+v,0)/ins.length : row[n.id] ?? 0;
    }
  });

  const h=n=>{ const el=nodeEls[n.id]; return (el?el.offsetHeight:92); };

  // A run can put thirty-odd claims at the same depth. Stacked in one column
  // that is a four-thousand-pixel ribbon, so a wide layer wraps into several
  // sub-columns. Depth order still reads left to right; only the within-layer
  // packing changes.
  const MAX_ROWS=6;
  const groups=[];                                    // one entry per rendered column
  for(const layer of layers){
    if(!layer||!layer.length) continue;
    const subs=Math.ceil(layer.length/MAX_ROWS), per=Math.ceil(layer.length/subs);
    for(let s=0;s<subs;s++) groups.push(layer.slice(s*per,(s+1)*per));
  }
  const colH=groups.map(g=>g.reduce((s,n)=>s+h(n)+ROW_GAP,-ROW_GAP));
  const tallest=Math.max(...colH,0);
  groups.forEach((g,i)=>{
    const x=i*(NODE_W+LAYER_GAP);
    let y=(tallest-colH[i])/2;                        // centre each column
    for(const n of g){ n.x=Math.round(x); n.y=Math.round(y); y+=h(n)+ROW_GAP; }
  });
}

function tidy(){
  layoutGraph(curProj());
  renderGraph(); savePersist(); fit(true);
  toast("Graph arranged");
}

/* Turn form values into the meta shape each pane renderer reads. */
function metaFor(type,v){
  if(type==="question")   return {objective:v.objective,outcome:v.outcome,data:v.data};
  if(type==="source")     return {sources:[{src:v.title,meta:"added by you",body:v.body,url:v.url||""}],relevance:v.relevance};
  if(type==="hypothesis") return {statement:v.statement,predictions:v.prediction?[v.prediction]:[],uncertainty:v.uncertainty};
  if(type==="experiment") return {tests:[{name:v.title,sel:true,why:v.method}],method:v.method,inputs:v.inputs,controls:v.controls,approval:"Required before run."};
  if(type==="result")     return {interp:v.interp};
  if(type==="next")       return {changed:v.changed,uncertainty:v.uncertainty,tests:[]};
  return {text:v.title};
}

/* Read a node back into the shape the form uses, so editing shows what is
   already there instead of a blank form. */
function valuesFor(n){
  const m=n.meta||{}, t=n.type;
  if(t==="question")   return {title:n.title,objective:m.objective,outcome:m.outcome,data:m.data};
  if(t==="source")     {const s0=(m.sources||[])[0]||{}; return {title:s0.src||n.title,body:s0.body,url:s0.url,relevance:m.relevance};}
  if(t==="hypothesis") return {title:n.title,statement:m.statement,prediction:(m.predictions||[])[0],uncertainty:m.uncertainty};
  if(t==="experiment") return {title:n.title,method:m.method,inputs:m.inputs,controls:m.controls};
  if(t==="result")     return {title:n.title,interp:m.interp};
  if(t==="next")       return {title:n.title,changed:m.changed,uncertainty:m.uncertainty};
  return {title:m.text||n.title};
}

function openNodeForm(type,prefill,editingId,parentId){

function createNode(type,v,parentId){
  if(!requireAccount("add to a project")) return null;
  const p=curProj(); const spec=NODE_FORM[type];
  const parentKey=parentId||state.selection;
  const id=type[0]+"-"+Math.random().toString(36).slice(2,6);
  const title=v.title.length>46?v.title.slice(0,44)+"…":v.title;
  const summary={question:v.objective,source:v.body,hypothesis:v.statement,
                 experiment:v.method,result:v.interp,next:v.changed,note:""}[type]||"";
  const n=P(id,type,title,summary.length>90?summary.slice(0,88)+"…":summary,
            type==="experiment"?"planned":"done",0,0,metaFor(type,v));
  n.origin="user";                       // distinguishes it from generated nodes
  p.nodes.push(n);
  if(parentKey&&nodeById(parentKey)) p.edges.push({from:parentKey,to:id,rel:spec.rel});
  relayout();                            // position is derived, never typed in
  selectNode(id); savePersist();
  toast(`${spec.label} added`);
  return n;
}

/* Edits replace only the fields the form owns, so anything else a run
   attached to the node (provenance, chart payloads) is left alone. */
function applyNodeEdit(n,v){
  const summary={question:v.objective,source:v.body,hypothesis:v.statement,
                 experiment:v.method,result:v.interp,next:v.changed,note:""}[n.type]||"";
  n.title=v.title.length>46?v.title.slice(0,44)+"…":v.title;
  n.summary=summary.length>90?summary.slice(0,88)+"…":summary;
  n.meta=Object.assign({},n.meta,metaFor(n.type,v));
  n.edited=true;
  renderGraph();
  if(state.selection===n.id){ renderPaneHeader(n); renderPaneBody(n); }
  savePersist();
  toast("Changes saved");
}

/* Which relation a new connection gets, inferred from what is being joined so
   the common case needs no extra click. Change it from the edge's menu. */
function inferRel(from,to){
  if(to.type==="hypothesis") return from.type==="source"?"supports":"uses";
  if(to.type==="experiment") return "tests";
  if(to.type==="result")     return "produced";
  return "uses";
}

/* Drag from a node's port onto another node to connect them. */
function beginLink(ev,from){
  ev.preventDefault(); ev.stopPropagation();
  const ghost=document.createElementNS("http://www.w3.org/2000/svg","path");
  ghost.setAttribute("class","edge-ghost");
  el.edges.appendChild(ghost);
  const vb=el.edges.getBoundingClientRect(), v=view();
  const toWorld=(cx,cy)=>({x:(cx-vb.left)/v.scale+parseFloat(el.edges.style.left||0),
                           y:(cy-vb.top)/v.scale+parseFloat(el.edges.style.top||0)});
  const a=nodeBox(from), x1=a.x+a.w, y1=a.y+a.h/2;
  let hovered=null;
  const move=e=>{
    const p=toWorld(e.clientX,e.clientY);
    ghost.setAttribute("d",`M${x1},${y1} C${x1+60},${y1} ${p.x-60},${p.y} ${p.x},${p.y}`);
    const over=document.elementFromPoint(e.clientX,e.clientY)?.closest(".node");
    const id=over?.dataset.id;
    if(id!==hovered){
      if(hovered&&nodeEls[hovered]) nodeEls[hovered].classList.remove("link-target");
      hovered=(id&&id!==from.id)?id:null;
      if(hovered) nodeEls[hovered].classList.add("link-target");
    }
  };
  const up=()=>{
    removeEventListener("pointermove",move); removeEventListener("pointerup",up);
    ghost.remove();
    if(hovered&&nodeEls[hovered]) nodeEls[hovered].classList.remove("link-target");
    if(!hovered) return;
    const to=nodeById(hovered); const p=curProj();
    if(p.edges.some(e=>e.from===from.id&&e.to===hovered)){ toast("Already connected"); return; }
    if(wouldCycle(from.id,hovered)){ toast("That would make a loop"); return; }
    p.edges.push({from:from.id,to:hovered,rel:inferRel(from,to)});
    renderGraph(); savePersist();
    toast(`${from.title} → ${to.title}`);
  };
  addEventListener("pointermove",move); addEventListener("pointerup",up);
}

/* The layout reads left to right, so a connection that closes a loop has no
   sensible place to sit. Refuse it rather than draw something misleading. */
function wouldCycle(fromId,toId){
  const p=curProj(); const seen=new Set(); const stack=[toId];
  while(stack.length){
    const cur=stack.pop();
    if(cur===fromId) return true;
    if(seen.has(cur)) continue; seen.add(cur);
    for(const e of p.edges) if(e.from===cur) stack.push(e.to);
  }
  return false;
}

function deleteNode(id){
  const p=curProj(); const n=nodeById(id); if(!n) return;
  const generated=n.origin!=="user";
  const go=()=>{
    p.nodes=p.nodes.filter(x=>x.id!==id);
    p.edges=p.edges.filter(e=>e.from!==id&&e.to!==id);
    const pv=state.previews[p.id]; if(pv) delete pv[id];
    if(p.primaryExp===id) p.primaryExp=null;
    if(p.resultNode===id) p.resultNode=null;
    if(state.selection===id) clearSelection();
    relayout(); savePersist();
    toast(`Deleted “${n.title}”`);
  };
  // Removing something a run produced loses part of the record, so confirm it.
  if(!generated) return go();
  modal(`
    <div class="modal-head"><div><h2>Delete this node?</h2>
      <p>“${esc(n.title)}” came from the run, not from you. Deleting it removes it from the record along with its connections.</p></div></div>

      <button class="btn danger" id="delGo">Delete</button></div>
  `,root=>{ root.querySelector("#delGo").addEventListener("click",()=>{ closeModal(); go(); }); });
}

/* Re-space the graph after anything structural changes. */
function relayout(){ layoutGraph(curProj()); renderGraph(); requestAnimationFrame(()=>fit(true)); }

/* =============================== menus =============================== */
function closeMenus(){
  $$(".menu").forEach(m=>m.remove());
  $$(".node.context-target").forEach(d=>d.classList.remove("context-target"));
  document.removeEventListener("pointerdown",menuOutside,true);
}
function menuOutside(e){ if(!e.target.closest(".menu")&&!e.target.closest("[aria-haspopup]")) closeMenus(); }
/* Same menu, placed at a point instead of under an element — for right-click. */
/* Place a menu without letting it paint in the wrong spot first.
   Appending an absolutely-positioned element with no coordinates renders it
   at its static position — near the top of the page — and only the following
   style writes move it to the pointer. That is the jump: it appears high and
   snaps down. Measuring while hidden, then revealing, means it only ever
   paints where it belongs. */
function placeMenu(m,x,y,flipFrom){
  m.style.visibility="hidden";
  m.style.left="0px"; m.style.top="0px";
  document.body.appendChild(m);
  const w=m.offsetWidth, h=m.offsetHeight;
  let left=x, top=y;
  if(left+w>innerWidth-10)  left=(flipFrom!=null?innerWidth-w-10:x-w);
  if(top+h>innerHeight-10)  top=(flipFrom!=null?flipFrom-h-6:y-h);
  m.style.left=Math.max(10,left)+"px";
  m.style.top=Math.max(10,Math.min(top,innerHeight-h-10))+"px";
  m.style.visibility="";
  return m;
}
function buildMenu(html){
  const m=document.createElement("div"); m.className="menu"; m.innerHTML=html; return m;
}
function armMenuDismiss(){
  setTimeout(()=>document.addEventListener("pointerdown",menuOutside,true),0);
}

/* Menu at a point — for right-click. */
function openMenuAt(x,y,html,onwire){
  closeMenus();
  const m=placeMenu(buildMenu(html),x,y);
  if(onwire)onwire(m);
  armMenuDismiss();
  return m;
}

/* Menu under an element — for toolbar buttons. */
function openMenu(anchor,html,onwire){
  closeMenus();
  const r=anchor.getBoundingClientRect();
  const m=placeMenu(buildMenu(html),r.left,r.bottom+6,r.top);
  if(onwire)onwire(m);
  armMenuDismiss();
  return m;
}

/* ------------------------- create / delete ---------------------------- */
/* A new project starts from the demo graph rather than an empty canvas: the
   node types, the experiment wiring and the result node all have to exist for
   Run to have anything to drive, and an empty graph cannot express that. */
/* An empty-but-wired graph. Used when scaffolding is unavailable, and as the
   shape the scaffolder fills. It carries no content from any other project:
   a new project about batteries must never inherit NDM-1's question, which is
   what cloning the demo used to do. */
function blankGraph(name,question){
  const L={q1:[40,300],ev1:[300,300],hA:[560,170],hB:[560,430],exp:[830,300],res:[1100,250],next:[1380,140]};
  const N=(id,type,title,summary,meta)=>({id,type,title,summary,status:"planned",x:L[id][0],y:L[id][1],meta:meta||{}});
  return {
    name,icon:"flask",run:"Experiment 01",question:question||"",
    primaryExp:"exp",resultNode:"res",scaffolded:false,
    nodes:[
      N("q1","question","Research question",question||"Describe the question this project answers",
        question?{objective:question}:{}),
      N("ev1","source","Evidence","No sources recorded yet",
        {sources:[],relevance:"Add sources here. Citations are never generated — an invented reference is worse than a missing one."}),
      N("hA","hypothesis","Hypothesis A","Describe a candidate explanation",{}),
      N("hB","hypothesis","Hypothesis B","Describe a competing explanation",{}),
      N("exp","experiment","Experiment 01","Describe the test that separates them",{approval:"Required before run."}),
      N("res","result","Results","Not yet run",{}),
      N("next","next","Next experiment","Choose a test",{})
    ],
    edges:[{from:"q1",to:"ev1",rel:"uses"},{from:"ev1",to:"hA",rel:"supports"},
      {from:"ev1",to:"hB",rel:"supports"},{from:"hA",to:"exp",rel:"tests"},
      {from:"hB",to:"exp",rel:"tests"},{from:"exp",to:"res",rel:"produced"},
      {from:"res",to:"next",rel:"uses"}]
  };
}

async function createProject(){
  const name=(prompt("Name the new project","Untitled project")||"").trim();
  if(!name) return;
  const question=(prompt("What question should this project answer?\n\nLeave blank to start from an empty graph.","")||"").trim();

  // Ask the backend to design the opening plan for *this* topic. Everything
  // it proposes lands on editable nodes, so the user reads and corrects it
  // before any of it can reach an exported paper.
  let doc=null;
  if(question){
    toast("Designing the research plan…");
    try{
      const r=await api("/api/scaffold",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name,question})});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j.ok&&j.doc) doc=j.doc;
      else toast(j.reason||"Scaffolding unavailable — starting from an empty graph");
    }catch(e){ toast("Offline — starting from an empty graph"); }
  }
  if(!doc) doc=blankGraph(name,question);

  try{
    const r=await api("/api/projects",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({doc})});
    if(!r.ok){ const j=await r.json().catch(()=>({})); toast(j.error||"Could not create project"); return; }
    const j=await r.json();
    state.projects[j.id]=doc; PROJECT_ORDER.push(j.id);
    renderProjects(); switchProject(j.id);
    toast(`Created “${name}”`);
  }catch(e){ toast("Offline — could not create project"); }
}

async function deleteCurrentProject(){
  const sid=state.project, p=state.projects[sid];
  if(!p) return;
  if(!confirm(`Delete “${p.name}”? This cannot be undone.`)) return;
  try{
    const r=await api("/api/projects/"+encodeURIComponent(sid),{method:"DELETE"});
    if(!r.ok){ const j=await r.json().catch(()=>({})); toast(j.error||"Could not delete project"); return; }
  }catch(e){ toast("Offline — could not delete project"); return; }
  delete state.projects[sid];
  delete state.view[sid]; delete state.previews[sid];
  PROJECT_ORDER=PROJECT_ORDER.filter(x=>x!==sid);
  toast(`Deleted “${p.name}”`);
  if(PROJECT_ORDER.length){ switchProject(PROJECT_ORDER[0]); }
  else{ // last project gone: fall back to a local, unsaved demo canvas
    loadDemoOnly(); renderProjects(); renderCrumb(); renderGraph(); fit(false);
  }
}

/* Take the charts, shortlist and headline stats from a finished run. The
   bundled sample stays selectable, so a viewer can always see which is which. */
/* Replace the project's graph with what the run produced. The previous graph
   was this project's previous answer, so keeping both would leave two
   unrelated investigations on one canvas. Anything the user added by hand is
   carried over, because they did not ask for it to be thrown away. */
function adoptRunGraph(g){
  if(!g||!g.nodes||!g.nodes.length) return;
  const p=curProj();
  const mine=p.nodes.filter(n=>n.origin==="user");
  const mineIds=new Set(mine.map(n=>n.id));
  const keptEdges=p.edges.filter(e=>mineIds.has(e.from)&&mineIds.has(e.to));
  p.nodes=g.nodes.map(n=>Object.assign(
    P(n.id,n.type,n.title,n.summary||"",n.status||"done",0,0,n.meta||{}),{origin:"run"}));
  p.edges=g.edges.slice();
  p.nodes.push(...mine); p.edges.push(...keptEdges);
  p.primaryExp=null;
  p.resultNode=null;
  relayout(); savePersist();
  toast(`Graph rebuilt from the run — ${g.nodes.length} nodes`);
}

function adoptRunData(data){
  if(!data||!data.charts) return;
  CHART_DATA.live=data.charts;
  // Write the interpretation from what the run measured, replacing whatever
  // text the node was carrying. No prose about results that did not happen.
  const res=nodeById(curProj().resultNode);
  if(res){
    const f=v=>v==null?"n/a":(Math.round(v*100)/100);
    res.meta=Object.assign({},res.meta,{
      interp:`Ranked ${data.n_compounds??"?"} compounds. ROC-AUC ${f(data.roc_auc)} on a held-out scaffold split; `
            +`enrichment ${f(data.ef_top1pct)}x at the top 1% and ${f(data.ef_top5pct)}x at 5%. `
            +`The critic ${data.passed?"accepted":"did not accept"} this result.`
            +(data.next?` Suggested next: ${data.next}`:""),
      provenance:{run:"this session",data:data.source||"unknown",
                  params:`${data.n_test??"?"} held-out compounds`,approvals:"approved in this session"}
    });
  }
  updateProvenance();
  if(state.selection){ const n=nodeById(state.selection); if(n&&n.type==="result") renderPaneBody(n); }
  renderPreviews(); savePersist();
}
function projectHasData(){ return hasResults(); }
function updateProvenance(){
  const d=curData();
  // The sample charts belong to NDM-1. Other projects have no measured
  // data, so the badge says that instead of borrowing the wrong label.
  if(!projectHasData()){
    el.provenance.dataset.kind="none";
    el.provText.textContent="No results yet";
    el.provTextLong.textContent="· run an experiment to produce some";
    return;
  }
  // Once a run has happened the displayed data is measured, so the badge must
  // stop calling it sample data.
  const showingMeasured = hasResults();
  el.provenance.dataset.kind = state.run.active
    ? (state.run.mode==="live"?"live":"replay")
    : (showingMeasured?"live":"sample");
  if(state.run.active){ el.provText.textContent = state.run.mode==="live"?"Live Omnigent run":"Replaying trace"; el.provTextLong.textContent=""; }

/* One cheap model call turns a vague question into one the lab can work on.
   The rewrite is offered, never applied silently: the author decides. */
function wireSharpen(root,field){
  const btn=root.querySelector("#sharpenBtn"), out=root.querySelector("#sharpenOut");
  if(!btn||!out) return;
  btn.addEventListener("click",async()=>{
    const q=field.value.trim();
    if(!q){ field.focus(); return; }
    btn.disabled=true; btn.textContent="Sharpening…";
    out.hidden=false;
    out.innerHTML=`<div class="sharpen"><div class="sharpen-wait">Asking the model…</div></div>`;
    try{
      const r=await api("/api/refine-question",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
      const j=await r.json();
      if(!r.ok){ out.innerHTML=`<div class="sharpen"><div class="sharpen-wait">${esc(j.error||"Could not sharpen this")}</div></div>`; return; }
      out.innerHTML=`
        <div class="sharpen">
          ${j.tooBroad?`<div class="sharpen-flag">This is broad enough that no single run could answer it.</div>`:""}
          <div class="sharpen-q">${esc(j.refined)}</div>
          ${j.changes&&j.changes.length?`<ul class="sharpen-list">${j.changes.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}
          ${j.missing&&j.missing.length?`<div class="sharpen-sub">Still yours to decide: ${j.missing.map(esc).join("; ")}</div>`:""}
          <div class="sharpen-actions">
            <button type="button" class="btn primary" id="useRefined">Use this</button>
            <button type="button" class="btn" id="keepMine">Keep mine</button>
          </div>
        </div>`;
      out.querySelector("#useRefined").addEventListener("click",()=>{
        field.value=j.refined; out.hidden=true; out.innerHTML=""; field.focus();
      });
      out.querySelector("#keepMine").addEventListener("click",()=>{ out.hidden=true; out.innerHTML=""; });
    }catch(e){
      out.innerHTML=`<div class="sharpen"><div class="sharpen-wait">Could not reach the model.</div></div>`;
    }finally{ btn.disabled=false; btn.textContent="Sharpen with AI"; }
  });
}

$("#runBtn").addEventListener("click",async()=>{

  if(sel&&sel.type==="experiment"){ openRunModal(sel.id); return; }
  // Otherwise the question decides, not whether an experiment happens to
  // exist: a project can hold a compound screen and still be asked something
  // the screen cannot answer.
  const q=(questionNode()||{}).meta?.objective||state.question||"";
  let mode="literature", why="";
  try{
    const r=await api("/api/resolve?q="+encodeURIComponent(q));

  }catch(e){}
  const expId=curProj().primaryExp;
  if(mode==="screen"&&expId&&nodeById(expId)) openRunModal(expId);
  else openResearchModal(why);
});

async function startRun(expId){
  if(state.run.active) return;
  const exp=expId?nodeById(expId):null;
  if(expId&&!exp) return;
  // reset downstream
  state.run.active=true; state.run.log=[]; state.run.id++;
  const runId="r-"+String(state.run.id).padStart(2,"0");
  const live=await hasBackend();
  state.run.mode=live?"live":"replay";
  updateProvenance();
  el.runbar.hidden=false; $("#runTxt").textContent=live?"Live Omnigent run":"Replaying trace";
  $("#runSub").textContent="· "+runId;
  if(expId) setStatus(expId,"running");
  // open the result node's Activity tab so events stream where the user can watch
  const resId=curProj().resultNode;
  if(resId){ selectNode(resId); const rn=nodeById(resId); rn._tab="activity"; renderPaneBody(rn); }
  if(live) runViaBackend(expId,runId); else runReplay(expId,runId);
}

  if(state.view[state.project]) applyTransform(false); else fit(false);

async function refreshAuth(){
  try{
    const r=await api("/api/me");
    if(!r.ok) throw new Error("no auth endpoint");
    const j=await r.json();
    AUTH.user=j.user; AUTH.mayRun=!!j.mayRun; AUTH.avatar=j.avatar; AUTH.reachable=true;

function logEvent(ev){

function finishRun(expId,runId,aborted){

function runReplay(expId,runId){
  const pid=curProj().id;
  const steps = pid==="ndm1" ? [
    [300, ()=>logEvent({agent:"Omnigent (PI)",msg:"Approved r-03 · dispatching sub-agents",st:"done"})],
    [700, ()=>{logEvent({agent:"Literature",msg:"Scanning sources for NDM-1 inhibitor priors…",st:"running"}); runSub("literature");}],
    [1700,()=>logEvent({agent:"Literature",msg:"12 sources scanned · 3 chelation-warhead claims grounded",st:"done"})],
    [1900,()=>{logEvent({agent:"Extractor",msg:"Building labelled fixture (scaffold split)…",st:"running"}); runSub("extractor");}],
    [2800,()=>{logEvent({agent:"Extractor",msg:"RDKit fingerprints + Bemis–Murcko scaffolds ready",st:"done"}); setStatus("hA","done"); setStatus("hB","done");}],
    [3100,()=>{logEvent({agent:"Hypothesizer",msg:"Diversity-aware screen ranked above potency-only",st:"done"}); runSub("hypothesizer");}],
    [3400,()=>{logEvent({agent:"Screener",msg:"Random-forest rank over candidate pool…",st:"running"}); runSub("screener");}],
    [4600,()=>{logEvent({agent:"Screener",msg:"Enrichment 11.3× @ top 1% · 5 candidates advanced",st:"done"}); setStatus("rank","done"); pulse("rank");}],
    [5000,()=>{logEvent({agent:"Critic",msg:"Controls clean · random 1.05× · y-scramble AUC 0.52",st:"done"}); runSub("critic");}],
    [5600,()=>finishRun(expId,runId)]
  ] : [
    [300, ()=>logEvent({agent:"Omnigent (PI)",msg:`Approved ${runId} · dispatching sub-agents`,st:"done"})],
    [800, ()=>logEvent({agent:"Literature",msg:"Gathering evidence…",st:"running"})],
    [1700,()=>{logEvent({agent:"Literature",msg:"Evidence grounded",st:"done"}); nodeFirstHyp();}],
    [2100,()=>logEvent({agent:"Screener",msg:"Ranking candidates…",st:"running"})],
    [3300,()=>logEvent({agent:"Screener",msg:"Ranking complete",st:"done"})],
    [3700,()=>{logEvent({agent:"Critic",msg:"Controls checked",st:"done"}); finishRun(expId,runId);}]
  ];
  state.run.timers.forEach(clearTimeout); state.run.timers=[];
  const t0=Date.now();
  for(const [dt,fn] of steps){ state.run.timers.push(setTimeout(()=>{ if(state.run.active||dt<100) fn(); updateRunSub(Date.now()-t0); },reduceMotion?Math.min(dt,400):dt)); }
}

async function runViaBackend(expId,runId){
  try{
    const ctl=new AbortController(); state.run.abort=ctl;
    const res=await api("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({project:curProj().id,experiment:expId,runId,        question:state.question||curProj().question||"",
        aid:(state.opts&&state.opts.aid)||null}),signal:ctl.signal});
    // Busy is not failure. One run happens at a time because two will not fit
    // in the instance's memory, so wait for the slot instead of giving up --
    // during a demo the second person should queue, not see an error.
    if(res.status===429){
      const j=await res.json().catch(()=>({}));
      if(state.run.waits==null) state.run.waits=0;
      if(state.run.waits===0) logEvent({agent:"Relay",msg:j.error||"Waiting for the current run to finish",st:"running"});
      if(state.run.waits++ < 40 && state.run.active){
        $("#runTxt").textContent="Waiting for "+(j.busyWith||"another run");
        await new Promise(r=>setTimeout(r,6000));
        return runViaBackend(expId,runId);          // try again for the slot
      }
      logEvent({agent:"Relay",msg:"Gave up waiting for the server",st:"failed"});
      if(expId) setStatus(expId,"planned"); finishRun(expId,runId,true); toast("Server stayed busy");
      return;
    }
    // A refused run is not a dropped stream: say why instead of quietly replaying.
    if(res.status===401||res.status===403){
      const j=await res.json().catch(()=>({}));
      const why=j.error||"Not authorised to start a run";
      logEvent({agent:"Relay",msg:why,st:"failed"});
      if(expId) setStatus(expId,"planned"); finishRun(expId,runId,true);
      toast(why); refreshAuth();
      return;
    }
    state.run.waits=0;
    if(!res.ok||!res.body) throw new Error("no stream");
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){ const {value,done}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true});
      let idx; while((idx=buf.indexOf("\n\n"))>=0){ const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const line=chunk.split("\n").find(l=>l.startsWith("data:")); if(!line)continue;
        try{ applyBackendEvent(JSON.parse(line.slice(5).trim()),expId,runId); }catch(e){}
      }
    }
    finishRun(expId,runId);
  }catch(e){ // fall back to replay if the live stream drops
    if(state.run.active){ logEvent({agent:"Relay",msg:"Live stream unavailable — replaying labelled trace",st:"failed"}); state.run.mode="replay"; updateProvenance(); $("#runTxt").textContent="Replaying trace"; runReplay(expId,runId); }
  }
}
function applyBackendEvent(ev,expId,runId){
  if(ev.type==="status"&&ev.node) setStatus(ev.node,ev.status);
  else if(ev.type==="act"){
    logEvent({agent:ev.agent||"agent",msg:ev.msg||"",st:ev.st||"done"});
    // A literature run has no result node, so the activity log has nowhere to
    // show. Put the latest stage in the run bar so it is not a blank wait.
    const sub=$("#runSub");
    if(sub) sub.textContent="· "+(ev.agent?ev.agent+": ":"")+(ev.msg||"").slice(0,70);
  }
  // A research run returns a graph rather than a chart: claims, the
  // hypotheses drawn from them, and the gap worth going after next.
  else if(ev.type==="plan"){
    const p=ev.data||{};
    logEvent({agent:"Relay",
      msg:p.mode==="literature"
        ? `Literature review — ${p.why}`
        : `Compound screen — ${p.why}`, st:"done"});
    state.run.plan=p;
  }
  else if(ev.type==="graph"){ adoptRunGraph(ev.data); }
  else if(ev.type==="result"){
    // Adopt this run's own charts, tables and shortlist. Until a run happens
    // the canvas shows the bundled sample; from here it shows what was measured.
    adoptRunData(ev.data);
    // Record the run against the project. This is what makes the exported
    // report describe *this* project's run rather than a stored example:
    // every figure and every number in the paper is read back from here.
    if(ev.data){
      const p=curProj();
      if(p){ p.results=Object.assign({},ev.data,{recordedAt:new Date().toISOString(),runId:runId}); savePersist(); }
    }
    if(ev.node){ setStatus(ev.node,"done"); togglePreview(ev.node,true); }
  }
  // A server-side failure is reported as itself, not hidden behind a replay.
  else if(ev.type==="error"){
    logEvent({agent:"Relay",msg:ev.msg||"Run failed on the server",st:"failed"});
    if(expId) setStatus(expId,"failed"); state.run.failed=true;
    finishRun(expId,runId,true); toast(ev.msg||"Run failed");
  }
  else if(ev.type==="done"){ finishRun(expId,runId); }
}
