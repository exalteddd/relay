/* ============================== report ================================
   Assembles the project into a paper. Everything here is derived from the
   graph, the chart data and the run log -- the report cannot state a result
   the workspace does not hold. The three narrative sections may be replaced
   by model-written prose (see writeNarrative), which is constrained to the
   same facts and is labelled in the byline when used. */
const NARRATIVE={abstract:"",discussion:"",limitations:"",source:"assembled",model:"",
  verified:false, verifyError:null, removed:[]};

/* --- figures, derived from what the project actually recorded ----------
   The figure set is built per project, from `project.results` (written by a
   run) and, for the bundled demos, from their stored chart data. Nothing is
   modelled to fill a gap: a metric the project has not measured produces a
   figure that says so. In particular an ROC curve is drawn only from real
   (fpr, tpr) pairs -- a curve reconstructed from a single AUC value would be
   a drawing of an assumption, not of a result. */
function projResults(){ const p=curProj(); return (p&&p.results)||null; }

function buildFigures(){
  const d=curData(), r=projResults(), f=(r&&r.figures)||{};
  const out=[];

  // Figure: enrichment against screening depth
  if((f.enrichment_curve||[]).length){
    const depths=f.enrichment_curve.map(p=>p[0]);
    const series=[{name:"Model ranking",values:f.enrichment_curve.map(p=>p[1])}];
    if((f.random_curve||[]).length) series.push({name:"Random ranking (control)",values:f.random_curve.map(p=>p[1]),color:"--series-2"});
    out.push({id:"enrich",kind:"area",x:depths,series,
      xlabel:"Fraction of library screened (%)", ylabel:"Enrichment factor (×)",
      caption:"Enrichment factor as a function of how deep into the ranked library the assay budget reaches, against a random-ranking control measured on the same held-out set.",
      title:"Enrichment versus screening depth"});
  }else if(d&&d.enrichment){
    out.push(Object.assign({id:"enrich",kind:"enrichment",
      caption:"Enrichment factor against screening depth, from the run recorded in this session.",
      },d.enrichment));
  }

  // Figure: ROC on the held-out split
  out.push({id:"roc",kind:"roc",points:f.roc_curve||[],auc:r?r.roc_auc:null,
    title:"ROC — held-out scaffold-disjoint split",
    caption:"Receiver operating characteristic on the held-out split, with the chance diagonal shown for reference. Drawn only from measured (FPR, TPR) pairs."});

  // Figure: score separation between classes
  if((f.score_bins||[]).length){
    out.push({id:"dist",kind:"dist",bins:f.score_bins,
      groups:[{name:"Known actives",counts:f.score_hist_active||[]},
              {name:"Known inactives",counts:f.score_hist_inactive||[],color:"--series-2"}],
      xlabel:"Predicted score", ylabel:"Compounds",
      title:"Predicted-score distribution by true class",
      caption:"Distribution of predicted scores for known actives and inactives in the held-out set. The separation between the two is what the AUC above summarises as a single number."});
  }

  // Figure: method against its controls
  if(r){
    const rows=[];
    if(r.ef_top1pct!=null) rows.push({label:"Model · top 1%",value:r.ef_top1pct});
    if(r.ef_top5pct!=null) rows.push({label:"Model · top 5%",value:r.ef_top5pct});
    if(r.control_random_ef1!=null) rows.push({label:"Random ranking",value:r.control_random_ef1,tone:"control"});
    if(rows.length>1){
      out.push({id:"controls",kind:"controls",rows,unit:"×",nullBand:[0,1.2],
        xlabel:"Enrichment factor (× over base rate)",
        title:"Method against its negative control",
        caption:"Enrichment achieved by the ranking against a random-ranking control. The shaded band marks the region indistinguishable from chance; a control falling inside it is the expected, passing outcome."});
    }
  }

  // Figure: ranked candidates
  if(d&&d.candidates&&(d.candidates.rows||[]).length){
    out.push(Object.assign({id:"cands",kind:"candidates",
      caption:"Top-ranked candidates with their predicted scores and uncertainty, as ranked by the recorded run.",
      },d.candidates));
  }
  return out;
}

function byType(t){ return (curProj().nodes||[]).filter(n=>n.type===t); }
function firstOf(t){ return byType(t)[0]||null; }
function m(n){ return (n&&n.meta)||{}; }
/* Rationales are written as standalone sentences; splicing one into the middle
   of another sentence needs its leading capital dropped -- but not on an
   acronym or a flag like "RDKit" or "--aid", where the capital is the word. */
function lowerFirst(s){
  if(!s) return s;
  if(/^[A-Z]{2,}/.test(s)||/^[^A-Za-z]/.test(s)) return s;
  return s[0].toLowerCase()+s.slice(1);
}
function list(items){
  if(!items||!items.length) return "";
  return `<ul>${items.map(i=>`<li>${esc(typeof i==="string"?i:(i.name||""))}</li>`).join("")}</ul>`;
}

/* --- assembled prose -------------------------------------------------- */
/* Deterministic fallbacks. They are written to be honest rather than
   impressive: every clause is conditional on the data actually being there. */
function assembledAbstract(){
  const q=m(firstOf("question")), ex=m(firstOf("experiment"));
  const res=byType("result").map(m).find(x=>x.interp);
  const ev=m(firstOf("source"));
  const bits=[];
  if(q.objective) bits.push(q.objective);
  if(ev&&ev.relevance) bits.push(`Evidence base: ${ev.relevance.replace(/\.$/,"")}.`);
  if(ex.method) bits.push(`Method: ${ex.method.replace(/\.$/,"")}, with ${ex.controls||"no declared controls"}.`);
  if(res&&res.interp) bits.push(res.interp);
  if(!projResults()) bits.push("No run has been recorded for this project, so no measured result is reported here.");
  return bits.join(" ");
}
function assembledDiscussion(){
  const res=byType("result").map(m).find(x=>x.interp);
  const ex=m(firstOf("experiment"));
  const hyps=byType("hypothesis");
  const out=[];
  if(res&&res.interp) out.push(res.interp);
  if(ex.controls) out.push(`The result is interpretable only because the controls behaved as required: ${ex.controls}. A ranking that beat random while the controls also looked strong would indicate a leak in the split rather than a real signal.`);
  if(hyps.length>1) out.push(`Two hypotheses were carried in parallel (${hyps.map(h=>esc(h.title)).join(" and ")}), so the experiment was built to separate them rather than to confirm a single favoured explanation.`);
  return out.join("\n\n");
}
function assembledLimitations(){
  const q=m(firstOf("question")), ev=m(firstOf("source"));
  const out=[];
  if(!projResults()) out.push("This project has no recorded run, so nothing here may be read as a measured finding.");
  if(q.scope) out.push(q.scope);
  if(ev.limitations) out.push(ev.limitations);
  if(q.constraints) out.push(q.constraints);
  out.push("This work ranks candidates from assay-derived labels. It does not establish binding, and it cannot distinguish a genuine inhibitor from a compound that registers as active across many unrelated assays. Any candidate taken forward needs orthogonal confirmation.");
  return out.join(" ");
}

/* --- sections --------------------------------------------------------- */
function secQuestion(){
  const n=firstOf("question"); if(!n) return "";
  const q=m(n);
  const rows=[["Objective",q.objective],["Scope",q.scope],["Success measure",q.outcome],
              ["Constraints",q.constraints],["Data",q.data],["Budget",q.budget]]
    .filter(r=>r[1]).map(r=>`<tr><th style="width:150px">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join("");
  return `<section><h2>1 · Question and objective</h2>
    <p>${esc(n.summary||n.title)}</p>${rows?`<table>${rows}</table>`:""}</section>`;
}
function secEvidence(){
  const n=firstOf("source"); if(!n) return "";
  const e=m(n);
  // Numbering matches the reference list exactly: both walk the same records
  // in the same order, so [3] in the table is [3] in the bibliography.
  const refs=refList();
  const rows=refs.map((s,i)=>`<tr><td class="num">[${i+1}]</td><td>${esc(s.src)}</td><td class="muted">${esc(s.meta)}</td>
      <td>${esc(s.rel||"—")}</td><td>${esc(s.body)}</td></tr>`).join("");
  return `<section><h2>2 · Evidence base</h2>
    ${e.relevance?`<p>${esc(e.relevance)}</p>`:""}
    ${rows?table("Sources on record, with the bearing each has on the question. Numbers match the reference list in §11.",
        `<thead><tr><th>#</th><th>Source</th><th>Type</th><th>Relation</th><th>Bearing on the question</th></tr></thead>`,rows):""}
    ${e.limitations?`<div class="callout warn"><b>Evidence limitation.</b> ${esc(e.limitations)}</div>`:""}</section>`;
}
function secHypotheses(){
  const hs=byType("hypothesis"); if(!hs.length) return "";
  const blocks=hs.map((n,i)=>{
    const h=m(n);
    return `<h3>${esc(n.title)} — ${esc(n.summary||"")}</h3>
      ${h.statement?`<p>${esc(h.statement)}</p>`:""}
      ${h.predictions&&h.predictions.length?`<p class="muted"><b>Predictions if true.</b></p>${list(h.predictions)}`:""}
      ${h.supports&&h.supports.length?`<p class="muted"><b>Supporting evidence.</b></p>${list(h.supports)}`:""}
      ${h.contradict&&h.contradict.length?`<p class="muted"><b>Evidence against / risk.</b></p>${list(h.contradict)}`:""}
      ${h.uncertainty?`<p class="muted"><b>Confidence.</b> ${esc(h.uncertainty)}</p>`:""}`;
  }).join("");
  return `<section><h2>3 · Hypotheses considered</h2>
    <p>${hs.length} competing hypotheses were carried forward, so the experiment below is designed to discriminate between them rather than to confirm one.</p>
    ${blocks}</section>`;
}
function secMethods(){
  const n=firstOf("experiment"); if(!n) return "";
  const x=m(n);
  const tests=(x.tests||[]).map(t=>`<tr><td>${esc(t.name)} ${t.sel?`<span class="tag sel">selected</span>`:`<span class="tag">considered</span>`}</td><td>${esc(t.why||"")}</td></tr>`).join("");
  const rows=[["Method",x.method],["Inputs",x.inputs],["Baseline",x.baseline],["Controls",x.controls],
              ["Parameters",x.params],["Approval",x.approval],["Budget",x.cost]]
    .filter(r=>r[1]).map(r=>`<tr><th style="width:150px">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join("");
  return `<section><h2>4 · Method</h2>
    <p><b>${esc(n.title)}</b> — ${esc(n.summary||"")}</p>
    ${tests?`<h3>Candidate tests weighed</h3><table><thead><tr><th>Test</th><th>Rationale</th></tr></thead><tbody>${tests}</tbody></table>`:""}
    ${rows?`<h3>Protocol</h3><table>${rows}</table>`:""}</section>`;
}
/* Figure and table numbering is assigned as the paper is assembled, so the
   captions stay correct however many figures a given project has data for. */
let FIGN=0, TABN=0;
function figure(f){
  const svg=figureSVG(f); if(!svg) return "";
  FIGN++;
  return `<figure class="fig"><div class="chart">
      <div class="fig-title">${esc(f.title||"")}</div>
      ${f.sub?`<div class="fig-sub">${esc(f.sub)}</div>`:""}
      ${svg}</div>
    <figcaption><b>Figure ${FIGN}.</b> ${esc(f.caption||f.title||"")}</figcaption></figure>`;
}
function table(caption,head,bodyRows){
  if(!bodyRows) return "";
  TABN++;
  return `<div class="tbl-wrap"><div class="tbl-cap"><b>Table ${TABN}.</b> ${esc(caption)}</div>
    <table>${head}<tbody>${bodyRows}</tbody></table></div>`;
}

function secResults(){
  const d=curData(), r=projResults();
  const figs=buildFigures();

  // Measured scalars, read back from the project's own recorded run.
  // Precision is set per measure, not globally. An AUC rounded to two places
  // turns a scramble control of 0.503 into "0.5", which reads as a round
  // number rather than as the measurement it is; enrichment factors, by
  // contrast, carry no meaning past two places.
  const mrows=[
    ["Ranking accuracy (ROC-AUC)", r&&r.roc_auc, 3, "held-out, scaffold-disjoint split"],
    ["Enrichment @ top 1%", r&&r.ef_top1pct, 2, "× over the base hit rate"],
    ["Enrichment @ top 5%", r&&r.ef_top5pct, 2, "× over the base hit rate"],
    ["Control — random ranking", r&&r.control_random_ef1, 2, "must sit at ≈1× for the result to mean anything"],
    ["Control — label scramble (AUC)", r&&r.control_yscramble_auc, 3, "must collapse to ≈0.5"],
  ].filter(x=>x[1]!=null)
   .map(x=>`<tr><td>${esc(x[0])}</td><td class="num"><b>${Number(x[1]).toFixed(x[2])}</b></td><td class="muted">${esc(x[3])}</td></tr>`).join("");

  const srows=[
    ["Compounds in library", r&&r.n_compounds],["Known actives", r&&r.n_active],
    ["Base hit rate", r&&r.base_rate!=null?(Math.round(r.base_rate*1e4)/100)+"%":null],
    ["Training compounds", r&&r.n_train],["Held-out compounds", r&&r.n_test],
  ].filter(x=>x[1]!=null)
   .map(x=>`<tr><td>${esc(x[0])}</td><td class="num">${esc(String(x[1]))}</td></tr>`).join("");

  const interp=byType("result").map(m).filter(x=>x.interp);
  const stats=((d&&d.stats)||[]).map(s=>`<tr><td>${esc(s.lab)}</td><td class="num"><b>${esc(s.val)}</b></td><td class="muted">${esc(s.sub||"")}</td></tr>`).join("");

  return `<section><h2>5 · Results</h2>
    ${!r?`<div class="callout warn"><b>No run recorded for this project.</b> The figures below render only what has been measured; sections without data state their absence rather than showing a placeholder curve.</div>`:""}
    ${srows?table("Composition of the screened set and the train/test split.",
        `<thead><tr><th>Quantity</th><th class="num">Value</th></tr></thead>`,srows):""}
    ${mrows?table("Measured performance on the held-out split, with both negative controls.",
        `<thead><tr><th>Measure</th><th class="num">Value</th><th>Basis</th></tr></thead>`,mrows)
      :(stats?table("Headline measures.",`<thead><tr><th>Measure</th><th class="num">Value</th><th>Basis</th></tr></thead>`,stats):"")}
    ${figs.map(figure).join("")}
    ${interp.length?`<h3>5.1 · Interpretation</h3>${interp.map(x=>`<p>${esc(x.interp)}</p>`).join("")}`:""}</section>`;
}

/* --- references --------------------------------------------------------
   Built only from sources recorded on the project's evidence nodes. The
   renderer never supplies a DOI, a year, a venue or an author it was not
   given: an entry with only a title is printed with only a title. A paper
   that invents a citation is worse than one that cites sparsely. */
function refList(){
  const out=[];
  for(const n of byType("source")){
    for(const s of (m(n).sources||[])){
      if(!s||!s.src) continue;
      out.push({src:s.src, meta:s.meta||"", body:s.body||"", url:s.url||"", doi:s.doi||"", rel:s.rel||""});
    }
  }
  return out;
}
function secReferences(){
  const refs=refList();
  if(!refs.length) return `<section><h2>11 · References</h2>
    <p class="muted">No sources are recorded on this project's evidence nodes. Add evidence in the workspace and they will be cited here.</p></section>`;
  const items=refs.map((x,i)=>`<li id="ref${i+1}">
      <span class="ref-src">${esc(x.src)}</span>${x.meta?` <span class="muted">(${esc(x.meta)})</span>`:""}
      ${x.doi?` <span class="muted">doi:${esc(x.doi)}</span>`:""}
      ${x.url?` <span class="muted">${esc(x.url)}</span>`:""}
    </li>`).join("");
  return `<section><h2>11 · References</h2>
    <ol class="reflist">${items}</ol>
    <p class="muted" style="margin-top:10px">Entries are reproduced verbatim from the sources recorded in the workspace. Fields absent from the record — author, year, venue, identifier — are omitted rather than reconstructed.</p></section>`;
}
function secControls(){
  const x=m(firstOf("experiment")); if(!x.controls&&!x.baseline) return "";
  return `<section><h2>6 · Controls and validity</h2>
    <table>
      ${x.baseline?`<tr><th style="width:150px">Baseline</th><td>${esc(x.baseline)}</td></tr>`:""}
      ${x.controls?`<tr><th style="width:150px">Controls</th><td>${esc(x.controls)}</td></tr>`:""}
    </table>
    <p class="muted">Controls are reported whether or not they are favourable. A control that failed to behave as specified would invalidate the result above, and is the first thing a reader should check.</p></section>`;
}
function secNext(){
  const n=firstOf("next"); if(!n) return "";
  const x=m(n), tests=x.tests||[];
  const rows=tests.map((t,i)=>`<tr><td><b>${i+1}.</b> ${esc(t.name)}</td><td>${esc(t.why||"")}</td><td class="num">${esc(t.cost||"—")}</td></tr>`).join("");
  return `<section><h2>9 · Recommended next experiments</h2>
    ${x.changed?`<p><b>What this run changed.</b> ${esc(x.changed)}</p>`:""}
    ${x.uncertainty?`<div class="callout"><b>Open question.</b> ${esc(x.uncertainty)}</div>`:""}
    ${rows?`<table><thead><tr><th style="width:38%">Proposed experiment</th><th>Why it is worth running</th><th class="num">Est. cost</th></tr></thead><tbody>${rows}</tbody></table>`:""}
    ${tests.length?`<p class="muted"><b>Immediate action.</b> Run “${esc(tests[0].name)}” first — ${esc(lowerFirst((tests[0].why||"").replace(/\.$/,"")))}.</p>`:""}</section>`;
}
function secProvenance(){
  const res=byType("result").map(m).filter(x=>x.provenance);
  const log=state.run.log||[];
  const pr=res.length?res[res.length-1].provenance:null;
  const rows=pr?Object.keys(pr).map(k=>`<tr><th style="width:150px">${esc(k)}</th><td>${esc(pr[k])}</td></tr>`).join(""):"";
  const logRows=log.map(e=>`<tr><td class="muted">${esc(e.time||"")}</td><td>${esc(e.agent||"")}</td><td>${esc(e.msg||"")}</td></tr>`).join("");
  return `<section><h2>10 · Provenance and run record</h2>
    ${rows?`<table>${rows}</table>`:"<p class='muted'>No run provenance recorded for this project.</p>"}
    ${logRows?`<h3>Agent activity</h3><table><thead><tr><th style="width:74px">Time</th><th style="width:120px">Agent</th><th>Step</th></tr></thead><tbody>${logRows}</tbody></table>`
      :`<p class="muted">No agent activity recorded in this session. Press Run on the graph to produce a live trace.</p>`}</section>`;
}

/* --- assembly --------------------------------------------------------- */
/* The claim check is stated in the document itself, not just in a toast.
   A reader has to be able to tell whether the prose was checked, and what
   came out of it, from the paper alone. Removals are listed rather than
   quietly dropped: what a fact-checker struck is itself a finding about the
   draft, and hiding it would defeat the point of running the check. */
function narrativeAudit(){
  if(!NARRATIVE.verified){
    return `<div class="callout warn"><b>Claim check did not run.</b> The drafted prose has
      <b>not</b> been checked against the recorded data${NARRATIVE.verifyError?` (${esc(NARRATIVE.verifyError)})`:""}.
      Treat the narrative sections as unverified and read them against the tables before circulating this report.</div>`;
  }
  const n=NARRATIVE.removed.length;
  if(!n) return `<p class="byline-gen">A second adversarial pass re-read the draft against the recorded data and found no unsupported claim.</p>`;
  const items=NARRATIVE.removed.map(x=>`<li><span class="muted">[${esc(x.section)}]</span>
      “${esc(x.sentence)}” — ${esc(x.why||"not supported by the recorded data")}</li>`).join("");
  return `<div class="callout"><b>Claim check: ${n} statement${n===1?"":"s"} removed.</b>
    A second adversarial pass re-read the draft against the recorded data and struck the following,
    which are <b>not</b> present in the report above:
    <ul class="audit-list">${items}</ul></div>`;
}

function buildPaper(){
  FIGN=0; TABN=0;   // numbering restarts for every assembly
  const p=curProj(), q=m(firstOf("question")), d=curData(), r=projResults();
  const when=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  const author=AUTH.user?`${esc(AUTH.user)} (GitHub)`:"Unattributed session";
  const mode=r?"Measured — this project's recorded run":(d?"Measured — run in this session":"No run recorded");
  const runLabel=state.run.mode==="live"?"live run":(state.run.mode==="replay"?"replayed trace":"no run in this session");
  const abstract=NARRATIVE.abstract||assembledAbstract();
  const discussion=NARRATIVE.discussion||assembledDiscussion();
  const limits=NARRATIVE.limitations||assembledLimitations();
  const wrote=NARRATIVE.source==="model";

  return `
    <h1>${esc(p.name)} — computational screening report</h1>
    <p class="p-lede">${esc((firstOf("question")&&firstOf("question").summary)||p.question||"")}</p>
    <div class="p-meta">
      <span><b>Prepared by</b> ${author}</span>
      <span><b>Date</b> ${esc(when)}</span>
      <span><b>Run</b> ${esc(p.run||"—")} · ${esc(runLabel)}</span>
      <span><b>Data</b> ${esc(mode)}</span>
    </div>

    <section><h2>Abstract</h2>
      <p>${esc(abstract)}</p>
      ${wrote?`<p class="byline-gen">Abstract, discussion and limitations drafted by ${esc(NARRATIVE.model||"a language model")} from this project's recorded data. All numbers, figures, tables and references in this report are assembled from the run record, not written by the model.</p>`:""}
      ${wrote?narrativeAudit():""}
      ${(p.scaffolded&&!r)?`<div class="callout warn"><b>Plan-stage project.</b> This project's question, hypotheses and experiment design were proposed by a model as a starting point and have not been grounded in sources or tested by a run. Nothing below is a finding.</div>`:""}
    </section>

    ${secQuestion()}
    ${secEvidence()}
    ${secHypotheses()}
    ${secMethods()}
    ${secResults()}
    ${secControls()}

    <section><h2>7 · Discussion</h2>${discussion.split(/\n\n+/).map(x=>`<p>${esc(x)}</p>`).join("")}</section>
    <section><h2>8 · Limitations</h2><p>${esc(limits)}</p></section>

    ${secNext()}
    ${secProvenance()}
    ${secReferences()}

    <footer class="p-foot">
      Generated by Relay from the project graph on ${esc(when)}.
      This is a computational triage report: it reprioritises candidates for assay and does not
      confirm binding, efficacy or safety.
    </footer>`;
}

function openReport(){
  $("#paper").innerHTML=buildPaper();
  $("#reportNote").textContent=NARRATIVE.source==="model"
    ? `Narrative drafted by ${NARRATIVE.model||"model"}`
    : "Assembled from the project graph";
  $("#reportOv").classList.add("open");
  document.body.style.overflow="hidden";
  $("#reportOv").scrollTop=0;
}
function closeReport(){
  $("#reportOv").classList.remove("open");
  document.body.style.overflow="";
}

/* The browser's own print pipeline is the PDF writer: the charts are inline
   SVG, so they come out as vector with selectable labels, which no
   screenshot-based exporter would manage. */
function exportPDF(){
  toast("Choose “Save as PDF” as the destination");
  setTimeout(()=>window.print(),260);
}

async function writeNarrative(){
  if(!AUTH.user){ toast("Sign in to draft the narrative"); return; }
  const btn=$("#reportWrite"); const label=btn.querySelector(".btn-label");
  const was=label.textContent; label.textContent="Writing…"; btn.disabled=true;
  try{
    const r=await api("/api/narrative",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({project:curProj(),metrics:(curData().stats||[]),dataMode:state.dataMode})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok){
      // The assembled report is already complete, so a failure here is a
      // declined upgrade, not a broken export.
      toast(j.reason||"Narrative unavailable — keeping the assembled text");
      return;
    }
    NARRATIVE.abstract=j.abstract||""; NARRATIVE.discussion=j.discussion||"";
    NARRATIVE.limitations=j.limitations||""; NARRATIVE.source="model";
    NARRATIVE.model=[j.provider,j.model].filter(Boolean).join(" · ");
    NARRATIVE.verified=!!j.verified; NARRATIVE.verifyError=j.verifyError||null;
    NARRATIVE.removed=Array.isArray(j.removed)?j.removed:[];
    openReport();
    const n=NARRATIVE.removed.length;
    toast(!NARRATIVE.verified ? "Drafted, but the claim check did not run — review carefully"
      : n ? `Drafted · ${n} unsupported claim${n===1?"":"s"} removed`
          : "Drafted · claim check found nothing unsupported");
  }catch(e){ toast("Could not reach the server — keeping the assembled text"); }
  finally{ label.textContent=was; btn.disabled=false; }
}

$("#reportBtn").addEventListener("click",openReport);
$("#reportClose").addEventListener("click",closeReport);
$("#reportPrint").addEventListener("click",exportPDF);
$("#reportWrite").addEventListener("click",writeNarrative);
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#reportOv").classList.contains("open")){ e.preventDefault(); closeReport(); }
});

init();

})();
</script>
</body>
</html>
