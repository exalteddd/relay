/* pane action wiring */
function wirePaneActions(n){
  $$("[data-rtab]",el.paneBody).forEach(b=>b.addEventListener("click",()=>{ n._tab=b.dataset.rtab; renderPaneBody(n); }));
  $$("[data-cand]",el.paneBody).forEach(b=>b.addEventListener("click",()=>{ state.selCandidate=b.dataset.cand; renderPaneBody(n); toast("Selected "+b.dataset.cand+" — record highlighted"); }));
  $$(".data-point",el.paneBody).forEach(p=>p.addEventListener("click",()=>toast(`Observation: ${p.dataset.px}% screened → ${niceNum(p.dataset.py)}× enrichment`)));
  $$(".legend .lg",el.paneBody).forEach(b=>b.addEventListener("click",()=>{
    const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",String(!on));
    const s=b.dataset.series; $$(`[data-line="${s}"]`,el.paneBody).forEach(p=>p.style.opacity=on?"0":"1");
  }));
  $$("[data-goto]",el.paneBody).forEach(b=>b.addEventListener("click",()=>selectNode(b.dataset.goto)));
  $$("[data-paneact]",el.paneBody).forEach(b=>b.addEventListener("click",()=>paneAction(b.dataset.paneact,n,b)));
}
function paneAction(act,n,btn){
  switch(act){
    case "run-exp": openRunModal(n.id); break;
    case "activity": n._tab="activity"; renderPaneBody(n); break;
    case "add-canvas": togglePreview(curProj().resultNode||n.id,true); toast("Chart preview added to canvas"); break;

    // Editing and structure: these all have real machinery behind them.
    case "edit": openNodeForm(n.type,null,n.id); break;
    case "add-evidence": openNodeForm("source",null,null,n.id); break;
    case "propose": openNodeForm("hypothesis",null,null,n.id); break;
    case "design-test": openNodeForm("experiment",null,null,n.id); break;
    case "link-claim": linkFromNode(n); break;
    case "pick-next": openNodeForm("experiment",{title:btn.dataset.test||""},null,n.id); break;

    // A source is only openable when it has somewhere to go.
    case "open-source": {
      const url=((n.meta.sources||[])[0]||{}).url;
      if(url) window.open(url,"_blank","noopener");
      else toast("No link on this source — add one with Edit");
      break;
    }
    case "export": exportResult(n); break;
    default: toast("Noted");
  }
}

/* "Link or challenge a claim" means: connect this to something, and say how.
   The graph already supports exactly that, so offer it directly. */
function linkFromNode(n){
  const others=curProj().nodes.filter(x=>x.id!==n.id&&!wouldCycle(n.id,x.id)
    && !curProj().edges.some(e=>e.from===n.id&&e.to===x.id));
  if(!others.length){ toast("Nothing left to connect this to"); return; }
  openMenu(nodeEls[n.id]||el.canvas,`
    <div class="m-head">Connect to…</div>
    ${others.slice(0,12).map(x=>`<button class="mi" data-link="${x.id}"><span class="node-dot" style="width:9px;height:9px;background:${dotColor(x.type)}"></span><span>${esc(nodeHeading(x).title)}</span></button>`).join("")}
  `,m=>{
    $$("[data-link]",m).forEach(b=>b.addEventListener("click",()=>{
      const to=nodeById(b.dataset.link); closeMenus();
      curProj().edges.push({from:n.id,to:to.id,rel:inferRel(n,to)});
      relayout(); savePersist(); toast(`Connected to ${nodeHeading(to).title}`);
    }));
  });
}

/* Download what the result actually holds, rather than claiming to export. */
function exportResult(n){
  const d=curData();
  const rows=[["rank","candidate","score","uncertainty","family"]];
  ((d.candidates&&d.candidates.rows)||[]).forEach((r,i)=>rows.push([i+1,r.id,r.score,r.err==null?"":r.err,r.family||""]));
  rows.push([]); rows.push(["top fraction screened (%)","enrichment (x)","baseline (x)"]);
  const e=d.enrichment||{};
  (e.x||[]).forEach((x,i)=>rows.push([x,(e.proposed||[])[i],(e.baseline||[])[i]]));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));
  a.download=`${curProj().id}-results.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Downloaded CSV");
}

/* =========================== inline previews ========================== */
function previewState(id){
  const pv=state.previews[state.project]||(state.previews[state.project]={});
  if(!pv[id]){ const n=nodeById(id); pv[id]={open:false,x:(n?n.x+40:200),y:(n?n.y+150:200),w:360,h:300,tab:"plot"}; }
  return pv[id];
}
function togglePreview(id,forceOpen){
  const ps=previewState(id); ps.open=forceOpen?true:!ps.open; renderPreviews(); savePersist(); scheduleMinimap();
}
function renderPreviews(){
  el.previews.innerHTML="";
  const pv=state.previews[state.project]||{};
  for(const id in pv){ const ps=pv[id]; if(!ps||!ps.open)continue; const n=nodeById(id); if(!n)continue; el.previews.appendChild(buildPreview(n,ps)); }
}
function buildPreview(n,ps){

/* ============================== add node ============================== */
/* ============================ graph layout ============================
   A research graph is a DAG that reads left to right: question → evidence →
   hypotheses → experiment → result → next question. Laying it out in layers
   by depth matches how people read it, and ordering each layer by the average
   position of its neighbours removes most edge crossings without needing a
   full crossing-minimisation pass. Hand-placed positions do not survive a run
   that adds dozens of claim nodes, so this has to be one click away. */
const LAYER_GAP=96, ROW_GAP=28;

function layoutGraph(p){
  const nodes=p.nodes, edges=p.edges||[];
  if(!nodes.length) return;
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const out={}, indeg={};
  for(const n of nodes){ out[n.id]=[]; indeg[n.id]=0; }
  for(const e of edges){ if(byId[e.from]&&byId[e.to]&&e.from!==e.to){ out[e.from].push(e.to); indeg[e.to]++; } }

  // Longest-path layering over a topological order, so every edge points
  // forward. Any cycle leaves nodes unvisited; those get appended at the end
  // rather than silently dropped.
  const depth={}; const queue=nodes.filter(n=>!indeg[n.id]).map(n=>n.id);
  for(const id of queue) depth[id]=0;
  const pending={...indeg};
  for(let i=0;i<queue.length;i++){
    const id=queue[i];
    for(const next of out[id]){
      depth[next]=Math.max(depth[next]??0, depth[id]+1);
      if(--pending[next]===0) queue.push(next);
    }
  }
  let maxDepth=0;
  for(const n of nodes){ if(depth[n.id]==null) depth[n.id]=null; else maxDepth=Math.max(maxDepth,depth[n.id]); }
  for(const n of nodes) if(depth[n.id]==null) depth[n.id]=maxDepth+1;   // cycle remnants

  const layers=[];
  for(const n of nodes){ (layers[depth[n.id]] ||= []).push(n); }

  // Order each layer by the mean row of its already-placed predecessors.
  const row={};
  layers.forEach((layer,li)=>{
    if(!layer) return;
    if(li>0) layer.sort((a,b)=>bary(a)-bary(b));
    layer.forEach((n,i)=>{ row[n.id]=i; });
    function bary(n){
      const ins=edges.filter(e=>e.to===n.id&&row[e.from]!=null).map(e=>row[e.from]);
      return ins.length ? ins.reduce((s,v)=>s+v,0)/ins.length : row[n.id] ?? 0;
    }
  });

  const h=n=>{ const el=nodeEls[n.id]; return (el?el.offsetHeight:92); };

  // A run can put thirty-odd claims at the same depth. Stacked in one column
  // that is a four-thousand-pixel ribbon, so a wide layer wraps into several
  // sub-columns. Depth order still reads left to right; only the within-layer
  // packing changes.
  const MAX_ROWS=6;
  const groups=[];                                    // one entry per rendered column
  for(const layer of layers){
    if(!layer||!layer.length) continue;
    const subs=Math.ceil(layer.length/MAX_ROWS), per=Math.ceil(layer.length/subs);
    for(let s=0;s<subs;s++) groups.push(layer.slice(s*per,(s+1)*per));
  }
  const colH=groups.map(g=>g.reduce((s,n)=>s+h(n)+ROW_GAP,-ROW_GAP));
  const tallest=Math.max(...colH,0);
  groups.forEach((g,i)=>{
    const x=i*(NODE_W+LAYER_GAP);
    let y=(tallest-colH[i])/2;                        // centre each column
    for(const n of g){ n.x=Math.round(x); n.y=Math.round(y); y+=h(n)+ROW_GAP; }
  });
}

function tidy(){
  layoutGraph(curProj());
  renderGraph(); savePersist(); fit(true);
  toast("Graph arranged");
}

/* ========================= adding & removing nodes =====================
   A node is only worth having on the canvas if it says something, so adding
   one asks for the fields that node type is actually rendered from. The
   required ones are the minimum the detail pane needs to not look empty. */
const NODE_FORM={
  question:{label:"Question", rel:"uses", fields:[
    {k:"title",     l:"Title",                   req:true,  ph:"Which compounds should we assay first?"},
    {k:"objective", l:"What are you trying to find out?", req:true, area:true, ph:"Rank untested compounds so the lab assays the most promising few first."},
    {k:"outcome",   l:"Measurable outcome",      ph:"Enrichment at a fixed assay budget"},
    {k:"data",      l:"Data available",          ph:"PubChem BioAssay records"}]},
  source:{label:"Evidence", rel:"uses", fields:[
    {k:"title",     l:"Source",                  req:true,  ph:"Metallo-β-lactamase inhibitor review"},
    {k:"body",      l:"What does it show?",      req:true,  area:true, ph:"Thiol-carboxylate chemotypes recur as validated binders."},
    {k:"url",       l:"Link (optional)",         ph:"https://doi.org/..."},
    {k:"relevance", l:"Why it matters here",     ph:"Grounds the chelation prior"}]},
  hypothesis:{label:"Hypothesis", rel:"supports", fields:[
    {k:"title",     l:"Short name",              req:true,  ph:"Chelating warheads inhibit the active site"},
    {k:"statement", l:"Statement",               req:true,  area:true, ph:"Compounds bearing metal-chelating warheads inhibit NDM-1 by coordinating its zinc ions."},
    {k:"prediction",l:"A prediction it makes",   req:true,  ph:"Chelating chemotypes score above the library median."},
    {k:"uncertainty",l:"Uncertainty",            ph:"Moderate — priors strong but unvalidated here"}]},
  experiment:{label:"Experiment", rel:"tests", fields:[
    {k:"title",     l:"Name",                    req:true,  ph:"Diversity-aware screen"},
    {k:"method",    l:"Method",                  req:true,  area:true, ph:"Random forest on fingerprints, scaffold split."},
    {k:"inputs",    l:"Inputs",                  ph:"Labelled fixture + candidate pool"},
    {k:"controls",  l:"Controls",                ph:"Random control + y-scramble"}]},
  result:{label:"Result", rel:"produced", fields:[
    {k:"title",     l:"Title",                   req:true,  ph:"Results · 04"},
    {k:"interp",    l:"Interpretation",          req:true,  area:true, ph:"What the numbers mean, and what they do not show."}]},
  next:{label:"Next experiment", rel:"uses", fields:[
    {k:"title",     l:"Title",                   req:true,  ph:"Next experiment"},
    {k:"changed",   l:"What changed",            req:true,  area:true, ph:"The chelation prior held; diversity beat potency-only."},
    {k:"uncertainty",l:"Remaining uncertainty",  ph:"Does it transfer to real assay data?"}]},

/* Turn form values into the meta shape each pane renderer reads. */
function metaFor(type,v){
  if(type==="question")   return {objective:v.objective,outcome:v.outcome,data:v.data};
  if(type==="source")     return {sources:[{src:v.title,meta:"added by you",body:v.body,url:v.url||""}],relevance:v.relevance};
  if(type==="hypothesis") return {statement:v.statement,predictions:v.prediction?[v.prediction]:[],uncertainty:v.uncertainty};
  if(type==="experiment") return {tests:[{name:v.title,sel:true,why:v.method}],method:v.method,inputs:v.inputs,controls:v.controls,approval:"Required before run."};
  if(type==="result")     return {interp:v.interp};
  if(type==="next")       return {changed:v.changed,uncertainty:v.uncertainty,tests:[]};
  return {text:v.title};
}

/* Read a node back into the shape the form uses, so editing shows what is
   already there instead of a blank form. */
function valuesFor(n){
  const m=n.meta||{}, t=n.type;
  if(t==="question")   return {title:n.title,objective:m.objective,outcome:m.outcome,data:m.data};
  if(t==="source")     {const s0=(m.sources||[])[0]||{}; return {title:s0.src||n.title,body:s0.body,url:s0.url,relevance:m.relevance};}
  if(t==="hypothesis") return {title:n.title,statement:m.statement,prediction:(m.predictions||[])[0],uncertainty:m.uncertainty};
  if(t==="experiment") return {title:n.title,method:m.method,inputs:m.inputs,controls:m.controls};
  if(t==="result")     return {title:n.title,interp:m.interp};
  if(t==="next")       return {title:n.title,changed:m.changed,uncertainty:m.uncertainty};
  return {title:m.text||n.title};
}

function openNodeForm(type,prefill,editingId,parentId){
  const spec=NODE_FORM[type]; if(!spec) return;
  const editing=editingId?nodeById(editingId):null;
  if(editing) prefill=valuesFor(editing);
  // An explicit parent (from a node's menu) wins over whatever is selected.
  const parentKey=parentId||state.selection;
  const parent=parentKey?nodeById(parentKey):null;
  const rows=spec.fields.map(f=>{
    const val=esc((prefill&&prefill[f.k])||"");
    const input=f.opts
      ? `<select data-f="${f.k}">${f.opts.map(o=>`<option value="${o}"${((prefill&&prefill[f.k])===o)?" selected":""}>${o}</option>`).join("")}</select>`
      : f.area
        ? `<textarea data-f="${f.k}" rows="3" placeholder="${esc(f.ph||"")}">${val}</textarea>`
        : `<input data-f="${f.k}" value="${val}" placeholder="${esc(f.ph||"")}">`;
    return `<div class="field"><label class="flab">${esc(f.l)}${f.req?' <span class="req">required</span>':""}</label>${input}</div>`;
  }).join("");
  modal(`
    <div class="modal-head"><div><h2>${editing?"Edit":"Add"} ${esc(spec.label.toLowerCase())}</h2>
      <p>${editing?"Changes replace what is on the card and in the detail pane."
            :(parent?`Will be linked from <b>${esc(parent.title)}</b> as “${esc(spec.rel)}”.`:"Not linked to anything yet — select a node first to connect it.")}</p></div>
      <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-body"><div class="node-form">${rows}</div>
      <div class="form-error" id="formErr" hidden></div></div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="nodeGo">${editing?"Save changes":"Add "+esc(spec.label.toLowerCase())}</button></div>
  `,root=>{
    const first=root.querySelector("[data-f]"); if(first) first.focus();
    const submit=()=>{
      const v={}; for(const f of spec.fields){ const el=root.querySelector(`[data-f="${f.k}"]`); v[f.k]=(el?el.value:"").trim(); }
      const missing=spec.fields.filter(f=>f.req&&!v[f.k]).map(f=>f.l);
      if(missing.length){
        const e=root.querySelector("#formErr");
        e.textContent=(missing.length===1?"Still needed: ":"Still needed: ")+missing.join(", ");
        e.hidden=false; return;
      }
      closeModal(); editing ? applyNodeEdit(editing,v) : createNode(type,v,parentKey);
    };
    root.querySelector("#nodeGo").addEventListener("click",submit);
    root.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) submit(); });
  });
}

function createNode(type,v,parentId){
  const p=curProj(); const spec=NODE_FORM[type];
  const parentKey=parentId||state.selection;
  const id=type[0]+"-"+Math.random().toString(36).slice(2,6);
  const title=v.title.length>46?v.title.slice(0,44)+"…":v.title;
  const summary={question:v.objective,source:v.body,hypothesis:v.statement,
                 experiment:v.method,result:v.interp,next:v.changed,note:""}[type]||"";
  const n=P(id,type,title,summary.length>90?summary.slice(0,88)+"…":summary,
            type==="experiment"?"planned":"done",0,0,metaFor(type,v));
  n.origin="user";                       // distinguishes it from generated nodes
  p.nodes.push(n);
  if(parentKey&&nodeById(parentKey)) p.edges.push({from:parentKey,to:id,rel:spec.rel});
  relayout();                            // position is derived, never typed in
  selectNode(id); savePersist();
  toast(`${spec.label} added`);
  return n;
}

/* Edits replace only the fields the form owns, so anything else a run
   attached to the node (provenance, chart payloads) is left alone. */
function applyNodeEdit(n,v){
  const summary={question:v.objective,source:v.body,hypothesis:v.statement,
                 experiment:v.method,result:v.interp,next:v.changed,note:""}[n.type]||"";
  n.title=v.title.length>46?v.title.slice(0,44)+"…":v.title;
  n.summary=summary.length>90?summary.slice(0,88)+"…":summary;
  n.meta=Object.assign({},n.meta,metaFor(n.type,v));
  n.edited=true;
  renderGraph();
  if(state.selection===n.id){ renderPaneHeader(n); renderPaneBody(n); }
  savePersist();
  toast("Changes saved");
}

/* Which relation a new connection gets, inferred from what is being joined so
   the common case needs no extra click. Change it from the edge's menu. */
function inferRel(from,to){
  if(to.type==="hypothesis") return from.type==="source"?"supports":"uses";
  if(to.type==="experiment") return "tests";
  if(to.type==="result")     return "produced";
  return "uses";
}

/* Drag from a node's port onto another node to connect them. */
function beginLink(ev,from){
  ev.preventDefault(); ev.stopPropagation();
  const ghost=document.createElementNS("http://www.w3.org/2000/svg","path");
  ghost.setAttribute("class","edge-ghost");
  el.edges.appendChild(ghost);
  const vb=el.edges.getBoundingClientRect(), v=view();
  const toWorld=(cx,cy)=>({x:(cx-vb.left)/v.scale+parseFloat(el.edges.style.left||0),
                           y:(cy-vb.top)/v.scale+parseFloat(el.edges.style.top||0)});
  const a=nodeBox(from), x1=a.x+a.w, y1=a.y+a.h/2;
  let hovered=null;
  const move=e=>{
    const p=toWorld(e.clientX,e.clientY);
    ghost.setAttribute("d",`M${x1},${y1} C${x1+60},${y1} ${p.x-60},${p.y} ${p.x},${p.y}`);
    const over=document.elementFromPoint(e.clientX,e.clientY)?.closest(".node");
    const id=over?.dataset.id;
    if(id!==hovered){
      if(hovered&&nodeEls[hovered]) nodeEls[hovered].classList.remove("link-target");
      hovered=(id&&id!==from.id)?id:null;
      if(hovered) nodeEls[hovered].classList.add("link-target");
    }
  };
  const up=()=>{
    removeEventListener("pointermove",move); removeEventListener("pointerup",up);
    ghost.remove();
    if(hovered&&nodeEls[hovered]) nodeEls[hovered].classList.remove("link-target");
    if(!hovered) return;
    const to=nodeById(hovered); const p=curProj();
    if(p.edges.some(e=>e.from===from.id&&e.to===hovered)){ toast("Already connected"); return; }
    if(wouldCycle(from.id,hovered)){ toast("That would make a loop"); return; }
    p.edges.push({from:from.id,to:hovered,rel:inferRel(from,to)});
    renderGraph(); savePersist();
    toast(`${from.title} → ${to.title}`);
  };
  addEventListener("pointermove",move); addEventListener("pointerup",up);
}

/* The layout reads left to right, so a connection that closes a loop has no
   sensible place to sit. Refuse it rather than draw something misleading. */
function wouldCycle(fromId,toId){
  const p=curProj(); const seen=new Set(); const stack=[toId];
  while(stack.length){
    const cur=stack.pop();
    if(cur===fromId) return true;
    if(seen.has(cur)) continue; seen.add(cur);
    for(const e of p.edges) if(e.from===cur) stack.push(e.to);
  }
  return false;
}

/* Right-click an edge: change what it means, or detach it. */
function edgeContextMenu(ev,edge){
  ev.preventDefault(); ev.stopPropagation();
  const a=nodeById(edge.from), b=nodeById(edge.to);
  openMenuAt(ev.clientX,ev.clientY,`
    <div class="m-head">${esc(a?a.title:"?")} → ${esc(b?b.title:"?")}</div>
    ${Object.keys(REL_LABEL).map(r=>`<button class="mi" data-rel="${r}"${r===edge.rel?' aria-current="true"':""}><span>${esc(REL_LABEL[r])}</span></button>`).join("")}
    <div class="m-sep"></div>
    <button class="mi danger" data-edge="del"><span>Remove connection</span></button>
  `,m=>{
    $$("[data-rel]",m).forEach(btn=>btn.addEventListener("click",()=>{
      edge.rel=btn.dataset.rel; closeMenus(); renderEdges(); savePersist(); toast("Relation updated");
    }));
    $$("[data-edge]",m).forEach(btn=>btn.addEventListener("click",()=>{
      const p=curProj(); p.edges=p.edges.filter(e=>e!==edge);
      closeMenus(); renderGraph(); savePersist(); toast("Connection removed");
    }));
  });
}

/* Right-click on a node. Same actions as the pane, where the hand expects
   them. The destructive one is last and marked. */
function nodeContextMenu(ev,n){
  ev.preventDefault(); ev.stopPropagation();
  // Deliberately does not select: a right-click asks for actions, not for the
  // detail pane. Kept to two, since adding lives on the plus in the ask bar.
  openMenuAt(ev.clientX,ev.clientY,`

function deleteNode(id){
  const p=curProj(); const n=nodeById(id); if(!n) return;
  const generated=n.origin!=="user";
  const go=()=>{
    p.nodes=p.nodes.filter(x=>x.id!==id);
    p.edges=p.edges.filter(e=>e.from!==id&&e.to!==id);
    const pv=state.previews[p.id]; if(pv) delete pv[id];
    if(p.primaryExp===id) p.primaryExp=null;
    if(p.resultNode===id) p.resultNode=null;
    if(state.selection===id) clearSelection();
    relayout(); savePersist();
    toast(`Deleted “${n.title}”`);
  };
  // Removing something a run produced loses part of the record, so confirm it.
  if(!generated) return go();
  modal(`
    <div class="modal-head"><div><h2>Delete this node?</h2>
      <p>“${esc(n.title)}” came from the run, not from you. Deleting it removes it from the record along with its connections.</p></div></div>

      <button class="btn danger" id="delGo">Delete</button></div>
  `,root=>{ root.querySelector("#delGo").addEventListener("click",()=>{ closeModal(); go(); }); });
}

/* =============================== menus =============================== */
function closeMenus(){
  $$(".menu").forEach(m=>m.remove());
  $$(".node.context-target").forEach(d=>d.classList.remove("context-target"));
  document.removeEventListener("pointerdown",menuOutside,true);
}
function menuOutside(e){ if(!e.target.closest(".menu")&&!e.target.closest("[aria-haspopup]")) closeMenus(); }
/* Same menu, placed at a point instead of under an element — for right-click. */
/* Place a menu without letting it paint in the wrong spot first.
   Appending an absolutely-positioned element with no coordinates renders it
   at its static position — near the top of the page — and only the following
   style writes move it to the pointer. That is the jump: it appears high and
   snaps down. Measuring while hidden, then revealing, means it only ever
   paints where it belongs. */
function placeMenu(m,x,y,flipFrom){
  m.style.visibility="hidden";
  m.style.left="0px"; m.style.top="0px";
  document.body.appendChild(m);
  const w=m.offsetWidth, h=m.offsetHeight;
  let left=x, top=y;
  if(left+w>innerWidth-10)  left=(flipFrom!=null?innerWidth-w-10:x-w);
  if(top+h>innerHeight-10)  top=(flipFrom!=null?flipFrom-h-6:y-h);
  m.style.left=Math.max(10,left)+"px";
  m.style.top=Math.max(10,Math.min(top,innerHeight-h-10))+"px";
  m.style.visibility="";
  return m;
}
function buildMenu(html){
  const m=document.createElement("div"); m.className="menu"; m.innerHTML=html; return m;
}
function armMenuDismiss(){
  setTimeout(()=>document.addEventListener("pointerdown",menuOutside,true),0);
}

/* Menu at a point — for right-click. */
function openMenuAt(x,y,html,onwire){
  closeMenus();
  const m=placeMenu(buildMenu(html),x,y);
  if(onwire)onwire(m);
  armMenuDismiss();
  return m;
}

/* Menu under an element — for toolbar buttons. */
function openMenu(anchor,html,onwire){
  closeMenus();
  const r=anchor.getBoundingClientRect();
  const m=placeMenu(buildMenu(html),r.left,r.bottom+6,r.top);
  if(onwire)onwire(m);
  armMenuDismiss();
  return m;
}

/* Take the charts, shortlist and headline stats from a finished run. The
   bundled sample stays selectable, so a viewer can always see which is which. */
/* Replace the project's graph with what the run produced. The previous graph
   was this project's previous answer, so keeping both would leave two
   unrelated investigations on one canvas. Anything the user added by hand is
   carried over, because they did not ask for it to be thrown away. */
function adoptRunGraph(g){
  if(!g||!g.nodes||!g.nodes.length) return;
  const p=curProj();
  const mine=p.nodes.filter(n=>n.origin==="user");
  const mineIds=new Set(mine.map(n=>n.id));
  const keptEdges=p.edges.filter(e=>mineIds.has(e.from)&&mineIds.has(e.to));
  p.nodes=g.nodes.map(n=>Object.assign(
    P(n.id,n.type,n.title,n.summary||"",n.status||"done",0,0,n.meta||{}),{origin:"run"}));
  p.edges=g.edges.slice();
  p.nodes.push(...mine); p.edges.push(...keptEdges);
  p.primaryExp=null;
  p.resultNode=null;
  relayout(); savePersist();
  toast(`Graph rebuilt from the run — ${g.nodes.length} nodes`);
}

function adoptRunData(data){
  if(!data||!data.charts) return;
  CHART_DATA.live=data.charts;
  // Write the interpretation from what the run measured, replacing whatever
  // text the node was carrying. No prose about results that did not happen.
  const res=nodeById(curProj().resultNode);
  if(res){
    const f=v=>v==null?"n/a":(Math.round(v*100)/100);
    res.meta=Object.assign({},res.meta,{
      interp:`Ranked ${data.n_compounds??"?"} compounds. ROC-AUC ${f(data.roc_auc)} on a held-out scaffold split; `
            +`enrichment ${f(data.ef_top1pct)}x at the top 1% and ${f(data.ef_top5pct)}x at 5%. `
            +`The critic ${data.passed?"accepted":"did not accept"} this result.`
            +(data.next?` Suggested next: ${data.next}`:""),
      provenance:{run:"this session",data:data.source||"unknown",
                  params:`${data.n_test??"?"} held-out compounds`,approvals:"approved in this session"}
    });
  }
  updateProvenance();
  if(state.selection){ const n=nodeById(state.selection); if(n&&n.type==="result") renderPaneBody(n); }
  renderPreviews(); savePersist();
}
function projectHasData(){ return hasResults(); }
function updateProvenance(){
  const d=curData();
  // The sample charts belong to NDM-1. Other projects have no measured
  // data, so the badge says that instead of borrowing the wrong label.
  if(!projectHasData()){
    el.provenance.dataset.kind="none";
    el.provText.textContent="No results yet";
    el.provTextLong.textContent="";
    return;
  }
  // Once a run has happened the displayed data is measured, so the badge must
  // stop calling it sample data.
  const showingMeasured = hasResults();
  el.provenance.dataset.kind = state.run.active
    ? (state.run.mode==="live"?"live":"replay")
    : (showingMeasured?"live":"sample");
  if(state.run.active){ el.provText.textContent = state.run.mode==="live"?"Live Omnigent run":"Replaying trace"; el.provTextLong.textContent=""; }
  else { el.provText.textContent = showingMeasured?"Measured run":"Sample data"; el.provTextLong.textContent="· "+d.tag; }
}

/* One cheap model call turns a vague question into one the lab can work on.
   The rewrite is offered, never applied silently: the author decides. */
function wireSharpen(root,field){
  const btn=root.querySelector("#sharpenBtn"), out=root.querySelector("#sharpenOut");
  if(!btn||!out) return;
  btn.addEventListener("click",async()=>{
    const q=field.value.trim();
    if(!q){ field.focus(); return; }
    btn.disabled=true; btn.textContent="Sharpening…";
    out.hidden=false;
    out.innerHTML=`<div class="sharpen"><div class="sharpen-wait">Asking the model…</div></div>`;
    try{
      const r=await api("/api/refine-question",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
      // Report what actually happened. A single catch-all message sent
      // people hunting for a network fault when the server had answered.
      let j=null, raw="";
      try{ j=await r.clone().json(); }catch(e){ raw=(await r.text()).slice(0,120); }
      if(!r.ok||!j){
        const why=(j&&j.error) || raw || `${r.status} ${r.statusText}`;
        out.innerHTML=`<div class="sharpen"><div class="sharpen-wait">${esc(why)}</div></div>`;
        return;
      }
      out.innerHTML=`
        <div class="sharpen">
          ${j.tooBroad?`<div class="sharpen-flag">This is broad enough that no single run could answer it.</div>`:""}
          <div class="sharpen-q">${esc(j.refined)}</div>
          ${j.changes&&j.changes.length?`<ul class="sharpen-list">${j.changes.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}
          ${j.missing&&j.missing.length?`<div class="sharpen-sub">Still yours to decide: ${j.missing.map(esc).join("; ")}</div>`:""}
          <div class="sharpen-actions">
            <button type="button" class="btn primary" id="useRefined">Use this</button>
            <button type="button" class="btn" id="keepMine">Keep mine</button>
          </div>
        </div>`;
      out.querySelector("#useRefined").addEventListener("click",()=>{
        field.value=j.refined; out.hidden=true; out.innerHTML=""; field.focus();
      });
      out.querySelector("#keepMine").addEventListener("click",()=>{ out.hidden=true; out.innerHTML=""; });
    }catch(e){
      out.innerHTML=`<div class="sharpen"><div class="sharpen-wait">The request never completed: ${esc(e.message||String(e))}. Is the server still running?</div></div>`;
    }finally{ btn.disabled=false; btn.textContent="Sharpen with AI"; }
  });
}

function hasBackend(){

    const base=(CFG.backendUrl||"")+"/api/health";

    fetch(base,{method:"GET",signal:ctl.signal}).then(r=>r.ok?r.json():null).then(j=>{clearTimeout(t);res(!!(j&&j.ok));}).catch(()=>{clearTimeout(t);res(false);});
  });
}
function logEvent(ev){
  ev.time=ev.time||nowClock();
  // merge running→done for same agent
  if(ev.st==="done"){ const last=[...state.run.log].reverse().find(a=>a.agent===ev.agent&&a.st==="running"); if(last){last.st="done";last.msg=ev.msg||last.msg;last.time=ev.time; refreshActivity(); return;} }
  state.run.log.push(ev); refreshActivity();
}
function refreshActivity(){ const sel=state.selection?nodeById(state.selection):null; if(sel&&sel.type==="result"&&sel._tab==="activity") renderPaneBody(sel); }
function setStatus(id,st){ const n=nodeById(id); if(!n)return; n.status=st; const d=nodeEls[id]; if(d){ const chip=d.querySelector(".status-chip"); const s=STATUS[st]; chip.dataset.st=st; chip.innerHTML=`<span class="glyph">${s.g}</span>${s.l}`; } if(state.selection===id)renderPaneHeader(n); }
function pulse(id){ const d=nodeEls[id]; if(d){ d.classList.remove("pulse"); void d.offsetWidth; d.classList.add("pulse"); } }
function nowClock(){ const d=new Date(); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}); }

function finishRun(expId,runId,aborted){
  state.run.active=false; updateProvenance();
  el.runbar.hidden=true;
  // A run that never started must not be reported as a completed one.
  if(aborted) return;
  if(state.run.plan&&state.run.plan.mode==="literature"){
    toast(`${runId} complete — literature review`);
    if(state.opts&&state.opts.autoTidy) setTimeout(()=>tidy(),250);
    return;
  }
  const resId=curProj().resultNode;
  if(resId){ setStatus(resId,"done"); togglePreview(resId,true); pulse(resId); }
  if(expId) setStatus(expId,"done");
  const nextN=curProj().nodes.find(n=>n.type==="next"); if(nextN) setStatus(nextN.id,"planned");
  toast(`${runId} complete — ${state.run.mode==="live"?"live Omnigent run":"replayed trace"}`);
  // if result pane open, refresh to show fresh charts/provenance
  const sel=state.selection?nodeById(state.selection):null; if(sel&&sel.type==="result"){ renderPaneBody(sel); }
  if(state.opts&&state.opts.autoTidy) setTimeout(()=>tidy(),250);
}
function runReplay(expId,runId){
  const pid=curProj().id;
  const steps = pid==="ndm1" ? [
    [300, ()=>logEvent({agent:"Omnigent (PI)",msg:"Approved r-03 · dispatching sub-agents",st:"done"})],
    [700, ()=>{logEvent({agent:"Literature",msg:"Scanning sources for NDM-1 inhibitor priors…",st:"running"}); runSub("literature");}],
    [1700,()=>logEvent({agent:"Literature",msg:"12 sources scanned · 3 chelation-warhead claims grounded",st:"done"})],
    [1900,()=>{logEvent({agent:"Extractor",msg:"Building labelled fixture (scaffold split)…",st:"running"}); runSub("extractor");}],
    [2800,()=>{logEvent({agent:"Extractor",msg:"RDKit fingerprints + Bemis–Murcko scaffolds ready",st:"done"}); setStatus("hA","done"); setStatus("hB","done");}],
    [3100,()=>{logEvent({agent:"Hypothesizer",msg:"Diversity-aware screen ranked above potency-only",st:"done"}); runSub("hypothesizer");}],
    [3400,()=>{logEvent({agent:"Screener",msg:"Random-forest rank over candidate pool…",st:"running"}); runSub("screener");}],
    [4600,()=>{logEvent({agent:"Screener",msg:"Enrichment 11.3× @ top 1% · 5 candidates advanced",st:"done"}); setStatus("rank","done"); pulse("rank");}],
    [5000,()=>{logEvent({agent:"Critic",msg:"Controls clean · random 1.05× · y-scramble AUC 0.52",st:"done"}); runSub("critic");}],
    [5600,()=>finishRun(expId,runId)]
  ] : [
    [300, ()=>logEvent({agent:"Omnigent (PI)",msg:`Approved ${runId} · dispatching sub-agents`,st:"done"})],
    [800, ()=>logEvent({agent:"Literature",msg:"Gathering evidence…",st:"running"})],
    [1700,()=>{logEvent({agent:"Literature",msg:"Evidence grounded",st:"done"}); nodeFirstHyp();}],
    [2100,()=>logEvent({agent:"Screener",msg:"Ranking candidates…",st:"running"})],
    [3300,()=>logEvent({agent:"Screener",msg:"Ranking complete",st:"done"})],
    [3700,()=>{logEvent({agent:"Critic",msg:"Controls checked",st:"done"}); finishRun(expId,runId);}]
  ];
  state.run.timers.forEach(clearTimeout); state.run.timers=[];
  const t0=Date.now();
  for(const [dt,fn] of steps){ state.run.timers.push(setTimeout(()=>{ if(state.run.active||dt<100) fn(); updateRunSub(Date.now()-t0); },reduceMotion?Math.min(dt,400):dt)); }
}
function nodeFirstHyp(){ const h=curProj().nodes.find(n=>n.type==="hypothesis"); if(h)setStatus(h.id,"done"); }
function runSub(name){ /* placeholder for sub-agent markers if needed */ }

  if(state.run.abort){try{state.run.abort.abort();}catch(e){}}
  state.run.active=false; el.runbar.hidden=true; updateProvenance();
  logEvent({agent:"Omnigent (PI)",msg:"Run cancelled by user",st:"failed"});

async function runViaBackend(expId,runId){
  try{
    const ctl=new AbortController(); state.run.abort=ctl;
    const res=await api("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({project:curProj().id,experiment:expId,runId,        question:state.question||curProj().question||"",
        aid:(state.opts&&state.opts.aid)||null}),signal:ctl.signal});
    // Busy is not failure. One run happens at a time because two will not fit
    // in the instance's memory, so wait for the slot instead of giving up --
    // during a demo the second person should queue, not see an error.
    if(res.status===429){
      const j=await res.json().catch(()=>({}));
      if(state.run.waits==null) state.run.waits=0;
      if(state.run.waits===0) logEvent({agent:"Relay",msg:j.error||"Waiting for the current run to finish",st:"running"});
      if(state.run.waits++ < 40 && state.run.active){
        $("#runTxt").textContent="Waiting for "+(j.busyWith||"another run");
        await new Promise(r=>setTimeout(r,6000));
        return runViaBackend(expId,runId);          // try again for the slot
      }
      logEvent({agent:"Relay",msg:"Gave up waiting for the server",st:"failed"});
      if(expId) setStatus(expId,"planned"); finishRun(expId,runId,true); toast("Server stayed busy");
      return;
    }
    // A refused run is not a dropped stream: say why instead of quietly replaying.
    if(res.status===401||res.status===403){
      const j=await res.json().catch(()=>({}));
      const why=j.error||"Not authorised to start a run";
      logEvent({agent:"Relay",msg:why,st:"failed"});
      if(expId) setStatus(expId,"planned"); finishRun(expId,runId,true);
      toast(why); refreshAuth();
      return;
    }
    state.run.waits=0;
    if(!res.ok||!res.body) throw new Error("no stream");
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){ const {value,done}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true});
      let idx; while((idx=buf.indexOf("\n\n"))>=0){ const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const line=chunk.split("\n").find(l=>l.startsWith("data:")); if(!line)continue;
        try{ applyBackendEvent(JSON.parse(line.slice(5).trim()),expId,runId); }catch(e){}
      }
    }
    finishRun(expId,runId);
  }catch(e){ // fall back to replay if the live stream drops
    if(state.run.active){ logEvent({agent:"Relay",msg:"Live stream unavailable — replaying labelled trace",st:"failed"}); state.run.mode="replay"; updateProvenance(); $("#runTxt").textContent="Replaying trace"; runReplay(expId,runId); }
  }
}
function applyBackendEvent(ev,expId,runId){
  if(ev.type==="status"&&ev.node) setStatus(ev.node,ev.status);
  else if(ev.type==="act"){
    logEvent({agent:ev.agent||"agent",msg:ev.msg||"",st:ev.st||"done"});
    // A literature run has no result node, so the activity log has nowhere to
    // show. Put the latest stage in the run bar so it is not a blank wait.
    const sub=$("#runSub");
    if(sub) sub.textContent="· "+(ev.agent?ev.agent+": ":"")+(ev.msg||"").slice(0,70);
  }
  // A research run returns a graph rather than a chart: claims, the
  // hypotheses drawn from them, and the gap worth going after next.
  else if(ev.type==="plan"){
    const p=ev.data||{};
    logEvent({agent:"Relay",
      msg:p.mode==="literature"
        ? `Literature review — ${p.why}`
        : `Compound screen — ${p.why}`, st:"done"});
    state.run.plan=p;
  }
  else if(ev.type==="graph"){ adoptRunGraph(ev.data); }
  else if(ev.type==="result"){
    // Adopt this run's own charts, tables and shortlist. Until a run happens
    // the canvas shows the bundled sample; from here it shows what was measured.
    adoptRunData(ev.data);
    if(ev.node){ setStatus(ev.node,"done"); togglePreview(ev.node,true); }
  }
  // A server-side failure is reported as itself, not hidden behind a replay.
  else if(ev.type==="error"){
    logEvent({agent:"Relay",msg:ev.msg||"Run failed on the server",st:"failed"});
    if(expId) setStatus(expId,"failed"); state.run.failed=true;
    finishRun(expId,runId,true); toast(ev.msg||"Run failed");
  }
  else if(ev.type==="done"){ finishRun(expId,runId); }
}

/* =============================== modal =============================== */
function modal(html,onwire){
  el.modalRoot.innerHTML=`<div class="modal-scrim" data-close></div><div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  el.modalRoot.classList.add("open"); el.modalRoot.setAttribute("aria-hidden","false");
  $$("[data-close]",el.modalRoot).forEach(b=>b.addEventListener("click",closeModal));
  if(onwire)onwire(el.modalRoot);
  const f=el.modalRoot.querySelector("button.primary")||el.modalRoot.querySelector("button"); if(f)f.focus();
}
function closeModal(){ el.modalRoot.classList.remove("open"); el.modalRoot.setAttribute("aria-hidden","true"); el.modalRoot.innerHTML=""; }

/* =============================== toast =============================== */
let toastT=null;
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=`<span class="tdot"></span>${esc(msg)}`;
  el.toastWrap.innerHTML=""; el.toastWrap.appendChild(t);
  if(toastT)clearTimeout(toastT); toastT=setTimeout(()=>{t.remove();},2600);
}

/* ============================ keyboard =============================== */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(el.modalRoot.classList.contains("open")){ closeModal(); return; }
    if($(".menu")){ closeMenus(); return; }
    if(state.pane.open){ const s=state.selection; closePane(); if(s&&nodeEls[s])nodeEls[s].focus(); return; }
  }
  if((e.key==="f"||e.key==="F")&&!e.target.matches("input,textarea")){ fit(true); }
  if((e.key==="t"||e.key==="T")&&!e.target.matches("input,textarea")){ tidy(); }
  if((e.key==="e"||e.key==="E")&&!e.target.matches("input,textarea")){ setEditing(!state.editing); }
  if((e.key==="Delete"||e.key==="Backspace")&&state.selection&&!e.target.matches("input,textarea")
     && !el.modalRoot.classList.contains("open")){ e.preventDefault(); deleteNode(state.selection); }
});

/* ========================= responsive nav =========================== */
$("#navToggle").addEventListener("click",()=>el.app.classList.toggle("nav-open"));
$("#navScrim").addEventListener("click",()=>el.app.classList.remove("nav-open"));
let rT=null; addEventListener("resize",()=>{ if(rT)cancelAnimationFrame(rT); rT=requestAnimationFrame(()=>{ renderMinimap(); }); });

/* ============================== init ================================ */
function init(){
  loadPersist();
  applyTheme();
  updateProvenance();
  renderProjects(); renderCrumb(); renderGraph(); renderCmdCtx(); syncQuestionBar();
  if(state.view[state.project]) applyTransform(false); else fit(false);
  // open the result preview by default on first load (matches the primary mock)
  if(!localStorageSeen()){ const id=curProj().resultNode; if(id){ previewState(id).open=true; renderPreviews(); } }
  setTimeout(()=>{ el.canvasHint.textContent="Click a node to inspect · Del to remove · scroll to pan, ⌘/Ctrl+scroll to zoom"; el.canvasHint.classList.add("show"); setTimeout(()=>el.canvasHint.classList.remove("show"),5200); },700);
  scheduleMinimap();
}
function localStorageSeen(){ try{return !!localStorage.getItem(LSK);}catch(e){return false;} }
init();

})();
</script>
</body>
</html>
