<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* =========================================================================
   Relay — autonomous discovery lab UI
   Layout: a fixed app frame — projects-only rail + topbar + a movable research
   graph that yields its right half to a detail pane. Charts live in previews
   and the pane, never as a permanent dashboard.
   ========================================================================= */

/* ---- design tokens (light is primary; dark mirrors every token) ---------- */
:root{
  --font-ui:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-fig:"Source Serif 4",Georgia,"Times New Roman",serif;

  /* neutrals carry a faint cobalt bias so grey reads intentional */
  --bg:#eef2f9;            /* app ground behind panels */
  --canvas:#f8fafd;        /* graph surface */
  --surface:#ffffff;       /* cards, nodes, panels */
  --surface-2:#f2f6fc;     /* insets, hovers */
  --sidebar:#f1f5fc;
  --line:#dbe3f0;          /* hairlines / borders */
  --line-soft:#e8eef7;
  --grid-dot:#d4ddec;

  --ink:#15233f;           /* primary navy text */
  --ink-2:#5b6b87;         /* secondary */
  --ink-3:#8795ad;         /* muted / captions */

  --accent:#2f66ff;        /* cobalt selection */
  --accent-strong:#1c4bdb;
  --accent-soft:#e7eeff;   /* selected fill */
  --accent-ring:rgba(47,102,255,.32);

  /* status — paired ALWAYS with a glyph + label, never colour alone */
  --st-planned:#8795ad;
  --st-running:#2f66ff;
  --st-done:#179e6b;
  --st-failed:#d94452;
  --st-await:#d58a0c;

  /* chart ink (reads on chart surface in both themes) */
  --series-1:#2f66ff;      /* proposed method */
  --series-1-band:rgba(47,102,255,.14);
  --series-2:#9aa6bd;      /* baseline / random */
  --chart-grid:#e7edf6;
  --chart-axis:#aeb9cc;

  --shadow-sm:0 1px 2px rgba(21,35,63,.06),0 1px 1px rgba(21,35,63,.04);
  --shadow-md:0 6px 18px rgba(21,35,63,.10),0 2px 6px rgba(21,35,63,.06);
  --shadow-lg:0 18px 48px rgba(21,35,63,.18),0 6px 16px rgba(21,35,63,.10);
  --radius:12px;
  --radius-sm:9px;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1018; --canvas:#0e1420; --surface:#141c2b; --surface-2:#1a2435;
    --sidebar:#0f1623; --line:#273246; --line-soft:#1d2738; --grid-dot:#1d2a3e;
    --ink:#e9eefb; --ink-2:#9fadc6; --ink-3:#73819b;
    --accent:#5b8bff; --accent-strong:#7aa0ff; --accent-soft:#17243d; --accent-ring:rgba(91,139,255,.4);
    --st-planned:#7f8da6; --st-running:#5b8bff; --st-done:#34b98a; --st-failed:#f0697a; --st-await:#eaa63a;
    --series-1:#5b8bff; --series-1-band:rgba(91,139,255,.18); --series-2:#6b7890;
    --chart-grid:#222e42; --chart-axis:#44526b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 8px 22px rgba(0,0,0,.5);
    --shadow-lg:0 20px 52px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1018; --canvas:#0e1420; --surface:#141c2b; --surface-2:#1a2435;
  --sidebar:#0f1623; --line:#273246; --line-soft:#1d2738; --grid-dot:#1d2a3e;
  --ink:#e9eefb; --ink-2:#9fadc6; --ink-3:#73819b;
  --accent:#5b8bff; --accent-strong:#7aa0ff; --accent-soft:#17243d; --accent-ring:rgba(91,139,255,.4);
  --st-planned:#7f8da6; --st-running:#5b8bff; --st-done:#34b98a; --st-failed:#f0697a; --st-await:#eaa63a;
  --series-1:#5b8bff; --series-1-band:rgba(91,139,255,.18); --series-2:#6b7890;
  --chart-grid:#222e42; --chart-axis:#44526b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 8px 22px rgba(0,0,0,.5);
  --shadow-lg:0 20px 52px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-ui);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============================ app frame ================================== */
.app{
  display:grid;grid-template-columns:232px 1fr;height:100%;
}

/* --------------------------------- sidebar ------------------------------- */
.sidebar{
  background:var(--sidebar);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  padding:18px 14px 14px;gap:4px;
}
.brand{display:flex;align-items:center;gap:8px;padding:2px 4px 16px}
.brand .brand-mark{width:34px;height:34px;flex:0 0 auto}
.brand .wordmark{font-family:"Fredoka",var(--font-ui);font-weight:600;font-size:25px;letter-spacing:-.005em;color:var(--ink);line-height:1}
.rail-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 8px;margin-top:2px;
}
.rail-head h2{
  margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
}
.icon-btn{
  display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  transition:background .15s,border-color .15s,color .15s,transform .08s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--accent-ring)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:16px;height:16px}

.projects{display:flex;flex-direction:column;gap:2px;margin-top:6px;overflow-y:auto;min-height:0}
.project{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  border:1px solid transparent;color:var(--ink-2);font-weight:600;font-size:13.5px;
  width:100%;text-align:left;background:transparent;transition:background .14s,color .14s;
}
.project .pj-ico{width:17px;height:17px;flex:0 0 auto;color:var(--ink-3)}
.project:hover{background:var(--surface-2);color:var(--ink)}
.project[aria-current="true"]{
  background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent-ring);
}
.project[aria-current="true"] .pj-ico{color:var(--accent)}
.project .pj-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:3px}
.foot-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--ink-2);background:transparent;border:0;font-size:13px;font-weight:600;width:100%;text-align:left;transition:background .14s,color .14s}
.foot-row:hover{background:var(--surface-2);color:var(--ink)}
.foot-row>svg{width:22px;height:22px;padding:3px;box-sizing:border-box;color:var(--ink-3);flex:0 0 auto}
.foot-row{gap:9px}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}

/* --------------------------------- main --------------------------------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}

.topbar{
  display:flex;align-items:center;gap:12px;padding:12px 18px;
  border-bottom:1px solid var(--line);background:var(--surface);
  flex:0 0 auto;min-height:60px;
}
.crumb{display:flex;align-items:center;gap:7px;min-width:0}
.crumb-btn{
  display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink);
  max-width:46vw;transition:border-color .14s,background .14s;
}
.crumb-btn:hover{border-color:var(--accent-ring);background:var(--surface-2)}
.crumb-btn .sep{color:var(--ink-3);font-weight:500}
.crumb-btn .run-name{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb-btn svg{width:14px;height:14px;color:var(--ink-3);flex:0 0 auto}

.provenance{
  display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
  font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  transition:border-color .14s,background .14s,color .14s;white-space:nowrap;
}
.provenance:hover{border-color:var(--accent-ring);color:var(--ink)}
.provenance .prov-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.provenance[data-kind="live"]{color:var(--st-done);border-color:color-mix(in srgb,var(--st-done) 40%,transparent)}
.provenance[data-kind="live"] .prov-dot{background:var(--st-done)}
.provenance[data-kind="replay"]{color:var(--st-await);border-color:color-mix(in srgb,var(--st-await) 40%,transparent)}
.provenance[data-kind="replay"] .prov-dot{background:var(--st-await)}
.provenance svg{width:13px;height:13px}

.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink);
  transition:background .14s,border-color .14s,transform .08s,box-shadow .14s;
}
.btn:hover{background:var(--surface-2);border-color:var(--accent-ring)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px var(--accent-ring)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}

/* ------------------------------ workspace -------------------------------- */
.workspace{position:relative;flex:1;min-height:0;display:flex;overflow:hidden}

.canvas{
  position:relative;flex:1;min-width:0;overflow:hidden;background:var(--canvas);
  background-image:radial-gradient(var(--grid-dot) 1.3px,transparent 1.3px);
  background-size:26px 26px;background-position:0 0;
  touch-action:none;cursor:grab;
}
.canvas.panning{cursor:grabbing}
.world{position:absolute;top:0;left:0;transform-origin:0 0}
/* Promote only while a gesture is running: a permanently promoted layer is
   rasterized once and scaled, which is what made zoomed-in text grainy. */
.canvas.panning .world,.canvas.zooming .world{will-change:transform}
.edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;width:10px;height:10px}
#nodes{position:absolute;top:0;left:0}

/* ---- nodes ---- */
.node{
  position:absolute;width:196px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
  transition:box-shadow .16s,border-color .16s,transform .06s;
  user-select:none;
}
.node:hover{box-shadow:var(--shadow-md);border-color:var(--accent-ring)}
.node.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring),var(--shadow-md)}
.node.pulse{animation:nodepulse 1.1s ease}
/* Editing affordances appear only in edit mode, so the locked view stays calm. */
.editing .node{cursor:grab}
.editing .node.dragging{cursor:grabbing;box-shadow:var(--shadow-lg);z-index:20}
.editing .node .node-head{cursor:inherit}
.port{
  position:absolute;right:-7px;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.18);
  opacity:0;transform:scale(.6);transition:opacity .14s,transform .14s;cursor:crosshair;z-index:6;
}
.editing .node:hover .port,.editing .node.selected .port{opacity:1;transform:scale(1)}
.port:hover{background:var(--accent)}
.node.context-target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-ring)}
.node.link-target{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-ring),var(--shadow-md)}
.edge-ghost{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;opacity:.9}
.pill-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill-btn.on:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
/* A quiet band so the mode is obvious without a banner. */
.editing #canvas::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 0 2px var(--accent-ring);border-radius:inherit;
}
/* Nodes the run produced read as the record: solid, filled. Nodes the user
   added are visibly their own: dashed edge, tinted, with a corner marker. */
.node[data-origin="user"]{
  border-style:dashed;border-color:var(--ink-3);
  background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--surface);
}
.node[data-origin="user"]::after{
  content:"";position:absolute;top:-1px;right:-1px;width:0;height:0;
  border-top:13px solid var(--ink-3);border-left:13px solid transparent;
  border-top-right-radius:var(--radius);opacity:.5;
}
.node[data-origin="user"].selected{border-color:var(--accent);border-style:solid}
.node[data-origin="user"] .node-type-tag::after{content:" · yours";opacity:.8}
@keyframes nodepulse{0%{box-shadow:0 0 0 0 var(--accent-ring),var(--shadow-sm)}40%{box-shadow:0 0 0 8px var(--accent-ring),var(--shadow-md)}100%{box-shadow:0 0 0 0 transparent,var(--shadow-sm)}}
.node-head{display:flex;align-items:center;gap:9px;padding:11px 12px 7px}
.node{cursor:pointer}
.node-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--ink-3);position:relative}
.node-type-tag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.node-title{font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.3;padding:0 12px}
.node-sum{font-size:12px;color:var(--ink-2);padding:3px 12px 0;line-height:1.35}
.node-foot{display:flex;align-items:center;gap:8px;padding:9px 12px 11px;margin-top:4px}
.status-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-soft);
}
.status-chip .glyph{font-size:11px;line-height:1;display:inline-grid;place-items:center;width:12px;height:12px}
.status-chip[data-st="planned"]{color:var(--st-planned)}
.status-chip[data-st="running"]{color:var(--st-running);border-color:color-mix(in srgb,var(--st-running) 35%,transparent);background:var(--accent-soft)}
.status-chip[data-st="done"]{color:var(--st-done);border-color:color-mix(in srgb,var(--st-done) 32%,transparent)}
.status-chip[data-st="failed"]{color:var(--st-failed);border-color:color-mix(in srgb,var(--st-failed) 32%,transparent)}
.status-chip[data-st="await"]{color:var(--st-await);border-color:color-mix(in srgb,var(--st-await) 32%,transparent)}
.status-chip[data-st="running"] .glyph{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link-btn{
  margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent);background:transparent;border:0;padding:3px 4px;border-radius:6px;
}
.link-btn:hover{background:var(--accent-soft)}

/* node accents by type (the dot colour is a cue, not the only cue — type tag + pane confirm) */
.node[data-type="question"] .node-dot{background:#6b7a96}
.node[data-type="source"]   .node-dot{background:#2f9e8f}
.node[data-type="hypothesis"] .node-dot{background:#8a6bd8}
.node[data-type="experiment"] .node-dot{background:var(--accent)}
.node[data-type="result"]   .node-dot{background:#1f8fe0}
.node[data-type="next"]     .node-dot{background:#c17d1b}
.node[data-type="note"]     .node-dot{background:#9aa6bd}

/* ---- edges ---- */
.edge-path{fill:none;stroke:var(--line);stroke-width:1.8;transition:stroke .16s,stroke-width .16s;stroke-linecap:round}
.edge-path.active{stroke:var(--accent);stroke-width:2.4}
.edge-path.contradicts{stroke-dasharray:5 4}
.edge-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.edge-label{
  font-family:var(--font-ui);font-size:10.5px;font-weight:700;letter-spacing:.04em;
  fill:var(--ink-2);text-transform:uppercase;opacity:0;transition:opacity .15s;pointer-events:none;
}
.edge-label-bg{fill:var(--surface);opacity:0;transition:opacity .15s}
.edge-g.show .edge-label,.edge-g.show .edge-label-bg{opacity:1}
.edge-g.show .edge-label-bg{opacity:.92}

/* ---- inline preview card ---- */
.preview{
  position:absolute;width:360px;background:var(--surface);border:1px solid var(--accent-ring);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden;z-index:15;
  display:flex;flex-direction:column;min-width:260px;min-height:150px;
}
.preview.collapsed{height:auto!important;min-height:0}
.preview-head{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line-soft);cursor:grab}
.preview-head .node-dot{width:9px;height:9px}
.preview-title{font-weight:700;font-size:12.5px;color:var(--ink)}
.preview-head .sp{margin-left:auto;display:flex;gap:3px}
.mini-btn{width:24px;height:24px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-3);display:grid;place-items:center}
.mini-btn:hover{background:var(--surface-2);color:var(--ink)}
.mini-btn svg{width:14px;height:14px}
.preview-tabs{display:flex;gap:2px;padding:6px 10px 0}
.tab{font-size:12px;font-weight:600;color:var(--ink-3);padding:6px 9px;border:0;background:transparent;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-strong);border-bottom-color:var(--accent)}
.preview-body{padding:10px 12px 12px;overflow:auto;flex:1;min-height:0}
.preview .resize-h{position:absolute;right:3px;bottom:3px;width:16px;height:16px;cursor:nwse-resize;color:var(--ink-3)}
.preview .resize-h svg{width:16px;height:16px;opacity:.6}
.illus-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-soft);letter-spacing:.02em}

/* ------------------------- canvas overlays ------------------------------- */
.overlay{position:absolute;z-index:30}
.zoomctl{left:16px;bottom:16px;display:flex;align-items:center;gap:6px}
.zoomctl .group{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-sm);overflow:hidden}
.zoomctl .zbtn{width:34px;height:34px;display:grid;place-items:center;background:transparent;border:0;color:var(--ink-2);font-size:17px}
.zoomctl .zbtn:hover{background:var(--surface-2);color:var(--ink)}
.zoomctl .zlabel{min-width:48px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pill-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-sm);font-size:13px;font-weight:600;color:var(--ink-2)}
.pill-btn:hover{background:var(--surface-2);color:var(--ink)}
.pill-btn svg{width:15px;height:15px}

/* The bottom row holds three overlays. Their widths change (Tidy was added,
   the minimap hides when the canvas is narrow), so the command bar is inset
   by whatever the other two actually measure rather than a guessed gap. */
.cmdbar{left:calc(var(--bl,300px) + 20px);right:calc(var(--br,204px) + 20px);
  bottom:18px;transform:none;width:auto;max-width:560px;margin-inline:auto;z-index:28}
.minimap[hidden]{display:none}
.cmd-ctx{display:flex;gap:6px;margin:0 0 7px 4px;flex-wrap:wrap}
.ctx-chip{font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:6px}
.ctx-chip .x{color:var(--ink-3);font-weight:700}
.cmd-wrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:var(--shadow-md)}
.cmd-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring),var(--shadow-md)}
.cmd-wrap .plus-btn{display:grid;place-items:center;width:26px;height:26px;flex:0 0 auto;padding:0;
  background:none;border:0;border-radius:7px;color:var(--ink-3);cursor:pointer;transition:background .14s,color .14s}
.cmd-wrap .plus-btn:hover{background:var(--surface-2);color:var(--accent)}
.cmd-wrap input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);padding:5px 0}
.cmd-wrap input::placeholder{color:var(--ink-3)}
.cmd-wrap input:focus{outline:none}
.send-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto;transition:background .14s}
.send-btn:hover{background:var(--accent);color:#fff}
.send-btn svg{width:16px;height:16px}

.minimap{right:16px;bottom:16px;width:188px;height:120px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-sm);overflow:hidden;backdrop-filter:blur(3px)}
.minimap svg{width:100%;height:100%;display:block}
.mm-node{fill:var(--ink-3);opacity:.55}
.mm-node.sel{fill:var(--accent);opacity:1}
.mm-view{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5;opacity:.5}

/* ------------------------------- divider --------------------------------- */
.divider{width:7px;flex:0 0 auto;cursor:col-resize;background:transparent;position:relative;z-index:26}
.divider::after{content:"";position:absolute;inset:0 3px;background:var(--line);border-radius:3px;transition:background .14s}
.divider:hover::after,.divider.dragging::after{background:var(--accent)}
.divider[hidden]{display:none}

/* ------------------------------ detail pane ------------------------------ */
.pane{
  flex:0 0 auto;width:48%;min-width:320px;max-width:72%;background:var(--surface);
  border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  box-shadow:-8px 0 24px rgba(21,35,63,.05);
}
.pane[hidden]{display:none}
.pane.maximized{width:100%!important;max-width:100%}
.pane-head{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.pane-head .node-dot{width:11px;height:11px}
.pane-titles{min-width:0;flex:1}
.pane-type{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pane-name{font-weight:700;font-size:16px;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.pane-head .status-chip{flex:0 0 auto}
.pane-head .pane-ctl{display:flex;gap:4px;flex:0 0 auto}
.pane-body{flex:1;min-height:0;overflow:auto;padding:18px 18px 28px}

.section{margin-bottom:22px}
.section>h3{margin:0 0 9px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:132px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;color:var(--ink)}
.prose{font-size:13.5px;color:var(--ink);line-height:1.6}
.prose p{margin:0 0 10px}
.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.bullets li{position:relative;padding-left:18px;font-size:13px;color:var(--ink);line-height:1.5}
.bullets li::before{content:"";position:absolute;left:3px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bullets li.neg::before{background:var(--st-failed)}
.bullets li.pos::before{background:var(--st-done)}
.evidence-card{border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:10px;background:var(--surface)}
.evidence-card:hover{border-color:var(--accent-ring)}
.evidence-card .ec-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.evidence-card .ec-src{font-weight:700;font-size:13px;color:var(--ink)}
.evidence-card .ec-meta{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.evidence-card .ec-body{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.rel-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-3)}
.rel-tag.supports{color:var(--st-done)}
.rel-tag.contradicts{color:var(--st-failed)}

.pane-tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.pane-tabs .tab{padding:8px 11px;font-size:13px}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--surface)}
.stat .s-val{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .s-lab{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:3px}
.stat .s-sub{font-size:11px;color:var(--ink-2);margin-top:4px}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700}
.tbl td{color:var(--ink)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}

.callout{display:flex;gap:9px;padding:11px 13px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-2);line-height:1.5}
.callout svg{width:16px;height:16px;color:var(--st-await);flex:0 0 auto;margin-top:1px}
.pane-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip-action{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chip-action:hover{border-color:var(--accent-ring);background:var(--surface-2)}
.chip-action.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-action.primary:hover{background:var(--accent-strong)}
.chip-action svg{width:14px;height:14px}
.chip-action[disabled]{opacity:.45;cursor:not-allowed}

/* activity log */
.activity{display:flex;flex-direction:column;gap:0}
.act-item{display:grid;grid-template-columns:18px 1fr;gap:11px;padding:0 0 2px}
.act-rail{display:flex;flex-direction:column;align-items:center}
.act-marker{width:11px;height:11px;border-radius:50%;background:var(--ink-3);margin-top:3px;flex:0 0 auto;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.act-item[data-st="running"] .act-marker{background:var(--st-running);animation:actpulse 1.2s ease-in-out infinite}
.act-item[data-st="done"] .act-marker{background:var(--st-done)}
.act-item[data-st="failed"] .act-marker{background:var(--st-failed)}
@keyframes actpulse{0%,100%{box-shadow:0 0 0 1px var(--line)}50%{box-shadow:0 0 0 4px var(--accent-ring)}}
.act-line{width:2px;flex:1;background:var(--line-soft);min-height:14px}
.act-item:last-child .act-line{display:none}
.act-body{padding-bottom:16px}
.act-agent{font-size:12.5px;font-weight:700;color:var(--ink)}
.act-msg{font-size:12.5px;color:var(--ink-2);margin-top:1px;line-height:1.45}
.act-time{font-size:11px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}

/* ------------------------------- charts ---------------------------------- */
.chart{width:100%}
.chart .fig-title{font-family:var(--font-fig);font-size:15px;font-weight:600;color:var(--ink);margin:0 0 2px}
.chart .fig-sub{font-size:11.5px;color:var(--ink-3);margin:0 0 8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.axis-line{stroke:var(--chart-axis);stroke-width:1}
.grid-line{stroke:var(--chart-grid);stroke-width:1}
.tick-lab{fill:var(--ink-3);font-size:10px;font-family:var(--font-ui)}
.axis-title{fill:var(--ink-2);font-size:10.5px;font-weight:600;font-family:var(--font-ui)}
.fig-title-svg{fill:var(--ink);font-family:var(--font-fig);font-size:13px;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px}
.legend .lg{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);background:transparent;border:0;font-weight:600;padding:2px 2px}
.legend .lg .sw{width:16px;height:3px;border-radius:2px;flex:0 0 auto}
.legend .lg .sw.dot{width:9px;height:9px;border-radius:50%}
.legend .lg[aria-pressed="false"]{opacity:.4}
.data-point{cursor:pointer}
.bar-row:hover .bar-fill{filter:brightness(1.06)}
.bar-row.sel .bar-fill{stroke:var(--ink);stroke-width:1.5}

/* ------------------------------- modal ----------------------------------- */
.modal-root{position:fixed;inset:0;z-index:100;display:none}
.modal-root.open{display:block}
.modal-scrim{position:absolute;inset:0;background:rgba(14,22,38,.42);backdrop-filter:blur(2px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100% - 32px));max-height:min(86vh,720px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);
  animation:pop .2s cubic-bezier(.2,.8,.3,1.1);
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px}
.modal-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.modal-head p{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.modal-head .icon-btn{margin-left:auto}
.modal-body{padding:4px 22px 8px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px 20px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--surface) 24%)}
.field{margin-bottom:14px}
.section .field:last-child{margin-bottom:0}
.field label.flab{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.field .fval{font-size:13.5px;color:var(--ink)}
.node-form input,.node-form textarea,.node-form select,
.modal-body .field input,.modal-body .field textarea,.modal-body .field select{
  width:100%;box-sizing:border-box;font:inherit;font-size:13.5px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  transition:border-color .14s,box-shadow .14s;
}
.node-form input:focus,.node-form textarea:focus,.node-form select:focus,
.modal-body .field input:focus,.modal-body .field textarea:focus,.modal-body .field select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);
}
.node-form input,.node-form textarea,.modal-body .field input,.modal-body .field textarea{min-height:40px}
.node-form textarea,.modal-body .field textarea{resize:vertical;line-height:1.5;min-height:76px}
.node-form select,.modal-body .field select{
  appearance:none;-webkit-appearance:none;min-height:40px;line-height:1.5;
  padding-right:34px;cursor:pointer;
  background-color:var(--surface-2);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23808a9b' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;background-size:14px;
}
.node-form .req{font-size:9.5px;color:var(--accent);letter-spacing:.04em;margin-left:5px}
.menu .mi.danger{color:#c0392b}
.menu .mi.danger:hover{background:rgba(192,57,43,.1)}
:root[data-theme="dark"] .menu .mi.danger{color:#ff8a7a}
.cog-btn{margin-left:auto;display:grid;place-items:center;width:22px;height:22px;padding:0;
  background:none;border:0;color:var(--ink-3);cursor:pointer;opacity:.75;transition:color .14s,opacity .14s}
.cog-btn svg{width:16px;height:16px}
.cog-btn:hover{color:var(--accent);opacity:1}
.cog-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
button.brand{width:100%;background:transparent;border:0;cursor:pointer;text-align:left}
button.brand:hover .wordmark{color:var(--accent-strong)}
.avatar.dev{background:var(--surface-2);color:var(--ink-3);font-size:8.5px;letter-spacing:.04em;
  border:1px dashed var(--line)}
.flab-action{float:right;background:none;border:0;padding:0;font:inherit;font-size:10.5px;
  font-weight:700;letter-spacing:.04em;text-transform:none;color:var(--accent);cursor:pointer}
.flab-action:hover{text-decoration:underline}
.flab-action:disabled{color:var(--ink-3);cursor:default;text-decoration:none}
.sharpen{border:1px solid var(--accent-ring);background:var(--accent-soft);border-radius:11px;padding:13px 14px;margin:-4px 0 14px}
.sharpen-wait{font-size:13px;color:var(--ink-2)}
.sharpen-flag{font-size:12px;font-weight:700;color:var(--st-await);margin-bottom:7px}
.sharpen-q{font-size:13.5px;line-height:1.55;color:var(--ink)}
.sharpen-list{margin:9px 0 0;padding-left:17px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.sharpen-sub{margin-top:8px;font-size:12px;color:var(--ink-3);line-height:1.45}
.sharpen-actions{display:flex;gap:8px;margin-top:12px}
.empty-state{padding:28px 4px;text-align:left}
.empty-state h3{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 8px}
.empty-state p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0 0 18px;max-width:52ch}
.preview-empty{padding:26px 10px;text-align:center;font-size:12.5px;color:var(--ink-3)}
.link-node{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-align:left}
.link-node:hover{text-decoration:underline}
.bullets li .rel-tag{margin-left:8px}
.prose p.muted{color:var(--ink-3)}
.ec-link{margin-top:7px;font-size:12px}
.ec-link a{color:var(--accent);text-decoration:none;word-break:break-all}
.ec-link a:hover{text-decoration:underline}
.form-error{margin-top:4px;font-size:12.5px;color:#c0392b;font-weight:600}
:root[data-theme="dark"] .form-error{color:#ff8a7a}
.btn.danger{background:#c0392b;border-color:#c0392b;color:#fff}
.btn.danger:hover{background:#a93226;border-color:#a93226}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;border:1px solid var(--line);border-radius:12px;padding:15px 16px;background:var(--surface-2)}
.budget-bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:7px}
.budget-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.approve{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;margin-top:6px;cursor:pointer;transition:border-color .14s,background .14s}
.approve:hover{border-color:var(--accent-ring)}
.approve.checked{border-color:var(--accent);background:var(--accent-soft)}
.approve .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--ink-3);display:grid;place-items:center;flex:0 0 auto;margin-top:1px;transition:border-color .14s,background .14s}
.approve.checked .box{border-color:var(--accent);background:var(--accent)}
.approve .box svg{width:12px;height:12px;color:#fff;opacity:0}
.approve.checked .box svg{opacity:1}
.approve .atext{font-size:13px;color:var(--ink);line-height:1.45}
.approve .atext b{font-weight:700}

/* menu (dropdown) */
@keyframes menupop{from{opacity:0}to{opacity:1}}
.menu{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:216px;transform-origin:top left;animation:menupop .12s cubic-bezier(.2,.8,.3,1)}
@media (prefers-reduced-motion:reduce){.menu{animation:none}}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--ink);text-align:left}
.menu .mi:hover{background:var(--surface-2)}
.menu .mi .mi-ico{width:16px;height:16px;color:var(--ink-3);flex:0 0 auto}
.menu .mi-project{gap:10px}
.menu .mi-project .mi-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .mi-project .mi-run{flex:0 0 auto;margin-left:14px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.menu .mi[aria-current="true"]{color:var(--accent-strong)}
.menu .mi[aria-current="true"] .mi-ico{color:var(--accent)}
.menu .mi .mi-sub{font-size:11px;color:var(--ink-3);font-weight:500}
.menu .m-sep{height:1px;background:var(--line-soft);margin:5px 2px}
.menu .m-head{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:7px 10px 4px}

/* toast */
.toast-wrap{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:toastin .22s ease}
.toast .tdot{width:8px;height:8px;border-radius:50%;background:var(--st-done)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* run progress banner */
.runbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:32;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--accent-ring);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:var(--shadow-md)}
.runbar[hidden]{display:none}
.runbar .spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .7s linear infinite}
.runbar .r-txt{font-size:12.5px;font-weight:600;color:var(--ink)}
.runbar .r-sub{font-size:11.5px;color:var(--ink-3)}
.runbar .r-cancel{font-size:12px;font-weight:700;color:var(--st-failed);background:transparent;border:0;padding:5px 9px;border-radius:7px}
.runbar .r-cancel:hover{background:color-mix(in srgb,var(--st-failed) 12%,transparent)}

/* empty / hint */
.canvas-hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:5;font-size:12px;color:var(--ink-3);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:5px 12px;border-radius:999px;border:1px solid var(--line-soft);pointer-events:none;opacity:0;transition:opacity .3s}
.canvas-hint.show{opacity:1}

/* ------------------------- responsive / narrow --------------------------- */
.scrim-mobile{display:none}
.sidebar-toggle{display:none}

@media (max-width:1040px){
  .pane{width:52%}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:90;transform:translateX(-102%);transition:transform .24s cubic-bezier(.2,.8,.3,1);box-shadow:var(--shadow-lg)}
  .app.nav-open .sidebar{transform:none}
  .app.nav-open .scrim-mobile{display:block;position:fixed;inset:0;background:rgba(14,22,38,.4);z-index:80}
  .sidebar-toggle{display:inline-grid}
  .workspace{flex-direction:column}
  .divider{display:none!important}
  .pane{width:100%!important;max-width:100%;min-width:0;height:52%;border-left:0;border-top:1px solid var(--line);box-shadow:none}
  .pane.maximized{height:100%}
  .canvas{min-height:180px}
  .app.pane-open .canvas{flex:0 0 48%}
  .cmdbar{width:calc(100% - 32px)}
  .minimap{display:none}
  .crumb-btn{max-width:52vw}
}
@media (max-width:560px){
  .provenance .prov-txt-long{display:none}
  .top-actions .btn-label{display:none}
  .btn{padding:8px 10px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<script>window.RELAY_CONFIG = window.RELAY_CONFIG || { backendUrl:"" };</script>

<div class="app" id="app">
  <div class="scrim-mobile" id="navScrim"></div>

  <!-- ============================ SIDEBAR ============================ -->
  <aside class="sidebar" id="sidebar">
    <button class="brand" id="brand" type="button" aria-label="Relay on GitHub" title="Open the source on GitHub">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M11 20 L27.5 11" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M11 20 L19 30.5" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/>

/* ============================ chart datasets ============================= */

   until then the interface says there is nothing rather than showing

const CHART_DATA={live:null};

/* ============================ project models ============================= */
function P(id,type,title,summary,status,x,y,meta){return {id,type,title,summary,status,x,y,meta:meta||{}};}
const BASE={
  ndm1:{
    id:"ndm1", name:"NDM-1", icon:"flask", run:"Experiment 03", primaryExp:"exp", resultNode:"res",
    nodes:[
      P("q1","question","Research question","Which untested compounds should we assay for NDM-1 inhibition?","done",40,300,{
        objective:"Rank untested compounds by predicted ability to inhibit NDM-1, so wet-lab assays target the most promising few first.",
        scope:"In-silico triage filter (screening pipeline) — not a drug. Restoring carbapenem activity against resistant K. pneumoniae is the therapeutic motivation.",
        outcome:"Enrichment factor at a fixed assay budget; ROC-AUC on a held-out scaffold split.",
        constraints:"No wet-lab validation in-loop; honest controls required.",
        data:"PubChem BioAssay (NDM-1) + labelled synthetic fixture (medlab/data.py).",
        budget:"≤ 40 tool calls · scaffold-split cross-validation"
      }),
      P("ev1","source","Evidence","12 sources · assay records + MBL inhibitor literature","done",300,300,{
        sources:[
          {src:"PubChem BioAssay — NDM-1",meta:"assay records",rel:"supports",body:"Dose–response records for the di-zinc metallo-β-lactamase target; basis for labelled actives/inactives."},
          {src:"Metallo-β-lactamase inhibitor review",meta:"literature",rel:"supports",body:"Thiol-carboxylate and hydroxamate chemotypes recur as validated MBL binders — priors for the chelation hypothesis."},
          {src:"Synthetic fixture (medlab/data.py)",meta:"labelled fixture",rel:"supports",body:"Scaffold-annotated stand-in used while PubChem is firewalled; enables a clean held-out split."}
        ],
        relevance:"Grounds the chelation-warhead prior and supplies the labelled set for ranking.",
        limitations:"Synthetic fixture is a stand-in; the real-data run uses --aid once a PubChem assay id is chosen."
      }),
      P("hA","hypothesis","Hypothesis A","Metal-chelating warheads inhibit the di-Zn active site","done",560,170,{
        statement:"Compounds bearing metal-chelating warheads (thiol-carboxylate, hydroxamate) inhibit NDM-1 by coordinating its two active-site zinc ions.",
        predictions:["Chelating chemotypes score above the library median.","Top hits cluster into a few known MBL-binder scaffolds."],
        supports:["MBL inhibitor literature (12 sources)","Enrichment of chelator scaffolds in ranking"],
        contradict:["Some potent chelators are promiscuous binders — potency alone may mislead"],
        uncertainty:"Moderate — priors are strong but unvalidated on this library.",
        alt:"Potency-only ranking (Hypothesis B)."
      }),
      P("hB","hypothesis","Hypothesis B","Scaffold diversity beats pure potency ranking","done",560,430,{
        statement:"A diversity-aware screen (penalising near-duplicate scaffolds) yields more confirmed hits per assay than ranking on predicted potency alone.",
        predictions:["Diversity-aware top-k has higher enrichment at fixed budget.","Fewer redundant scaffolds among selected candidates."],
        supports:["Bemis–Murcko scaffold spread in candidate set"],
        contradict:["Evidence set skews toward a few chemotypes — diversity may trade away potency"],
        uncertainty:"Moderate.",
        alt:"Potency-only ranking."
      }),
      P("exp","experiment","Experiment 03","Diversity-aware screen","planned",830,300,{
        tests:[
          {name:"Potency-only ranking",sel:false,why:"Simplest baseline; ranks purely on predicted P(inhibits)."},
          {name:"Diversity-aware screen",sel:true,why:"Penalises near-duplicate Bemis–Murcko scaffolds — expected to raise confirmed hits per assay."}
        ],
        method:"Random-forest on RDKit fingerprints; Bemis–Murcko scaffold split.",
        inputs:"Labelled fixture + untested candidate pool.",
        baseline:"Random selection.",
        controls:"Random control + y-scramble.",
        params:"n_estimators=400 · scaffold split · top-k = 5",
        cost:"~28 tool calls (est.)",
        approval:"Required before run."
      }),
      P("rank","result","Candidate ranking","5 candidates advanced","done",830,520,{isRank:true,
        provenance:{run:"r-03",data:"fixture v2",code:"medlab@a1f3",params:"top-k=5"}
      }),
      P("res","result","Results · 03","Enrichment + ranked scores","done",1100,250,{
        provenance:{run:"r-03",data:"synthetic fixture v2 (scaffold split)",code:"medlab@a1f3",params:"RF-400 · top-k=5",approvals:"approved · r-03"}
      }),
      P("next","next","Next experiment","Choose a test","planned",1380,140,{
        changed:"Chelation-warhead prior held; diversity-aware screen beat potency-only on enrichment.",
        uncertainty:"Does the ranking transfer to real PubChem actives, not just the synthetic fixture?",
        tests:[
          {name:"Real-data run (--aid)",why:"Re-run the identical pipeline on a chosen PubChem NDM-1 BioAssay for a real enrichment number.",cost:"~30 calls"},
          {name:"Ablate the diversity term",why:"Quantify how much of the lift comes from scaffold-diversity vs the model.",cost:"~18 calls"}
        ]
      })
    ],
    edges:[
      {from:"q1",to:"ev1",rel:"uses"},
      {from:"ev1",to:"hA",rel:"supports"},
      {from:"ev1",to:"hB",rel:"contradicts"},
      {from:"hA",to:"exp",rel:"tests"},
      {from:"hB",to:"exp",rel:"tests"},
      {from:"exp",to:"rank",rel:"produced"},
      {from:"exp",to:"res",rel:"produced"},
      {from:"res",to:"next",rel:"uses"}
    ]
  }
};
let PROJECT_ORDER=["ndm1"];   // user projects append; deleted ones drop out
const PROJECT_ICON={
  flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/>',
  layers:'<path d="M12 3 2 8l10 5 10-5-10-5zM2 14l10 5 10-5M2 11l10 5 10-5"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
};

/* ================================ state ================================= */
let state={
  project:"ndm1",
  theme:null,            // null = follow system
  selection:null,
  pane:{open:false,maximized:false,widthPx:null},
  projects:{},           // runtime clones
  view:{},               // {pid:{tx,ty,scale}}
  previews:{},           // {pid:{nid:{open,x,y,w,h,tab}}}
  run:{active:false,log:[],mode:null,id:3,timers:[],abort:null},
  deletedProjects:[],
  question:null,
  opts:{aid:null,autoTidy:false},   // user-adjustable run options
  editing:false        // locked by default: structure is read-only and auto-spaced
};
function curProj(){return state.projects[state.project];}
function nodeById(id){return curProj().nodes.find(n=>n.id===id);}
function curData(){return CHART_DATA.live;}
function hasResults(){return !!CHART_DATA.live;}

/* ============================= persistence ============================== */
const LSK="relay.state.v3";
function loadPersist(){
  // clone base
  state.projects={};
  PROJECT_ORDER=["ndm1"];
  for(const id of PROJECT_ORDER) state.projects[id]=JSON.parse(JSON.stringify(BASE[id]));
  let p=null;
  try{ p=JSON.parse(localStorage.getItem(LSK)||"null"); }catch(e){ p=null; }
  if(p){
    // "live" belongs to a run that is over; a reload has no measured data to show.
    if(p.theme) state.theme=p.theme;
    if(typeof p.editing==="boolean") state.editing=p.editing;
    if(typeof p.question==="string") state.question=p.question;
    if(p.opts) state.opts=Object.assign(state.opts,p.opts);
    if(p.project && state.projects[p.project]) state.project=p.project;
    if(p.view) state.view=p.view;
    if(p.previews) state.previews=p.previews;
    if(p.pos){
      for(const pid in p.pos){ if(!state.projects[pid])continue;
        for(const n of state.projects[pid].nodes){ const o=p.pos[pid][n.id]; if(o){n.x=o.x;n.y=o.y;} }
      }
    }
    // Projects the user made are stored whole, since there is no base to diff.
    if(p.userProjects){
      for(const up of p.userProjects){ state.projects[up.id]=up; if(!PROJECT_ORDER.includes(up.id)) PROJECT_ORDER.push(up.id); }
    }
    if(Array.isArray(p.deletedProjects)){
      for(const id of p.deletedProjects){ delete state.projects[id]; PROJECT_ORDER=PROJECT_ORDER.filter(x=>x!==id); }
      state.deletedProjects=p.deletedProjects.slice();
    }
    if(!state.projects[state.project]) state.project=PROJECT_ORDER[0];
    if(p.extraNodes){ for(const pid in p.extraNodes){ if(state.projects[pid]) state.projects[pid].nodes.push(...p.extraNodes[pid]); } }
    if(p.extraEdges){ for(const pid in p.extraEdges){ if(state.projects[pid]) state.projects[pid].edges.push(...p.extraEdges[pid]); } }
  }
}
let saveT=null;
function savePersist(){
  if(saveT) clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{
      const pos={}, extraNodes={}, extraEdges={};
      for(const pid in state.projects){
        pos[pid]={};
        const base=BASE[pid];
        const baseIds=base?new Set(base.nodes.map(n=>n.id)):new Set();
        for(const n of state.projects[pid].nodes){
          pos[pid][n.id]={x:Math.round(n.x),y:Math.round(n.y)};
          if(!baseIds.has(n.id)){ (extraNodes[pid]=extraNodes[pid]||[]).push(n); }
        }
        if(base){
          const baseEdgeKeys=new Set(base.edges.map(e=>e.from+">"+e.to));
          for(const e of state.projects[pid].edges){ if(!baseEdgeKeys.has(e.from+">"+e.to)) (extraEdges[pid]=extraEdges[pid]||[]).push(e); }
        }
      }
      const payload={
        theme:state.theme,project:state.project,editing:state.editing,
        question:state.question,opts:state.opts,
        userProjects:PROJECT_ORDER.filter(id=>!BASE[id]).map(id=>state.projects[id]).filter(Boolean),
        deletedProjects:state.deletedProjects||[],
        view:state.view,previews:state.previews,pos,extraNodes,extraEdges
      };
      localStorage.setItem(LSK,JSON.stringify(payload));
      syncUp(payload);
    }catch(e){/* storage may be unavailable; ignore */}
  },260);
}

/* ============================== elements =============================== */
const el={
  app:$("#app"), canvas:$("#canvas"), world:$("#world"), edges:$("#edges"),
  nodes:$("#nodes"), previews:$("#previews"), pane:$("#pane"), paneBody:$("#paneBody"),
  divider:$("#divider"), projectList:$("#projectList"), zoomLabel:$("#zoomLabel"),
  minimapSvg:$("#minimapSvg"), crumbProject:$("#crumbProject"), crumbRun:$("#crumbRun"),
  provenance:$("#provenance"), provText:$("#provText"), provTextLong:$("#provTextLong"),
  runbar:$("#runbar"), runTxt:$("#runTxt"), runSub:$("#runSub"), cmdCtx:$("#cmdCtx"),
  canvasHint:$("#canvasHint"), modalRoot:$("#modalRoot"), toastWrap:$("#toastWrap")
};

/* =============================== theme ================================= */
function applyTheme(){
  if(state.theme) document.documentElement.setAttribute("data-theme",state.theme);
  else document.documentElement.removeAttribute("data-theme");
}
$("#themeToggle").addEventListener("click",()=>{
  const dark = state.theme ? state.theme==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  state.theme = dark ? "light" : "dark";
  applyTheme(); savePersist();
  // charts use CSS vars, re-render open surfaces to pick fresh colours if needed
  renderEdges(); renderMinimap();
});

/* ============================ view transform =========================== */
function view(){ return state.view[state.project] || (state.view[state.project]={tx:0,ty:0,scale:1}); }
function applyTransform(smooth){
  const v=view();
  el.world.style.transition = smooth && !reduceMotion ? "transform .34s cubic-bezier(.2,.8,.3,1)" : "none";
  el.world.style.transform=`translate(${v.tx}px,${v.ty}px) scale(${v.scale})`;
  el.zoomLabel.textContent=Math.round(v.scale*100)+"%";
  scheduleMinimap();
}
function screenToWorld(sx,sy){ const v=view(); return {x:(sx-v.tx)/v.scale, y:(sy-v.ty)/v.scale}; }
function canvasRect(){ return el.canvas.getBoundingClientRect(); }

let zoomSettle=null;
function zoomBy(factor,cx,cy){
  // Mark the gesture so the compositor can cheat, then clear it so the
  // layer re-rasterises crisply at the final scale.
  el.canvas.classList.add("zooming");
  clearTimeout(zoomSettle); zoomSettle=setTimeout(()=>el.canvas.classList.remove("zooming"),220);
  const v=view(); const ns=clamp(v.scale*factor,0.3,2.2);
  const r=canvasRect(); if(cx==null){cx=r.width/2;} if(cy==null){cy=r.height/2;}
  const wx=(cx-v.tx)/v.scale, wy=(cy-v.ty)/v.scale;
  v.scale=ns; v.tx=cx-wx*ns; v.ty=cy-wy*ns;
  applyTransform(true); savePersist();
}
function nodeBox(n){ const e=nodeEls[n.id]; const h=e?e.offsetHeight:92; return {x:n.x,y:n.y,w:NODE_W,h}; }
function graphBBox(){
  const ns=curProj().nodes; if(!ns.length) return {x:0,y:0,w:100,h:100};
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const n of ns){ const b=nodeBox(n); minx=Math.min(minx,b.x);miny=Math.min(miny,b.y);maxx=Math.max(maxx,b.x+b.w);maxy=Math.max(maxy,b.y+b.h); }
  // include open previews
  const pv=state.previews[state.project]||{};
  for(const id in pv){ const p=pv[id]; if(p&&p.open){ minx=Math.min(minx,p.x);miny=Math.min(miny,p.y);maxx=Math.max(maxx,p.x+(p.w||360));maxy=Math.max(maxy,p.y+(p.h||300)); } }
  return {x:minx,y:miny,w:maxx-minx,h:maxy-miny};
}
function fit(smooth){
  const b=graphBBox(); const r=canvasRect(); const pad=70;
  const sx=(r.width-pad*2)/b.w, sy=(r.height-pad*2)/b.h;
  const v=view(); v.scale=clamp(Math.min(sx,sy),0.3,1.15);
  v.tx=(r.width-b.w*v.scale)/2 - b.x*v.scale;
  v.ty=(r.height-b.h*v.scale)/2 - b.y*v.scale;
  applyTransform(smooth!==false); savePersist();
}

/* ============================ render: graph ============================ */
let nodeEls={};
/* A card used to say the same thing three times: a coloured dot, a type tag,
   and a title that just repeated the type ("QUESTION / Research question").
   The tag carries the type, so a generic title is dropped and the substance
   is promoted into its place.

   Summaries are derived, never written by hand. One node claimed "8 sources"
   while holding a single record — a card must not be able to contradict the
   data behind it. */
const GENERIC_TITLE=/^(research\s+)?(question|evidence|sources?|hypothesis|experiment|results?|next experiment|note)s?$/i;
function nodeSubtitle(n){
  if(n.type==="source"){
    const src=(n.meta&&n.meta.sources)||[];
    if(src.length===1) return src[0].meta ? `${src[0].src} · ${src[0].meta}` : src[0].src;
    if(src.length>1)   return `${src.length} sources · ${src[0].src} and ${src.length-1} more`;
  }
  return n.summary||"";
}
function nodeHeading(n){
  const t=(n.title||"").trim(), sub=nodeSubtitle(n);
  if(n.type==="source"){
    const src=(n.meta&&n.meta.sources)||[];
    if(src.length===1) return {title:src[0].src, sub:src[0].meta||""};
    if(src.length>1)   return {title:`${src.length} sources`, sub:`${src[0].src} and ${src.length-1} more`};
  }
  if(GENERIC_TITLE.test(t) && sub) return {title:sub, sub:""};
  return {title:t, sub};
}
function statusChipHTML(st){const s=STATUS[st]||STATUS.planned;return `<span class="status-chip" data-st="${st}"><span class="glyph">${s.g}</span>${s.l}</span>`;}
function renderGraph(){
  const p=curProj();
  // nodes
  el.nodes.innerHTML=""; nodeEls={};
  for(const n of p.nodes){
    const d=document.createElement("div");
    d.className="node"; d.dataset.id=n.id; d.dataset.type=n.type;
    // Generated by a run, or added by hand: styled differently so the record
    // and the user's own annotations are never mistaken for each other.
    d.dataset.origin = n.origin==="user" ? "user" : "generated";
    d.style.left=n.x+"px"; d.style.top=n.y+"px";
    d.tabIndex=0; d.setAttribute("role","button");
    d.setAttribute("aria-label",`${TYPE_LABEL[n.type]}: ${nodeHeading(n).title}`);
    const showPreview = n.type==="result";
    d.innerHTML=`
      <div class="node-head">
        <span class="node-dot"></span>
        <span class="node-type-tag">${esc(TYPE_LABEL[n.type])}</span>
      </div>
      ${(()=>{const h=nodeHeading(n);return `<div class="node-title">${esc(h.title)}</div>`+
        (h.sub?`<div class="node-sum">${esc(h.sub)}</div>`:"");})()}
      ${state.editing?`<span class="port" title="Drag onto another node to connect"></span>`:""}
      <div class="node-foot">
        ${statusChipHTML(n.status)}
        ${showPreview?`<button class="link-btn" data-act="preview">Preview</button>`:""}
      </div>`;
    el.nodes.appendChild(d); nodeEls[n.id]=d;
    if(n.id===state.selection) d.classList.add("selected");
    wireNode(d,n);
  }
  renderPreviews();
  // edges after layout settles (measure heights)
  requestAnimationFrame(renderEdges);
}

/* edges */
function edgePath(a,b){
  const ab=nodeBox(a), bb=nodeBox(b);
  const x1=ab.x+ab.w, y1=ab.y+ab.h/2, x2=bb.x, y2=bb.y+bb.h/2;
  const dx=Math.max(38,Math.abs(x2-x1)*0.5);
  return {d:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`,mx:(x1+x2)/2,my:(y1+y2)/2};
}
function renderEdges(){
  const p=curProj(); const sel=state.selection;
  const bb=graphBBox();
  el.edges.setAttribute("viewBox",`${bb.x-40} ${bb.y-40} ${bb.w+80} ${bb.h+80}`);
  el.edges.setAttribute("width",bb.w+80); el.edges.setAttribute("height",bb.h+80);
  el.edges.style.left=(bb.x-40)+"px"; el.edges.style.top=(bb.y-40)+"px";
  el.edges.style.width=(bb.w+80)+"px"; el.edges.style.height=(bb.h+80)+"px";
  let g="";
  for(const e of p.edges){
    const a=nodeById(e.from), b=nodeById(e.to); if(!a||!b)continue;
    const pp=edgePath(a,b);
    const active = sel && (e.from===sel||e.to===sel);
    const cls="edge-path "+(active?"active ":"")+(e.rel==="contradicts"?"contradicts":"");
    const lab=REL_LABEL[e.rel]||e.rel;
    const lw=lab.length*6.4+12;
    g+=`<g class="edge-g${active?" show":""}" data-from="${e.from}" data-to="${e.to}">
      <path class="edge-hit" d="${pp.d}"></path>
      <path class="${cls}" d="${pp.d}"></path>
      <rect class="edge-label-bg" x="${pp.mx-lw/2}" y="${pp.my-9}" width="${lw}" height="16" rx="8"></rect>
      <text class="edge-label ${e.rel}" x="${pp.mx}" y="${pp.my+3}" text-anchor="middle">${esc(lab)}</text>
    </g>`;
  }
  el.edges.innerHTML=g;
  // hover to reveal labels
  $$(".edge-g",el.edges).forEach(grp=>{
    grp.querySelector(".edge-hit").addEventListener("mouseenter",()=>grp.classList.add("show"));
    grp.querySelector(".edge-hit").addEventListener("mouseleave",()=>{ const sel=state.selection; const act=sel&&(grp.dataset.from===sel||grp.dataset.to===sel); if(!act)grp.classList.remove("show"); });
    grp.addEventListener("contextmenu",ev=>{
      const e=curProj().edges.find(x=>x.from===grp.dataset.from&&x.to===grp.dataset.to);
      if(e) edgeContextMenu(ev,e);
    });
  });
  scheduleMinimap();
}

/* ======================== node interactions =========================== */
/* Two modes, because the two jobs want opposite things.
   Locked (the default) is for reading and running: positions are derived by
   layoutGraph, nothing moves, nothing can be rewired by accident.
   Editing is for arranging: nodes drag, and a port on each node's right edge
   lets you connect it somewhere else. Locking keeps whatever you arranged
   rather than snapping it back. */
function setEditing(on){
  state.editing=!!on;
  el.app.classList.toggle("editing",state.editing);
  const b=$("#editBtn"); b.setAttribute("aria-pressed",String(state.editing));
  b.classList.toggle("on",state.editing);
  $("#editBtnLabel").textContent=state.editing?"Lock":"Edit";
  b.title=state.editing?"Lock the diagram (E)":"Edit the diagram (E)";
  renderGraph(); savePersist();
  toast(state.editing
    ? "Editing — drag nodes, or drag a node's right edge onto another to connect them"
    : "Locked — the diagram is fixed");
}

function wireNode(d,n){
  let start=null,dragging=false;
  d.addEventListener("pointerdown",ev=>{
    if(ev.button!==0) return;
    const onLink=ev.target.closest("[data-act]");
    if(onLink){ ev.stopPropagation(); if(onLink.dataset.act==="preview"){ togglePreview(n.id,true); } return; }
    if(ev.target.closest(".port")){ beginLink(ev,n); return; }
    ev.stopPropagation();          // don't start a canvas pan from the node
    if(state.editing){
      start={x:ev.clientX,y:ev.clientY,nx:n.x,ny:n.y}; dragging=false;
      try{ d.setPointerCapture(ev.pointerId); }catch(e){}   // no capture for synthetic pointers
    } else {
      selectNode(n.id);
    }
  });
  d.addEventListener("pointermove",ev=>{
    if(!start) return;
    const dx=ev.clientX-start.x, dy=ev.clientY-start.y;
    if(!dragging && Math.hypot(dx,dy)>4){ dragging=true; d.classList.add("dragging"); }
    if(dragging){
      const v=view();
      n.x=Math.round(start.nx+dx/v.scale); n.y=Math.round(start.ny+dy/v.scale);
      d.style.left=n.x+"px"; d.style.top=n.y+"px";
      renderEdges();
    }
  });
  d.addEventListener("pointerup",ev=>{
    if(!start) return;
    try{d.releasePointerCapture(ev.pointerId);}catch(e){}
    if(dragging){ d.classList.remove("dragging"); savePersist(); }
    else selectNode(n.id);
    start=null; dragging=false;
  });
  d.addEventListener("contextmenu",ev=>nodeContextMenu(ev,n));
  d.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); selectNode(n.id); }
    else if(ev.key==="Delete"||ev.key==="Backspace"){ ev.preventDefault(); deleteNode(n.id); }
    // Keyboard equivalent of the context menu.
    else if(ev.key==="ContextMenu"||(ev.shiftKey&&ev.key==="F10")){
      const r=d.getBoundingClientRect();
      nodeContextMenu(Object.assign(ev,{clientX:r.left+24,clientY:r.top+24}),n);
    }
  });
}

/* ========================= canvas pan / zoom ========================== */
(function(){
  let panning=false,start=null;
  el.canvas.addEventListener("pointerdown",ev=>{
    if(ev.button!==0) return;
    if(ev.target.closest(".node")||ev.target.closest(".preview")||ev.target.closest(".overlay")||ev.target.closest(".runbar")) return;
    panning=true; const v=view(); start={x:ev.clientX,y:ev.clientY,tx:v.tx,ty:v.ty};
    el.canvas.classList.add("panning"); el.canvas.setPointerCapture(ev.pointerId);
    if(state.selection && ev.target===el.canvas){ /* clear on background click handled at pointerup if no move */ }
    start.moved=false;
  });
  el.canvas.addEventListener("pointermove",ev=>{
    if(!panning) return; const v=view();
    const dx=ev.clientX-start.x, dy=ev.clientY-start.y;
    if(Math.hypot(dx,dy)>3) start.moved=true;
    v.tx=start.tx+dx; v.ty=start.ty+dy; applyTransform(false);
  });
  el.canvas.addEventListener("pointerup",ev=>{
    if(!panning) return; panning=false; el.canvas.classList.remove("panning");
    try{el.canvas.releasePointerCapture(ev.pointerId);}catch(e){}
    if(!start.moved){ // background click clears selection (keeps pane work; closes pane)
      if(state.selection){ clearSelection(); }
    }
    savePersist();
  });
  el.canvas.addEventListener("wheel",ev=>{
    ev.preventDefault();
    const r=canvasRect();
    if(ev.ctrlKey){ zoomBy(ev.deltaY<0?1.08:0.925, ev.clientX-r.left, ev.clientY-r.top); }
    else{ const v=view(); v.tx-=ev.deltaX; v.ty-=ev.deltaY; applyTransform(false); savePersist(); }
  },{passive:false});
})();
$("#zoomIn").addEventListener("click",()=>zoomBy(1.18));
$("#zoomOut").addEventListener("click",()=>zoomBy(1/1.18));
$("#fitBtn").addEventListener("click",()=>fit(true));
$("#tidyBtn").addEventListener("click",()=>tidy());
$("#editBtn").addEventListener("click",()=>setEditing(!state.editing));
el.canvas.addEventListener("contextmenu",canvasContextMenu);

/* ============================== minimap =============================== */
/* Keep the bottom overlays from colliding. The minimap is the first thing to
   go when the canvas gets narrow, because the command bar has to stay usable. */
function layoutOverlays(){
  const z=document.querySelector(".zoomctl"), mm=document.querySelector(".minimap");
  const w=el.canvas.clientWidth;
  if(mm) mm.hidden = w < 880;
  el.canvas.style.setProperty("--bl",(z?z.offsetWidth:0)+"px");
  el.canvas.style.setProperty("--br",(mm&&!mm.hidden?mm.offsetWidth:0)+"px");
}
addEventListener("resize",layoutOverlays);
new ResizeObserver(layoutOverlays).observe(el.canvas);

let mmT=null; function scheduleMinimap(){ if(mmT)cancelAnimationFrame(mmT); mmT=requestAnimationFrame(renderMinimap); }
function renderMinimap(){
  const b=graphBBox(); const pad=40;
  const bx=b.x-pad,by=b.y-pad,bw=b.w+pad*2,bh=b.h+pad*2;
  const VW=188,VH=120; const s=Math.min(VW/bw,VH/bh);
  const ox=(VW-bw*s)/2, oy=(VH-bh*s)/2;
  const mx=v=>ox+(v-bx)*s, my=v=>oy+(v-by)*s;
  let g="";
  for(const n of curProj().nodes){ const box=nodeBox(n);
    g+=`<rect class="mm-node${n.id===state.selection?" sel":""}" x="${mx(box.x)}" y="${my(box.y)}" width="${box.w*s}" height="${box.h*s}" rx="2"/>`;
  }
  // viewport rect in world coords
  const v=view(); const r=canvasRect();
  const wx=(-v.tx)/v.scale, wy=(-v.ty)/v.scale, ww=r.width/v.scale, wh=r.height/v.scale;
  g+=`<rect class="mm-view" x="${mx(wx)}" y="${my(wy)}" width="${ww*s}" height="${wh*s}" rx="2"/>`;
  el.minimapSvg.innerHTML=g;
}
el.minimapSvg.addEventListener("pointerdown",ev=>{
  const b=graphBBox(); const pad=40; const bx=b.x-pad,by=b.y-pad,bw=b.w+pad*2,bh=b.h+pad*2;
  const VW=188,VH=120; const s=Math.min(VW/bw,VH/bh); const ox=(VW-bw*s)/2, oy=(VH-bh*s)/2;
  const rect=el.minimapSvg.getBoundingClientRect();
  const px=(ev.clientX-rect.left)/rect.width*VW, py=(ev.clientY-rect.top)/rect.height*VH;
  const wx=bx+(px-ox)/s, wy=by+(py-oy)/s;
  const v=view(); const r=canvasRect(); v.tx=r.width/2-wx*v.scale; v.ty=r.height/2-wy*v.scale;
  applyTransform(true); savePersist();
});

/* =========================== selection / pane ========================= */
function selectNode(id){
  state.selection=id;
  $$(".node",el.nodes).forEach(d=>d.classList.toggle("selected",d.dataset.id===id));
  renderEdges(); renderMinimap(); renderCmdCtx();
  openPane(id);
}
function clearSelection(){
  state.selection=null;
  $$(".node",el.nodes).forEach(d=>d.classList.remove("selected"));
  renderEdges(); renderMinimap(); renderCmdCtx();
  closePane();
}
function openPane(id){
  const n=nodeById(id); if(!n) return;
  state.pane.open=true;
  el.pane.hidden=false; el.divider.hidden=false; el.app.classList.add("pane-open");
  if(state.pane.widthPx){ el.pane.style.width=state.pane.widthPx+"px"; }
  renderPaneHeader(n); renderPaneBody(n);
  revealNode(id);
}
function closePane(silent){
  state.pane.open=false; state.pane.maximized=false;
  el.pane.hidden=true; el.divider.hidden=true; el.pane.classList.remove("maximized");
  el.canvas.style.display=""; el.app.classList.remove("pane-open","pane-max");
  if(!silent && state.selection){ /* keep selection highlight? brief: close returns focus to selected node */ }
}
function revealNode(id){
  // gently pan so the selected node sits in the visible (left) portion if the pane covers it
  const n=nodeById(id); const d=nodeEls[id]; if(!n||!d) return;
  const v=view(); const r=canvasRect();
  const sx=n.x*v.scale+v.tx, sy=n.y*v.scale+v.ty;       // node screen pos (relative to canvas area)
  const nw=NODE_W*v.scale, nh=d.offsetHeight*v.scale;
  const margin=40;
  let ntx=v.tx, nty=v.ty, need=false;
  if(sx<margin){ ntx=v.tx+(margin-sx); need=true; }
  else if(sx+nw>r.width-margin){ ntx=v.tx-((sx+nw)-(r.width-margin)); need=true; }
  if(sy<margin){ nty=v.ty+(margin-sy); need=true; }
  else if(sy+nh>r.height-margin){ nty=v.ty-((sy+nh)-(r.height-margin)); need=true; }
  if(need){ v.tx=ntx; v.ty=nty; applyTransform(true); savePersist(); }
}
$("#paneClose").addEventListener("click",()=>{ const s=state.selection; closePane(); if(s&&nodeEls[s])nodeEls[s].focus(); });
$("#paneDelete").addEventListener("click",()=>{ if(state.selection) deleteNode(state.selection); });
$("#paneMax").addEventListener("click",toggleMax);

/* divider drag */
(function(){
  let drag=false;
  el.divider.addEventListener("pointerdown",ev=>{ drag=true; el.divider.classList.add("dragging"); el.divider.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  el.divider.addEventListener("pointermove",ev=>{

    ev.preventDefault(); state.pane.widthPx=w; el.pane.style.width=w+"px"; savePersist();

})();

/* Evidence shown here is read off the graph, not retyped beside it. A
   hypothesis used to list "supporting evidence" as prose while the edge that
   actually linked it said something else — and one line claimed 12 sources
   next to a node holding 3. Whatever the edges say is what you see. */
function linkedEvidence(n,rels){
  return curProj().edges
    .filter(e=>e.to===n.id&&rels.includes(e.rel))
    .map(e=>({node:nodeById(e.from),rel:e.rel}))
    .filter(x=>x.node);
}

  return items.map(({node,rel})=>
    `<li class="${cls}"><button class="link-node" data-goto="${node.id}">${esc(nodeHeading(node).title)}</button>`
    + `<span class="rel-tag ${rel}">${esc(REL_LABEL[rel]||rel)}</span></li>`).join("");
}

  const caveats=(m.contradict||[]).map(p=>`<li class="neg">${esc(p)}</li>`).join("");

function paneNext(n){const m=n.meta;

/* chart block = serif title + svg + legend */

/* ============================== charts ================================ */
function niceNum(v){ return (Math.round(v*100)/100).toString(); }
function lineChartSVG(c){
  const W=440,H=236, ml=46,mr=16,mt=12,mb=40; const pw=W-ml-mr, ph=H-mt-mb;
  const X=v=>ml+(v/c.xmax)*pw, Y=v=>mt+ph-(v/c.ymax)*ph;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  // grid + y ticks
  for(const t of c.yticks){ const y=Y(t); g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}"/><text class="tick-lab" x="${ml-8}" y="${y+3}" text-anchor="end">${t}</text>`; }
  for(const t of c.xticks){ const x=X(t); g+=`<text class="tick-lab" x="${x}" y="${H-mb+16}" text-anchor="middle">${t}</text>`; }
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  // confidence band
  let up="",dn="";
  for(let i=0;i<c.x.length;i++){ up+=`${i?"L":"M"}${X(c.x[i])},${Y(Math.min(c.ymax,c.proposed[i]+c.band[i]))} `; }
  for(let i=c.x.length-1;i>=0;i--){ dn+=`L${X(c.x[i])},${Y(Math.max(0,c.proposed[i]-c.band[i]))} `; }
  g+=`<path d="${up}${dn}Z" fill="var(--series-1-band)" stroke="none"/>`;
  // baseline series
  g+=`<path d="${c.x.map((xv,i)=>`${i?"L":"M"}${X(xv)},${Y(c.baseline[i])}`).join(" ")}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-line="baseline"/>`;
  c.x.forEach((xv,i)=>{ g+=`<circle cx="${X(xv)}" cy="${Y(c.baseline[i])}" r="3" fill="var(--series-2)" data-line="baseline"/>`; });
  // proposed series
  g+=`<path d="${c.x.map((xv,i)=>`${i?"L":"M"}${X(xv)},${Y(c.proposed[i])}`).join(" ")}" fill="none" stroke="var(--series-1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-line="proposed"/>`;
  c.x.forEach((xv,i)=>{ g+=`<circle class="data-point" cx="${X(xv)}" cy="${Y(c.proposed[i])}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="1.5" data-px="${xv}" data-py="${c.proposed[i]}"><title>${xv}% → ${niceNum(c.proposed[i])}× enrichment</title></circle>`; });
  // axis titles
  g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-4}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  g+=`<text class="axis-title" transform="translate(13,${mt+ph/2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;
  g+=`</svg>`;
  return g;
}
function barChartSVG(c){
  const rows=c.rows; const rowH=34, top=10, ml=58, mr=22, bottom=26;
  const W=440, pw=W-ml-mr, H=top+rows.length*rowH+bottom;
  const X=v=>ml+(v/c.xmax)*pw;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  for(const t of c.xticks){ const x=X(t); g+=`<line class="grid-line" x1="${x}" y1="${top}" x2="${x}" y2="${top+rows.length*rowH}"/><text class="tick-lab" x="${x}" y="${H-8}" text-anchor="middle">${t}</text>`; }
  rows.forEach((r,i)=>{
    const cy=top+i*rowH+rowH/2; const bw=X(r.score)-ml; const sel=(r.id===state.selCandidate);
    g+=`<g class="bar-row${sel?" sel":""}" data-cand="${esc(r.id)}" style="cursor:pointer">`;
    g+=`<rect x="0" y="${cy-rowH/2}" width="${W}" height="${rowH}" fill="transparent"/>`;
    g+=`<text class="tick-lab" x="${ml-10}" y="${cy+3}" text-anchor="end" style="font-weight:600;fill:var(--ink-2)">${esc(r.id)}</text>`;
    g+=`<rect class="bar-fill" x="${ml}" y="${cy-7}" width="${Math.max(2,bw)}" height="14" rx="4" fill="var(--series-1)"/>`;
    // error bar
    const ex1=X(Math.max(0,r.score-r.err)), ex2=X(Math.min(c.xmax,r.score+r.err));
    g+=`<line x1="${ex1}" y1="${cy}" x2="${ex2}" y2="${cy}" stroke="var(--chart-axis)" stroke-width="1.4"/><line x1="${ex1}" y1="${cy-4}" x2="${ex1}" y2="${cy+4}" stroke="var(--chart-axis)" stroke-width="1.4"/><line x1="${ex2}" y1="${cy-4}" x2="${ex2}" y2="${cy+4}" stroke="var(--chart-axis)" stroke-width="1.4"/>`;
    const labX=Math.min(W-4, Math.max(X(r.score)+10, ex2+9));
    g+=`<text class="tick-lab" x="${labX}" y="${cy+3}" style="fill:var(--ink-2);font-weight:700">${niceNum(r.score)}</text>`;
    g+=`<title>${esc(r.id)} — predicted ${niceNum(r.score)}${c.family&&r.family?" · "+esc(r.family):""}</title></g>`;
  });
  g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-8}" text-anchor="middle" dy="14"></text>`;
  g+=`</svg>`;
  return g;
}
function candidateTable(d){
  const c=d.candidates;
  return `<div class="section"><h3>Candidate ranking</h3><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Rank</th><th>Candidate</th><th class="num">Predicted score</th><th class="num">± unc.</th>${c.family?"<th>Chemotype family</th>":""}</tr></thead><tbody>
  ${c.rows.map((r,i)=>`<tr data-cand="${esc(r.id)}" class="${r.id===state.selCandidate?"sel":""}"><td class="num">${i+1}</td><td style="font-weight:600">${esc(r.id)}</td><td class="num">${niceNum(r.score)}</td><td class="num">${niceNum(r.err)}</td>${c.family?`<td>${esc(r.family)}</td>`:""}</tr>`).join("")}
  </tbody></table></div></div>`;
}
function enrichmentTable(d){
  const c=d.enrichment;
  return `<div class="section"><h3>${esc(c.title)}</h3><div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="num">${esc(c.xlabel)}</th><th class="num">Proposed (×)</th><th class="num">Baseline (×)</th></tr></thead><tbody>
  ${c.x.map((xv,i)=>`<tr><td class="num">${xv}</td><td class="num">${niceNum(c.proposed[i])}</td><td class="num">${niceNum(c.baseline[i])}</td></tr>`).join("")}
