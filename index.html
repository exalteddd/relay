/* ============================== charts ================================ */
function niceNum(v){ return (Math.round(v*100)/100).toString(); }
function lineChartSVG(c){
  const W=440,H=236, ml=46,mr=16,mt=12,mb=40; const pw=W-ml-mr, ph=H-mt-mb;
  const X=v=>ml+(v/c.xmax)*pw, Y=v=>mt+ph-(v/c.ymax)*ph;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  // grid + y ticks
  for(const t of c.yticks){ const y=Y(t); g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}"/><text class="tick-lab" x="${ml-8}" y="${y+3}" text-anchor="end">${t}</text>`; }
  for(const t of c.xticks){ const x=X(t); g+=`<text class="tick-lab" x="${x}" y="${H-mb+16}" text-anchor="middle">${t}</text>`; }
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  // confidence band
  let up="",dn="";
  for(let i=0;i<c.x.length;i++){ up+=`${i?"L":"M"}${X(c.x[i])},${Y(Math.min(c.ymax,c.proposed[i]+c.band[i]))} `; }
  for(let i=c.x.length-1;i>=0;i--){ dn+=`L${X(c.x[i])},${Y(Math.max(0,c.proposed[i]-c.band[i]))} `; }
  g+=`<path d="${up}${dn}Z" fill="var(--series-1-band)" stroke="none"/>`;
  // baseline series
  g+=`<path d="${c.x.map((xv,i)=>`${i?"L":"M"}${X(xv)},${Y(c.baseline[i])}`).join(" ")}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-line="baseline"/>`;
  c.x.forEach((xv,i)=>{ g+=`<circle cx="${X(xv)}" cy="${Y(c.baseline[i])}" r="3" fill="var(--series-2)" data-line="baseline"/>`; });
  // proposed series
  g+=`<path d="${c.x.map((xv,i)=>`${i?"L":"M"}${X(xv)},${Y(c.proposed[i])}`).join(" ")}" fill="none" stroke="var(--series-1)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" data-line="proposed"/>`;
  c.x.forEach((xv,i)=>{ g+=`<circle class="data-point" cx="${X(xv)}" cy="${Y(c.proposed[i])}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="1.5" data-px="${xv}" data-py="${c.proposed[i]}"><title>${xv}% → ${niceNum(c.proposed[i])}× enrichment</title></circle>`; });
  // axis titles
  g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-4}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  g+=`<text class="axis-title" transform="translate(13,${mt+ph/2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;
  g+=`</svg>`;
  return g;
}
function barChartSVG(c){
  const rows=c.rows; const rowH=34, top=10, ml=58, mr=22, bottom=26;
  const W=440, pw=W-ml-mr, H=top+rows.length*rowH+bottom;
  const X=v=>ml+(v/c.xmax)*pw;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  for(const t of c.xticks){ const x=X(t); g+=`<line class="grid-line" x1="${x}" y1="${top}" x2="${x}" y2="${top+rows.length*rowH}"/><text class="tick-lab" x="${x}" y="${H-8}" text-anchor="middle">${t}</text>`; }
  rows.forEach((r,i)=>{
    const cy=top+i*rowH+rowH/2; const bw=X(r.score)-ml; const sel=(r.id===state.selCandidate);
    g+=`<g class="bar-row${sel?" sel":""}" data-cand="${esc(r.id)}" style="cursor:pointer">`;
    g+=`<rect x="0" y="${cy-rowH/2}" width="${W}" height="${rowH}" fill="transparent"/>`;
    g+=`<text class="tick-lab" x="${ml-10}" y="${cy+3}" text-anchor="end" style="font-weight:600;fill:var(--ink-2)">${esc(r.id)}</text>`;
    g+=`<rect class="bar-fill" x="${ml}" y="${cy-7}" width="${Math.max(2,bw)}" height="14" rx="4" fill="var(--series-1)"/>`;
    // error bar
    const ex1=X(Math.max(0,r.score-r.err)), ex2=X(Math.min(c.xmax,r.score+r.err));
    g+=`<line x1="${ex1}" y1="${cy}" x2="${ex2}" y2="${cy}" stroke="var(--chart-axis)" stroke-width="1.4"/><line x1="${ex1}" y1="${cy-4}" x2="${ex1}" y2="${cy+4}" stroke="var(--chart-axis)" stroke-width="1.4"/><line x1="${ex2}" y1="${cy-4}" x2="${ex2}" y2="${cy+4}" stroke="var(--chart-axis)" stroke-width="1.4"/>`;
    const labX=Math.min(W-4, Math.max(X(r.score)+10, ex2+9));
    g+=`<text class="tick-lab" x="${labX}" y="${cy+3}" style="fill:var(--ink-2);font-weight:700">${niceNum(r.score)}</text>`;
    g+=`<title>${esc(r.id)} — predicted ${niceNum(r.score)}${c.family&&r.family?" · "+esc(r.family):""}</title></g>`;
  });
  g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-8}" text-anchor="middle" dy="14"></text>`;
  g+=`</svg>`;
  return g;
}
/* ======================= report figure library =========================
   Figures for the exported paper. Each takes a plain data object and returns
   inline SVG, so they print as vector and survive a PDF at any zoom. They are
   deliberately separate from the canvas charts above: a figure in a paper
   needs a legend, axis titles, gridlines and readable ticks, where a preview
   card on the canvas does not.

   Every renderer draws only what it is given. None of them synthesise a
   trend, extend a series, or fill a gap -- an absent series is simply not
   drawn, and `figureSVG` says so rather than inventing a shape. */
const SERIES_VARS=["--series-1","--series-3","--series-5","--series-6","--series-4","--series-2"];
function seriesColor(s,i){ return s.color||SERIES_VARS[i%SERIES_VARS.length]; }

function figLegend(series){
  return `<div class="fig-legend">${series.map((s,i)=>
    `<span class="lg-item"><span class="lg-sw" style="background:var(${seriesColor(s,i)})"></span>${esc(s.name)}</span>`).join("")}</div>`;
}
function niceTicks(max,n){
  const step=max/n, out=[];
  for(let i=0;i<=n;i++) out.push(Math.round(step*i*100)/100);
  return out;
}

/* --- multi-series area + line, gradient filled -------------------------
   For a quantity tracked across an ordered axis (screening depth, epochs,
   days). Mirrors the stacked-trend look while keeping each series readable. */
function areaChartSVG(c){
  const W=560,H=280, ml=52,mr=18,mt=16,mb=54; const pw=W-ml-mr, ph=H-mt-mb;
  const n=(c.x||[]).length; if(!n||!(c.series||[]).length) return "";
  const ymax=c.ymax||Math.max(...c.series.flatMap(s=>s.values))*1.12||1;
  const yticks=c.yticks||niceTicks(ymax,4);
  const X=i=>ml+(n===1?pw/2:(i/(n-1))*pw), Y=v=>mt+ph-(Math.max(0,Math.min(ymax,v))/ymax)*ph;
  const uid="ar"+Math.random().toString(36).slice(2,7);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"")}"><defs>`;
  c.series.forEach((s,i)=>{ const col=seriesColor(s,i);
    g+=`<linearGradient id="${uid}-${i}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(${col})" stop-opacity="0.42"/>
        <stop offset="100%" stop-color="var(${col})" stop-opacity="0.02"/></linearGradient>`; });
  g+=`</defs>`;
  for(const t of yticks){ const y=Y(t); g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke-dasharray="3 3"/><text class="tick-lab" x="${ml-8}" y="${y+3.5}" text-anchor="end">${t}</text>`; }
  // x labels are thinned so they never collide, however long the series is
  const every=Math.max(1,Math.ceil(n/9));
  (c.x||[]).forEach((lab,i)=>{ if(i%every) return;
    g+=`<text class="tick-lab" x="${X(i)}" y="${mt+ph+16}" text-anchor="middle">${esc(String(lab))}</text>`; });
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  c.series.forEach((s,i)=>{
    const col=seriesColor(s,i);
    const line=s.values.map((v,j)=>`${j?"L":"M"}${X(j)},${Y(v)}`).join(" ");
    g+=`<path d="${line} L${X(n-1)},${mt+ph} L${X(0)},${mt+ph} Z" fill="url(#${uid}-${i})" stroke="none"/>`;
    g+=`<path d="${line}" fill="none" stroke="var(${col})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(n<=32) s.values.forEach((v,j)=>{ g+=`<circle cx="${X(j)}" cy="${Y(v)}" r="2.6" fill="var(${col})"><title>${esc(s.name)} · ${esc(String(c.x[j]))}: ${niceNum(v)}</title></circle>`; });
  });
  if(c.xlabel) g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-20}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  if(c.ylabel) g+=`<text class="axis-title" transform="translate(14,${mt+ph/2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;
  return g+`</svg>`+figLegend(c.series);
}

/* --- grouped vertical bars --------------------------------------------
   Categories on x, one bar per series within each category. Used for
   per-stratum breakdowns, where a single bar would hide the comparison. */
function groupedBarSVG(c){
  const cats=c.categories||[], series=c.series||[];
  if(!cats.length||!series.length) return "";
  const W=560,H=280, ml=54,mr=18,mt=16,mb=54; const pw=W-ml-mr, ph=H-mt-mb;
  const ymax=c.ymax||Math.max(...series.flatMap(s=>s.values))*1.14||1;
  const yticks=c.yticks||niceTicks(ymax,4);
  const Y=v=>mt+ph-(Math.max(0,v)/ymax)*ph;
  const gw=pw/cats.length, bw=Math.min(26,(gw*0.68)/series.length);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"")}">`;
  for(const t of yticks){ const y=Y(t); g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke-dasharray="3 3"/><text class="tick-lab" x="${ml-8}" y="${y+3.5}" text-anchor="end">${t}</text>`; }
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  cats.forEach((cat,ci)=>{
    const gx=ml+ci*gw, mid=gx+gw/2;
    const total=series.length*bw+(series.length-1)*3;
    series.forEach((s,si)=>{
      const v=s.values[ci]; if(v==null) return;
      const x=mid-total/2+si*(bw+3), y=Y(v), h=mt+ph-y;
      g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="2.5" fill="var(${seriesColor(s,si)})"><title>${esc(s.name)} · ${esc(cat)}: ${niceNum(v)}</title></rect>`;
    });
    g+=`<text class="tick-lab" x="${mid}" y="${mt+ph+16}" text-anchor="middle">${esc(cat)}</text>`;
  });
  if(c.xlabel) g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-20}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  if(c.ylabel) g+=`<text class="axis-title" transform="translate(14,${mt+ph/2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;
  return g+`</svg>`+figLegend(series);
}

/* --- ROC curve ---------------------------------------------------------
   The chance diagonal is drawn explicitly: an ROC without it invites the
   reader to over-read a curve that may be barely above random. */
function rocCurveSVG(c){
  const pts=c.points||[]; if(pts.length<2) return "";
  const W=360,H=330, ml=50,mr=16,mt=16,mb=52; const pw=W-ml-mr, ph=H-mt-mb;
  const X=v=>ml+v*pw, Y=v=>mt+ph-v*ph;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"ROC curve")}">`;
  for(const t of [0,.25,.5,.75,1]){
    g+=`<line class="grid-line" x1="${ml}" y1="${Y(t)}" x2="${W-mr}" y2="${Y(t)}" stroke-dasharray="3 3"/>`;
    g+=`<text class="tick-lab" x="${ml-8}" y="${Y(t)+3.5}" text-anchor="end">${t}</text>`;
    g+=`<text class="tick-lab" x="${X(t)}" y="${mt+ph+16}" text-anchor="middle">${t}</text>`;
  }
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  g+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="var(--series-2)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  g+=`<text class="tick-lab" x="${X(.62)}" y="${Y(.52)}" transform="rotate(-45 ${X(.62)} ${Y(.52)})" style="fill:var(--ink-3)">chance (AUC 0.50)</text>`;
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(p[0])},${Y(p[1])}`).join(" ");
  g+=`<path d="${d} L${X(1)},${Y(0)} Z" fill="var(--series-1-band)" stroke="none"/>`;
  g+=`<path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2.6" stroke-linejoin="round"/>`;
  if(c.auc!=null) g+=`<text class="fig-title-svg" x="${X(.56)}" y="${Y(.22)}">AUC = ${Number(c.auc).toFixed(3)}</text>`;
  g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-18}" text-anchor="middle">False positive rate</text>`;
  g+=`<text class="axis-title" transform="translate(13,${mt+ph/2}) rotate(-90)" text-anchor="middle">True positive rate</text>`;
  return g+`</svg>`;
}

/* --- paired distribution ----------------------------------------------
   Two overlaid histograms. Separation between them is the visual form of
   what AUC states numerically, so the two belong next to each other. */
function distributionSVG(c){
  const bins=c.bins||[]; if(!bins.length) return "";
  const W=560,H=260, ml=52,mr=18,mt=16,mb=54; const pw=W-ml-mr, ph=H-mt-mb;
  const groups=c.groups||[];
  const ymax=c.ymax||Math.max(...groups.flatMap(gr=>gr.counts))*1.12||1;
  const Y=v=>mt+ph-(Math.max(0,v)/ymax)*ph, bw=pw/bins.length;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"")}">`;
  for(const t of niceTicks(ymax,4)){ const y=Y(t); g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke-dasharray="3 3"/><text class="tick-lab" x="${ml-8}" y="${y+3.5}" text-anchor="end">${t}</text>`; }
  g+=`<line class="axis-line" x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/><line class="axis-line" x1="${ml}" y1="${mt+ph}" x2="${W-mr}" y2="${mt+ph}"/>`;
  groups.forEach((gr,gi)=>{
    const col=seriesColor(gr,gi);
    gr.counts.forEach((v,i)=>{ if(v==null) return;
      const x=ml+i*bw, y=Y(v);
      g+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${Math.max(0,mt+ph-y)}" fill="var(${col})" opacity="${gi?0.55:0.78}"><title>${esc(gr.name)} · bin ${esc(String(bins[i]))}: ${v}</title></rect>`;
    });
  });
  const every=Math.max(1,Math.ceil(bins.length/8));
  bins.forEach((b,i)=>{ if(i%every) return; g+=`<text class="tick-lab" x="${ml+i*bw+bw/2}" y="${mt+ph+16}" text-anchor="middle">${esc(String(b))}</text>`; });
  if(c.xlabel) g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-18}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  if(c.ylabel) g+=`<text class="axis-title" transform="translate(14,${mt+ph/2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;
  return g+`</svg>`+figLegend(groups);
}

/* --- horizontal metric comparison with explicit null band --------------
   For method-vs-control comparisons. The shaded band marks "no better than
   chance", so a control sitting inside it reads as a pass at a glance. */
function controlBarSVG(c){
  const rows=c.rows||[]; if(!rows.length) return "";
  const rowH=34, top=14, ml=150, mr=56, bottom=42;
  const W=560, pw=W-ml-mr, H=top+rows.length*rowH+bottom;
  const xmax=c.xmax||Math.max(...rows.map(r=>r.value))*1.15||1;
  const X=v=>ml+(Math.max(0,v)/xmax)*pw;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||"")}">`;
  if(c.nullBand){ g+=`<rect x="${X(c.nullBand[0])}" y="${top-4}" width="${Math.max(1,X(c.nullBand[1])-X(c.nullBand[0]))}" height="${rows.length*rowH+8}" fill="var(--series-2)" opacity="0.14"/>`;
    g+=`<text class="tick-lab" x="${X(c.nullBand[1])+4}" y="${top-2}" style="fill:var(--ink-3)">no-effect band</text>`; }
  for(const t of (c.xticks||niceTicks(xmax,4))){ g+=`<line class="grid-line" x1="${X(t)}" y1="${top}" x2="${X(t)}" y2="${top+rows.length*rowH}" stroke-dasharray="3 3"/><text class="tick-lab" x="${X(t)}" y="${H-bottom+22}" text-anchor="middle">${t}</text>`; }
  rows.forEach((r,i)=>{
    const cy=top+i*rowH+rowH/2;
    const col=r.tone==="control"?"--series-2":(r.tone==="alert"?"--series-4":"--series-1");
    g+=`<text class="tick-lab" x="${ml-10}" y="${cy+3.5}" text-anchor="end" style="font-weight:600;fill:var(--ink-2)">${esc(r.label)}</text>`;
    g+=`<rect x="${ml}" y="${cy-9}" width="${Math.max(2,X(r.value)-ml)}" height="18" rx="3" fill="var(${col})"><title>${esc(r.label)}: ${niceNum(r.value)}</title></rect>`;
    g+=`<text class="tick-lab" x="${X(r.value)+8}" y="${cy+3.5}" style="fill:var(--ink-2);font-weight:700">${niceNum(r.value)}${esc(c.unit||"")}</text>`;
  });
  if(c.xlabel) g+=`<text class="axis-title" x="${ml+pw/2}" y="${H-10}" text-anchor="middle">${esc(c.xlabel)}</text>`;
  return g+`</svg>`;
}

/* Dispatcher. An unknown or empty figure returns a stated absence rather
   than a blank box, so a reader never mistakes a missing run for a null
   result. */
function figureSVG(f){
  if(!f||!f.kind) return "";
  const out = f.kind==="area"? areaChartSVG(f)
    : f.kind==="groupedBar"? groupedBarSVG(f)
    : f.kind==="roc"? rocCurveSVG(f)
    : f.kind==="dist"? distributionSVG(f)
    : f.kind==="controls"? controlBarSVG(f)
    : f.kind==="enrichment"? lineChartSVG(f)
    : f.kind==="candidates"? barChartSVG(f) : "";
  return out || `<div class="fig-empty">No data recorded for this figure yet. Run the experiment to populate it.</div>`;
}

function candidateTable(d){
  const c=d.candidates;
  return `<div class="section"><h3>Candidate ranking</h3><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Rank</th><th>Candidate</th><th class="num">Predicted score</th><th class="num">± unc.</th>${c.family?"<th>Chemotype family</th>":""}</tr></thead><tbody>
  ${c.rows.map((r,i)=>`<tr data-cand="${esc(r.id)}" class="${r.id===state.selCandidate?"sel":""}"><td class="num">${i+1}</td><td style="font-weight:600">${esc(r.id)}</td><td class="num">${niceNum(r.score)}</td><td class="num">${niceNum(r.err)}</td>${c.family?`<td>${esc(r.family)}</td>`:""}</tr>`).join("")}
  </tbody></table></div></div>`;
}
function enrichmentTable(d){
  const c=d.enrichment;
  return `<div class="section"><h3>${esc(c.title)}</h3><div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="num">${esc(c.xlabel)}</th><th class="num">Proposed (×)</th><th class="num">Baseline (×)</th></tr></thead><tbody>
  ${c.x.map((xv,i)=>`<tr><td class="num">${xv}</td><td class="num">${niceNum(c.proposed[i])}</td><td class="num">${niceNum(c.baseline[i])}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

/* pane action wiring */
function wirePaneActions(n){
  $$("[data-rtab]",el.paneBody).forEach(b=>b.addEventListener("click",()=>{ n._tab=b.dataset.rtab; renderPaneBody(n); }));
  $$("[data-cand]",el.paneBody).forEach(b=>b.addEventListener("click",()=>{ state.selCandidate=b.dataset.cand; renderPaneBody(n); toast("Selected "+b.dataset.cand+" — record highlighted"); }));
  $$(".data-point",el.paneBody).forEach(p=>p.addEventListener("click",()=>toast(`Observation: ${p.dataset.px}% screened → ${niceNum(p.dataset.py)}× enrichment`)));
  $$(".legend .lg",el.paneBody).forEach(b=>b.addEventListener("click",()=>{
    const on=b.getAttribute("aria-pressed")==="true"; b.setAttribute("aria-pressed",String(!on));
    const s=b.dataset.series; $$(`[data-line="${s}"]`,el.paneBody).forEach(p=>p.style.opacity=on?"0":"1");
  }));
  $$("[data-paneact]",el.paneBody).forEach(b=>b.addEventListener("click",()=>paneAction(b.dataset.paneact,n,b)));
}
function paneAction(act,n,btn){
  switch(act){
    case "run-exp": openRunModal(n.id); break;
    case "design-test": toast("Drafted a test from this hypothesis"); break;
    case "add-canvas": togglePreview(curProj().resultNode||n.id,true); toast("Chart preview added to canvas"); break;
    case "export": toast("Exported results.csv (sample)"); break;
    case "compare-runs": toast("Opened run comparison (r-02 vs r-03)"); break;
    case "add-evidence": addNode("source"); break;
    case "propose": addNode("hypothesis"); break;
    case "pick-next": toast("Selected next test: "+(btn.dataset.test||"")); break;
    case "activity": n._tab="activity"; renderPaneBody(n); break;
    default: toast("Noted");
  }
}

/* =========================== inline previews ========================== */
function previewState(id){
  const pv=state.previews[state.project]||(state.previews[state.project]={});
  if(!pv[id]){ const n=nodeById(id); pv[id]={open:false,x:(n?n.x+40:200),y:(n?n.y+150:200),w:360,h:300,tab:"plot"}; }
  return pv[id];
}
function togglePreview(id,forceOpen){
  const ps=previewState(id); ps.open=forceOpen?true:!ps.open; renderPreviews(); savePersist(); scheduleMinimap();
}
function renderPreviews(){
  el.previews.innerHTML="";
  const pv=state.previews[state.project]||{};
  for(const id in pv){ const ps=pv[id]; if(!ps||!ps.open)continue; const n=nodeById(id); if(!n)continue; el.previews.appendChild(buildPreview(n,ps)); }
}
function buildPreview(n,ps){
  const d=curData();
  const wrap=document.createElement("div");
  wrap.className="preview"+(ps.collapsed?" collapsed":"");
  wrap.style.left=ps.x+"px"; wrap.style.top=ps.y+"px"; wrap.style.width=ps.w+"px";
  if(!ps.collapsed) wrap.style.height=ps.h+"px";
  const tab=ps.tab||"plot";
  const body = tab==="plot"
    ? `<div style="display:flex;justify-content:flex-end;margin-bottom:6px"><span class="illus-pill">${(state.dataMode==="live"&&CHART_DATA.live)?"Measured · this run":d.measured?"Sample · verified":"Illustrative"}</span></div>${chartBlock("enrichment",d,false)}`
    : candidateTable(d);
  wrap.innerHTML=`
    <div class="preview-head">
      <span class="node-dot" style="background:${dotColor(n.type)}"></span>
      <span class="preview-title">${esc(n.title)}</span>
      <span class="sp">
        <button class="mini-btn" data-pv="collapse" title="${ps.collapsed?"Expand":"Collapse"}">${ps.collapsed?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>'}</button>
        <button class="mini-btn" data-pv="expand" title="Open in pane"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        <button class="mini-btn" data-pv="close" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>
    </div>
    ${ps.collapsed?"":`<div class="preview-tabs"><button class="tab" data-pvtab="plot" aria-selected="${tab==='plot'}">Plot</button><button class="tab" data-pvtab="table" aria-selected="${tab==='table'}">Table</button></div>
    <div class="preview-body">${body}</div>
    <div class="resize-h" data-pv="resize"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M11 5L5 11M14 8l-6 6M14 13l-1 1"/></svg></div>`}`;
  // wire
  const head=wrap.querySelector(".preview-head");
  let s=null;
  head.addEventListener("pointerdown",ev=>{ if(ev.target.closest(".mini-btn"))return; s={x:ev.clientX,y:ev.clientY,px:ps.x,py:ps.y}; head.setPointerCapture(ev.pointerId); ev.stopPropagation(); });
  head.addEventListener("pointermove",ev=>{ if(!s)return; const v=view(); ps.x=s.px+(ev.clientX-s.x)/v.scale; ps.y=s.py+(ev.clientY-s.y)/v.scale; wrap.style.left=ps.x+"px"; wrap.style.top=ps.y+"px"; });
  head.addEventListener("pointerup",ev=>{ if(!s)return; s=null; try{head.releasePointerCapture(ev.pointerId);}catch(e){} savePersist(); scheduleMinimap(); });
  wrap.querySelectorAll("[data-pv]").forEach(b=>b.addEventListener("click",ev=>{
    ev.stopPropagation(); const a=b.dataset.pv;
    if(a==="collapse"){ ps.collapsed=!ps.collapsed; renderPreviews(); savePersist(); }
    else if(a==="close"){ ps.open=false; renderPreviews(); savePersist(); scheduleMinimap(); }
    else if(a==="expand"){ selectNode(n.id); const nn=nodeById(n.id); nn._tab="plot"; renderPaneBody(nn); if(!state.pane.maximized)toggleMax(); }
  }));
  wrap.querySelectorAll("[data-pvtab]").forEach(b=>b.addEventListener("click",ev=>{ ev.stopPropagation(); ps.tab=b.dataset.pvtab; renderPreviews(); savePersist(); }));
  const rh=wrap.querySelector('[data-pv="resize"]');
  if(rh){ let r=null;
    rh.addEventListener("pointerdown",ev=>{ r={x:ev.clientX,y:ev.clientY,w:ps.w,h:ps.h}; rh.setPointerCapture(ev.pointerId); ev.stopPropagation(); });
    rh.addEventListener("pointermove",ev=>{ if(!r)return; const v=view(); ps.w=clamp(r.w+(ev.clientX-r.x)/v.scale,260,620); ps.h=clamp(r.h+(ev.clientY-r.y)/v.scale,170,560); wrap.style.width=ps.w+"px"; wrap.style.height=ps.h+"px"; });
    rh.addEventListener("pointerup",ev=>{ if(!r)return; r=null; try{rh.releasePointerCapture(ev.pointerId);}catch(e){} savePersist(); scheduleMinimap(); });
  }
  return wrap;
}

function sendCmd(){
  const inp=$("#cmdInput"); const t=inp.value.trim(); if(!t)return;
  // A question is the thing the lab actually answers, so it becomes the run's
  // question rather than another sticky note on the canvas.
  const isQuestion=/\?\s*$/.test(t)||/^(which|what|how|why|does|do|is|are|can|should)\b/i.test(t);
  if(isQuestion){
    state.question=t; inp.value="";
    updateProvenance&&updateProvenance();
    if(state.run.active){ toast("Question set — applies to the next run"); return; }
    // Still goes through the approval gate; a typed question does not skip it.
    openRunModal(curProj().primaryExp);
    return;
  }
  const isEvidence=/source|evidence|paper|cite|doi|dataset/i.test(t);
  const type=isEvidence?"source":"note";
  const linkTo=state.selection?nodeById(state.selection):null;
  addNode(type,t);
  inp.value="";
  toast((isEvidence?"Added evidence node":"Added note")+(linkTo?" linked to "+linkTo.title:""));
}

function addNode(type,text){

  const p=curProj(); const r=canvasRect(); const c=screenToWorld(r.width/2, r.height/2);
  const id=type[0]+"-"+Math.random().toString(36).slice(2,6);
  const titleMap={question:"New question",source:"New evidence",hypothesis:"New hypothesis",experiment:"New experiment",result:"New result",note:"Note"};
  const n=P(id,type,text?(text.length>42?text.slice(0,40)+"…":text):titleMap[type], text?"":"", type==="experiment"?"planned":"done", Math.round(c.x-NODE_W/2), Math.round(c.y-40), type==="note"?{text:text||""}:{});

/* ------------------------- create / delete ---------------------------- */
/* A new project starts from the demo graph rather than an empty canvas: the
   node types, the experiment wiring and the result node all have to exist for
   Run to have anything to drive, and an empty graph cannot express that. */
/* An empty-but-wired graph. Used when scaffolding is unavailable, and as the
   shape the scaffolder fills. It carries no content from any other project:
   a new project about batteries must never inherit NDM-1's question, which is
   what cloning the demo used to do. */
function blankGraph(name,question){
  const L={q1:[40,300],ev1:[300,300],hA:[560,170],hB:[560,430],exp:[830,300],res:[1100,250],next:[1380,140]};
  const N=(id,type,title,summary,meta)=>({id,type,title,summary,status:"planned",x:L[id][0],y:L[id][1],meta:meta||{}});
  return {
    name,icon:"flask",run:"Experiment 01",question:question||"",
    primaryExp:"exp",resultNode:"res",scaffolded:false,
    nodes:[
      N("q1","question","Research question",question||"Describe the question this project answers",
        question?{objective:question}:{}),
      N("ev1","source","Evidence","No sources recorded yet",
        {sources:[],relevance:"Add sources here. Citations are never generated — an invented reference is worse than a missing one."}),
      N("hA","hypothesis","Hypothesis A","Describe a candidate explanation",{}),
      N("hB","hypothesis","Hypothesis B","Describe a competing explanation",{}),
      N("exp","experiment","Experiment 01","Describe the test that separates them",{approval:"Required before run."}),
      N("res","result","Results","Not yet run",{}),
      N("next","next","Next experiment","Choose a test",{})
    ],
    edges:[{from:"q1",to:"ev1",rel:"uses"},{from:"ev1",to:"hA",rel:"supports"},
      {from:"ev1",to:"hB",rel:"supports"},{from:"hA",to:"exp",rel:"tests"},
      {from:"hB",to:"exp",rel:"tests"},{from:"exp",to:"res",rel:"produced"},
      {from:"res",to:"next",rel:"uses"}]
  };
}

async function createProject(){
  const name=(prompt("Name the new project","Untitled project")||"").trim();
  if(!name) return;
  const question=(prompt("What question should this project answer?\n\nLeave blank to start from an empty graph.","")||"").trim();

  // Ask the backend to design the opening plan for *this* topic. Everything
  // it proposes lands on editable nodes, so the user reads and corrects it
  // before any of it can reach an exported paper.
  let doc=null;
  if(question){
    toast("Designing the research plan…");
    try{
      const r=await api("/api/scaffold",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name,question})});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j.ok&&j.doc) doc=j.doc;
      else toast(j.reason||"Scaffolding unavailable — starting from an empty graph");
    }catch(e){ toast("Offline — starting from an empty graph"); }
  }
  if(!doc) doc=blankGraph(name,question);

  try{
    const r=await api("/api/projects",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({doc})});
    if(!r.ok){ const j=await r.json().catch(()=>({})); toast(j.error||"Could not create project"); return; }
    const j=await r.json();
    state.projects[j.id]=doc; PROJECT_ORDER.push(j.id);
    renderProjects(); switchProject(j.id);
    toast(`Created “${name}”`);
  }catch(e){ toast("Offline — could not create project"); }
}

async function deleteCurrentProject(){
  const sid=state.project, p=state.projects[sid];
  if(!p) return;
  if(!confirm(`Delete “${p.name}”? This cannot be undone.`)) return;
  try{
    const r=await api("/api/projects/"+encodeURIComponent(sid),{method:"DELETE"});
    if(!r.ok){ const j=await r.json().catch(()=>({})); toast(j.error||"Could not delete project"); return; }
  }catch(e){ toast("Offline — could not delete project"); return; }
  delete state.projects[sid];
  delete state.view[sid]; delete state.previews[sid];
  PROJECT_ORDER=PROJECT_ORDER.filter(x=>x!==sid);
  toast(`Deleted “${p.name}”`);
  if(PROJECT_ORDER.length){ switchProject(PROJECT_ORDER[0]); }
  else{ // last project gone: fall back to a local, unsaved demo canvas
    loadDemoOnly(); renderProjects(); renderCrumb(); renderGraph(); fit(false);
  }
}

async function startRun(expId){

/* ================================ auth ================================
   The sidebar chip reflects the real session. On a static host (no backend)
   there is nothing to sign in to, and the chip says so rather than offering
   a sign-in that cannot work. */
const AUTH={user:null,mayRun:false,configured:false,reachable:false};
function api(path,opts){
  return fetch((CFG.backendUrl||"")+path,Object.assign({credentials:"include"},opts||{}));
}
async function refreshAuth(){
  try{
    const r=await api("/api/me");
    if(!r.ok) throw new Error("no auth endpoint");
    const j=await r.json();
    AUTH.user=j.user; AUTH.mayRun=!!j.mayRun; AUTH.avatar=j.avatar; AUTH.reachable=true;
    AUTH.devOpen=!!j.devOpen;

  }catch(e){ AUTH.reachable=false; AUTH.user=null; AUTH.mayRun=false; }

function renderAuth(){
  const av=$("#authAvatar"), nm=$("#authName"), row=$("#authRow");
  if(!av||!nm||!row) return;
  if(AUTH.user){

    av.style.backgroundImage=""; av.textContent="⌂"; nm.textContent="Local development";
    row.title="Running locally with no OAuth app configured — sign-in is not required here";
  }else{

function authClick(){
  if(!AUTH.reachable){ toast("No server on this host — runs replay a recorded trace"); return; }
  if(AUTH.devOpen){ toast("Local development — sign-in is not required here"); return; }
  if(AUTH.user){

function hasBackend(){
  return new Promise(res=>{
    const base=(CFG.backendUrl||"")+"/api/health";
    const ctl=new AbortController(); const t=setTimeout(()=>{ctl.abort();res(false);},1200);
    fetch(base,{method:"GET",signal:ctl.signal}).then(r=>r.ok?r.json():null).then(j=>{clearTimeout(t);res(!!(j&&j.ok));}).catch(()=>{clearTimeout(t);res(false);});
  });
}
function logEvent(ev){
  ev.time=ev.time||nowClock();
  // merge running→done for same agent
  if(ev.st==="done"){ const last=[...state.run.log].reverse().find(a=>a.agent===ev.agent&&a.st==="running"); if(last){last.st="done";last.msg=ev.msg||last.msg;last.time=ev.time; refreshActivity(); return;} }
  state.run.log.push(ev); refreshActivity();
}
function refreshActivity(){ const sel=state.selection?nodeById(state.selection):null; if(sel&&sel.type==="result"&&sel._tab==="activity") renderPaneBody(sel); }
function setStatus(id,st){ const n=nodeById(id); if(!n)return; n.status=st; const d=nodeEls[id]; if(d){ const chip=d.querySelector(".status-chip"); const s=STATUS[st]; chip.dataset.st=st; chip.innerHTML=`<span class="glyph">${s.g}</span>${s.l}`; } if(state.selection===id)renderPaneHeader(n); }
function pulse(id){ const d=nodeEls[id]; if(d){ d.classList.remove("pulse"); void d.offsetWidth; d.classList.add("pulse"); } }
function nowClock(){ const d=new Date(); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}); }

function finishRun(expId,runId,aborted){
  state.run.active=false; updateProvenance();
  el.runbar.hidden=true;
  // A run that never started must not be reported as a completed one.
  if(aborted) return;
  const resId=curProj().resultNode;
  if(resId){ setStatus(resId,"done"); togglePreview(resId,true); pulse(resId); }
  setStatus(expId,"done");
  const nextN=curProj().nodes.find(n=>n.type==="next"); if(nextN) setStatus(nextN.id,"planned");
  toast(`${runId} complete — ${state.run.mode==="live"?"live Omnigent run":"replayed trace"}`);
  // if result pane open, refresh to show fresh charts/provenance
  const sel=state.selection?nodeById(state.selection):null; if(sel&&sel.type==="result"){ renderPaneBody(sel); }
}
function runReplay(expId,runId){
  const pid=curProj().id;
  const steps = pid==="ndm1" ? [
    [300, ()=>logEvent({agent:"Omnigent (PI)",msg:"Approved r-03 · dispatching sub-agents",st:"done"})],
    [700, ()=>{logEvent({agent:"Literature",msg:"Scanning sources for NDM-1 inhibitor priors…",st:"running"}); runSub("literature");}],
    [1700,()=>logEvent({agent:"Literature",msg:"12 sources scanned · 3 chelation-warhead claims grounded",st:"done"})],
    [1900,()=>{logEvent({agent:"Extractor",msg:"Building labelled fixture (scaffold split)…",st:"running"}); runSub("extractor");}],
    [2800,()=>{logEvent({agent:"Extractor",msg:"RDKit fingerprints + Bemis–Murcko scaffolds ready",st:"done"}); setStatus("hA","done"); setStatus("hB","done");}],
    [3100,()=>{logEvent({agent:"Hypothesizer",msg:"Diversity-aware screen ranked above potency-only",st:"done"}); runSub("hypothesizer");}],
    [3400,()=>{logEvent({agent:"Screener",msg:"Random-forest rank over candidate pool…",st:"running"}); runSub("screener");}],
    [4600,()=>{logEvent({agent:"Screener",msg:"Enrichment 11.3× @ top 1% · 5 candidates advanced",st:"done"}); setStatus("rank","done"); pulse("rank");}],
    [5000,()=>{logEvent({agent:"Critic",msg:"Controls clean · random 1.05× · y-scramble AUC 0.52",st:"done"}); runSub("critic");}],
    [5600,()=>finishRun(expId,runId)]
  ] : [
    [300, ()=>logEvent({agent:"Omnigent (PI)",msg:`Approved ${runId} · dispatching sub-agents`,st:"done"})],
    [800, ()=>logEvent({agent:"Literature",msg:"Gathering evidence…",st:"running"})],
    [1700,()=>{logEvent({agent:"Literature",msg:"Evidence grounded",st:"done"}); nodeFirstHyp();}],
    [2100,()=>logEvent({agent:"Screener",msg:"Ranking candidates…",st:"running"})],
    [3300,()=>logEvent({agent:"Screener",msg:"Ranking complete",st:"done"})],
    [3700,()=>{logEvent({agent:"Critic",msg:"Controls checked",st:"done"}); finishRun(expId,runId);}]
  ];
  state.run.timers.forEach(clearTimeout); state.run.timers=[];
  const t0=Date.now();
  for(const [dt,fn] of steps){ state.run.timers.push(setTimeout(()=>{ if(state.run.active||dt<100) fn(); updateRunSub(Date.now()-t0); },reduceMotion?Math.min(dt,400):dt)); }
}
function nodeFirstHyp(){ const h=curProj().nodes.find(n=>n.type==="hypothesis"); if(h)setStatus(h.id,"done"); }

$("#runCancel").addEventListener("click",()=>{
  state.run.timers.forEach(clearTimeout); state.run.timers=[];
  if(state.run.abort){try{state.run.abort.abort();}catch(e){}}
  state.run.active=false; el.runbar.hidden=true; updateProvenance();

});
async function runViaBackend(expId,runId){
  try{
    const ctl=new AbortController(); state.run.abort=ctl;
    const res=await api("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({project:curProj().id,experiment:expId,runId,dataMode:state.dataMode,
        question:state.question||curProj().question||""}),signal:ctl.signal});
    // A refused run is not a dropped stream: say why instead of quietly replaying.
    if(res.status===401||res.status===403){
      const j=await res.json().catch(()=>({}));
      logEvent({agent:"Relay",msg:j.error||"Not authorised to start a run",st:"failed"});
      setStatus(expId,"planned"); finishRun(expId,runId,true);
      toast(j.error||"Sign in to start a run"); refreshAuth();
      return;
    }
    if(!res.ok||!res.body) throw new Error("no stream");
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){ const {value,done}=await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true});
      let idx; while((idx=buf.indexOf("\n\n"))>=0){ const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const line=chunk.split("\n").find(l=>l.startsWith("data:")); if(!line)continue;
        try{ applyBackendEvent(JSON.parse(line.slice(5).trim()),expId,runId); }catch(e){}
      }
    }
    finishRun(expId,runId);
  }catch(e){ // fall back to replay if the live stream drops
    if(state.run.active){ logEvent({agent:"Relay",msg:"Live stream unavailable — replaying labelled trace",st:"failed"}); state.run.mode="replay"; updateProvenance(); $("#runTxt").textContent="Replaying trace"; runReplay(expId,runId); }
  }
}
function applyBackendEvent(ev,expId,runId){
  if(ev.type==="status"&&ev.node) setStatus(ev.node,ev.status);
  else if(ev.type==="act") logEvent({agent:ev.agent||"agent",msg:ev.msg||"",st:ev.st||"done"});
  else if(ev.type==="result"){
    // Adopt this run's own charts, tables and shortlist. Until a run happens
    // the canvas shows the bundled sample; from here it shows what was measured.
    adoptRunData(ev.data);
    // Record the run against the project. This is what makes the exported
    // report describe *this* project's run rather than a stored example:
    // every figure and every number in the paper is read back from here.
    if(ev.data){
      const p=curProj();
      if(p){ p.results=Object.assign({},ev.data,{recordedAt:new Date().toISOString(),runId:runId}); savePersist(); }
    }
    if(ev.node){ setStatus(ev.node,"done"); togglePreview(ev.node,true); }
  }
  // A server-side failure is reported as itself, not hidden behind a replay.
  else if(ev.type==="error"){
    logEvent({agent:"Relay",msg:ev.msg||"Run failed on the server",st:"failed"});
    setStatus(expId,"failed"); state.run.failed=true;
    finishRun(expId,runId,true); toast(ev.msg||"Run failed");
  }
  else if(ev.type==="done"){ finishRun(expId,runId); }
}

  const t=document.createElement("div"); t.className="toast"; t.innerHTML=`<span class="tdot"></span>${esc(msg)}`;

/* ============================== report ================================
   Assembles the project into a paper. Everything here is derived from the
   graph, the chart data and the run log -- the report cannot state a result
   the workspace does not hold. The three narrative sections may be replaced
   by model-written prose (see writeNarrative), which is constrained to the
   same facts and is labelled in the byline when used. */
const NARRATIVE={abstract:"",discussion:"",limitations:"",source:"assembled",model:"",
  verified:false, verifyError:null, removed:[]};

/* --- figures, derived from what the project actually recorded ----------
   The figure set is built per project, from `project.results` (written by a
   run) and, for the bundled demos, from their stored chart data. Nothing is
   modelled to fill a gap: a metric the project has not measured produces a
   figure that says so. In particular an ROC curve is drawn only from real
   (fpr, tpr) pairs -- a curve reconstructed from a single AUC value would be
   a drawing of an assumption, not of a result. */
function projResults(){ const p=curProj(); return (p&&p.results)||null; }

function buildFigures(){
  const d=curData(), r=projResults(), f=(r&&r.figures)||{};
  const out=[];

  // Figure: enrichment against screening depth
  if((f.enrichment_curve||[]).length){
    const depths=f.enrichment_curve.map(p=>p[0]);
    const series=[{name:"Model ranking",values:f.enrichment_curve.map(p=>p[1])}];
    if((f.random_curve||[]).length) series.push({name:"Random ranking (control)",values:f.random_curve.map(p=>p[1]),color:"--series-2"});
    out.push({id:"enrich",kind:"area",x:depths,series,
      xlabel:"Fraction of library screened (%)", ylabel:"Enrichment factor (×)",
      caption:"Enrichment factor as a function of how deep into the ranked library the assay budget reaches, against a random-ranking control measured on the same held-out set.",
      title:"Enrichment versus screening depth"});
  }else if(d.enrichment){
    out.push(Object.assign({id:"enrich",kind:"enrichment",
      caption:"Enrichment factor against screening depth. "+(d.measured?"Values are the recorded fixture run.":"Illustrative placeholder values — not a measured result."),
      },d.enrichment));
  }

  // Figure: ROC on the held-out split
  out.push({id:"roc",kind:"roc",points:f.roc_curve||[],auc:r?r.roc_auc:null,
    title:"ROC — held-out scaffold-disjoint split",
    caption:"Receiver operating characteristic on the held-out split, with the chance diagonal shown for reference. Drawn only from measured (FPR, TPR) pairs."});

  // Figure: score separation between classes
  if((f.score_bins||[]).length){
    out.push({id:"dist",kind:"dist",bins:f.score_bins,
      groups:[{name:"Known actives",counts:f.score_hist_active||[]},
              {name:"Known inactives",counts:f.score_hist_inactive||[],color:"--series-2"}],
      xlabel:"Predicted score", ylabel:"Compounds",
      title:"Predicted-score distribution by true class",
      caption:"Distribution of predicted scores for known actives and inactives in the held-out set. The separation between the two is what the AUC above summarises as a single number."});
  }

  // Figure: method against its controls
  if(r){
    const rows=[];
    if(r.ef_top1pct!=null) rows.push({label:"Model · top 1%",value:r.ef_top1pct});
    if(r.ef_top5pct!=null) rows.push({label:"Model · top 5%",value:r.ef_top5pct});
    if(r.control_random_ef1!=null) rows.push({label:"Random ranking",value:r.control_random_ef1,tone:"control"});
    if(rows.length>1){
      out.push({id:"controls",kind:"controls",rows,unit:"×",nullBand:[0,1.2],
        xlabel:"Enrichment factor (× over base rate)",
        title:"Method against its negative control",
        caption:"Enrichment achieved by the ranking against a random-ranking control. The shaded band marks the region indistinguishable from chance; a control falling inside it is the expected, passing outcome."});
    }
  }

  // Figure: ranked candidates
  if(d.candidates&&(d.candidates.rows||[]).length){
    out.push(Object.assign({id:"cands",kind:"candidates",
      caption:"Top-ranked candidates with their predicted scores and uncertainty. "+(d.measured?"":"Illustrative placeholder values — not measured."),
      },d.candidates));
  }
  return out;
}

function byType(t){ return (curProj().nodes||[]).filter(n=>n.type===t); }
function firstOf(t){ return byType(t)[0]||null; }
function m(n){ return (n&&n.meta)||{}; }
/* Rationales are written as standalone sentences; splicing one into the middle
   of another sentence needs its leading capital dropped -- but not on an
   acronym or a flag like "RDKit" or "--aid", where the capital is the word. */
function lowerFirst(s){
  if(!s) return s;
  if(/^[A-Z]{2,}/.test(s)||/^[^A-Za-z]/.test(s)) return s;
  return s[0].toLowerCase()+s.slice(1);
}
function list(items){
  if(!items||!items.length) return "";
  return `<ul>${items.map(i=>`<li>${esc(typeof i==="string"?i:(i.name||""))}</li>`).join("")}</ul>`;
}

/* --- assembled prose -------------------------------------------------- */
/* Deterministic fallbacks. They are written to be honest rather than
   impressive: every clause is conditional on the data actually being there. */
function assembledAbstract(){
  const q=m(firstOf("question")), ex=m(firstOf("experiment")), d=curData();
  const res=byType("result").map(m).find(x=>x.interp);
  const ev=m(firstOf("source"));
  const bits=[];
  if(q.objective) bits.push(q.objective);
  if(ev&&ev.relevance) bits.push(`Evidence base: ${ev.relevance.replace(/\.$/,"")}.`);
  if(ex.method) bits.push(`Method: ${ex.method.replace(/\.$/,"")}, with ${ex.controls||"no declared controls"}.`);
  if(res&&res.interp) bits.push(res.interp);
  if(!d.measured) bits.push("All values shown are illustrative placeholders, not measured findings.");
  return bits.join(" ");
}
function assembledDiscussion(){
  const res=byType("result").map(m).find(x=>x.interp);
  const ex=m(firstOf("experiment"));
  const hyps=byType("hypothesis");
  const out=[];
  if(res&&res.interp) out.push(res.interp);
  if(ex.controls) out.push(`The result is interpretable only because the controls behaved as required: ${ex.controls}. A ranking that beat random while the controls also looked strong would indicate a leak in the split rather than a real signal.`);
  if(hyps.length>1) out.push(`Two hypotheses were carried in parallel (${hyps.map(h=>esc(h.title)).join(" and ")}), so the experiment was built to separate them rather than to confirm a single favoured explanation.`);
  return out.join("\n\n");
}
function assembledLimitations(){
  const q=m(firstOf("question")), ev=m(firstOf("source")), d=curData();
  const out=[];
  if(!d.measured) out.push("The figures in this report are illustrative placeholders and must not be read as measured findings.");
  if(q.scope) out.push(q.scope);
  if(ev.limitations) out.push(ev.limitations);
  if(q.constraints) out.push(q.constraints);
  out.push("This work ranks candidates from assay-derived labels. It does not establish binding, and it cannot distinguish a genuine inhibitor from a compound that registers as active across many unrelated assays. Any candidate taken forward needs orthogonal confirmation.");
  return out.join(" ");
}

/* --- sections --------------------------------------------------------- */
function secQuestion(){
  const n=firstOf("question"); if(!n) return "";
  const q=m(n);
  const rows=[["Objective",q.objective],["Scope",q.scope],["Success measure",q.outcome],
              ["Constraints",q.constraints],["Data",q.data],["Budget",q.budget]]
    .filter(r=>r[1]).map(r=>`<tr><th style="width:150px">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join("");
  return `<section><h2>1 · Question and objective</h2>
    <p>${esc(n.summary||n.title)}</p>${rows?`<table>${rows}</table>`:""}</section>`;
}
function secEvidence(){
  const n=firstOf("source"); if(!n) return "";
  const e=m(n);
  // Numbering matches the reference list exactly: both walk the same records
  // in the same order, so [3] in the table is [3] in the bibliography.
  const refs=refList();
  const rows=refs.map((s,i)=>`<tr><td class="num">[${i+1}]</td><td>${esc(s.src)}</td><td class="muted">${esc(s.meta)}</td>
      <td>${esc(s.rel||"—")}</td><td>${esc(s.body)}</td></tr>`).join("");
  return `<section><h2>2 · Evidence base</h2>
    ${e.relevance?`<p>${esc(e.relevance)}</p>`:""}
    ${rows?table("Sources on record, with the bearing each has on the question. Numbers match the reference list in §11.",
        `<thead><tr><th>#</th><th>Source</th><th>Type</th><th>Relation</th><th>Bearing on the question</th></tr></thead>`,rows):""}
    ${e.limitations?`<div class="callout warn"><b>Evidence limitation.</b> ${esc(e.limitations)}</div>`:""}</section>`;
}
function secHypotheses(){
  const hs=byType("hypothesis"); if(!hs.length) return "";
  const blocks=hs.map((n,i)=>{
    const h=m(n);
    return `<h3>${esc(n.title)} — ${esc(n.summary||"")}</h3>
      ${h.statement?`<p>${esc(h.statement)}</p>`:""}
      ${h.predictions&&h.predictions.length?`<p class="muted"><b>Predictions if true.</b></p>${list(h.predictions)}`:""}
      ${h.supports&&h.supports.length?`<p class="muted"><b>Supporting evidence.</b></p>${list(h.supports)}`:""}
      ${h.contradict&&h.contradict.length?`<p class="muted"><b>Evidence against / risk.</b></p>${list(h.contradict)}`:""}
      ${h.uncertainty?`<p class="muted"><b>Confidence.</b> ${esc(h.uncertainty)}</p>`:""}`;
  }).join("");
  return `<section><h2>3 · Hypotheses considered</h2>
    <p>${hs.length} competing hypotheses were carried forward, so the experiment below is designed to discriminate between them rather than to confirm one.</p>
    ${blocks}</section>`;
}
function secMethods(){
  const n=firstOf("experiment"); if(!n) return "";
  const x=m(n);
  const tests=(x.tests||[]).map(t=>`<tr><td>${esc(t.name)} ${t.sel?`<span class="tag sel">selected</span>`:`<span class="tag">considered</span>`}</td><td>${esc(t.why||"")}</td></tr>`).join("");
  const rows=[["Method",x.method],["Inputs",x.inputs],["Baseline",x.baseline],["Controls",x.controls],
              ["Parameters",x.params],["Approval",x.approval],["Budget",x.cost]]
    .filter(r=>r[1]).map(r=>`<tr><th style="width:150px">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join("");
  return `<section><h2>4 · Method</h2>
    <p><b>${esc(n.title)}</b> — ${esc(n.summary||"")}</p>
    ${tests?`<h3>Candidate tests weighed</h3><table><thead><tr><th>Test</th><th>Rationale</th></tr></thead><tbody>${tests}</tbody></table>`:""}
    ${rows?`<h3>Protocol</h3><table>${rows}</table>`:""}</section>`;
}
/* Figure and table numbering is assigned as the paper is assembled, so the
   captions stay correct however many figures a given project has data for. */
let FIGN=0, TABN=0;
function figure(f){
  const svg=figureSVG(f); if(!svg) return "";
  FIGN++;
  return `<figure class="fig"><div class="chart">
      <div class="fig-title">${esc(f.title||"")}</div>
      ${f.sub?`<div class="fig-sub">${esc(f.sub)}</div>`:""}
      ${svg}</div>
    <figcaption><b>Figure ${FIGN}.</b> ${esc(f.caption||f.title||"")}</figcaption></figure>`;
}
function table(caption,head,bodyRows){
  if(!bodyRows) return "";
  TABN++;
  return `<div class="tbl-wrap"><div class="tbl-cap"><b>Table ${TABN}.</b> ${esc(caption)}</div>
    <table>${head}<tbody>${bodyRows}</tbody></table></div>`;
}

function secResults(){
  const d=curData(), r=projResults();
  const figs=buildFigures();

  // Measured scalars, read back from the project's own recorded run.
  // Precision is set per measure, not globally. An AUC rounded to two places
  // turns a scramble control of 0.503 into "0.5", which reads as a round
  // number rather than as the measurement it is; enrichment factors, by
  // contrast, carry no meaning past two places.
  const mrows=[
    ["Ranking accuracy (ROC-AUC)", r&&r.roc_auc, 3, "held-out, scaffold-disjoint split"],
    ["Enrichment @ top 1%", r&&r.ef_top1pct, 2, "× over the base hit rate"],
    ["Enrichment @ top 5%", r&&r.ef_top5pct, 2, "× over the base hit rate"],
    ["Control — random ranking", r&&r.control_random_ef1, 2, "must sit at ≈1× for the result to mean anything"],
    ["Control — label scramble (AUC)", r&&r.control_yscramble_auc, 3, "must collapse to ≈0.5"],
  ].filter(x=>x[1]!=null)
   .map(x=>`<tr><td>${esc(x[0])}</td><td class="num"><b>${Number(x[1]).toFixed(x[2])}</b></td><td class="muted">${esc(x[3])}</td></tr>`).join("");

  const srows=[
    ["Compounds in library", r&&r.n_compounds],["Known actives", r&&r.n_active],
    ["Base hit rate", r&&r.base_rate!=null?(Math.round(r.base_rate*1e4)/100)+"%":null],
    ["Training compounds", r&&r.n_train],["Held-out compounds", r&&r.n_test],
  ].filter(x=>x[1]!=null)
   .map(x=>`<tr><td>${esc(x[0])}</td><td class="num">${esc(String(x[1]))}</td></tr>`).join("");

  const interp=byType("result").map(m).filter(x=>x.interp);
  const stats=(d.stats||[]).map(s=>`<tr><td>${esc(s.lab)}</td><td class="num"><b>${esc(s.val)}</b></td><td class="muted">${esc(s.sub||"")}</td></tr>`).join("");

  return `<section><h2>5 · Results</h2>
    ${!r?`<div class="callout warn"><b>No run recorded for this project.</b> The figures below render only what has been measured; sections without data state their absence rather than showing a placeholder curve.</div>`:""}
    ${!d.measured&&!r?`<div class="callout warn"><b>Illustrative data.</b> Values shown come from the interface's sample mode and are not measured findings.</div>`:""}
    ${srows?table("Composition of the screened set and the train/test split.",
        `<thead><tr><th>Quantity</th><th class="num">Value</th></tr></thead>`,srows):""}
    ${mrows?table("Measured performance on the held-out split, with both negative controls.",
        `<thead><tr><th>Measure</th><th class="num">Value</th><th>Basis</th></tr></thead>`,mrows)
      :(stats?table("Headline measures.",`<thead><tr><th>Measure</th><th class="num">Value</th><th>Basis</th></tr></thead>`,stats):"")}
    ${figs.map(figure).join("")}
    ${interp.length?`<h3>5.1 · Interpretation</h3>${interp.map(x=>`<p>${esc(x.interp)}</p>`).join("")}`:""}</section>`;
}

/* --- references --------------------------------------------------------
   Built only from sources recorded on the project's evidence nodes. The
   renderer never supplies a DOI, a year, a venue or an author it was not
   given: an entry with only a title is printed with only a title. A paper
   that invents a citation is worse than one that cites sparsely. */
function refList(){
  const out=[];
  for(const n of byType("source")){
    for(const s of (m(n).sources||[])){
      if(!s||!s.src) continue;
      out.push({src:s.src, meta:s.meta||"", body:s.body||"", url:s.url||"", doi:s.doi||"", rel:s.rel||""});
    }
  }
  return out;
}
function secReferences(){
  const refs=refList();
  if(!refs.length) return `<section><h2>11 · References</h2>
    <p class="muted">No sources are recorded on this project's evidence nodes. Add evidence in the workspace and they will be cited here.</p></section>`;
  const items=refs.map((x,i)=>`<li id="ref${i+1}">
      <span class="ref-src">${esc(x.src)}</span>${x.meta?` <span class="muted">(${esc(x.meta)})</span>`:""}
      ${x.doi?` <span class="muted">doi:${esc(x.doi)}</span>`:""}
      ${x.url?` <span class="muted">${esc(x.url)}</span>`:""}
    </li>`).join("");
  return `<section><h2>11 · References</h2>
    <ol class="reflist">${items}</ol>
    <p class="muted" style="margin-top:10px">Entries are reproduced verbatim from the sources recorded in the workspace. Fields absent from the record — author, year, venue, identifier — are omitted rather than reconstructed.</p></section>`;
}
function secControls(){
  const x=m(firstOf("experiment")); if(!x.controls&&!x.baseline) return "";
  return `<section><h2>6 · Controls and validity</h2>
    <table>
      ${x.baseline?`<tr><th style="width:150px">Baseline</th><td>${esc(x.baseline)}</td></tr>`:""}
      ${x.controls?`<tr><th style="width:150px">Controls</th><td>${esc(x.controls)}</td></tr>`:""}
    </table>
    <p class="muted">Controls are reported whether or not they are favourable. A control that failed to behave as specified would invalidate the result above, and is the first thing a reader should check.</p></section>`;
}
function secNext(){
  const n=firstOf("next"); if(!n) return "";
  const x=m(n), tests=x.tests||[];
  const rows=tests.map((t,i)=>`<tr><td><b>${i+1}.</b> ${esc(t.name)}</td><td>${esc(t.why||"")}</td><td class="num">${esc(t.cost||"—")}</td></tr>`).join("");
  return `<section><h2>9 · Recommended next experiments</h2>
    ${x.changed?`<p><b>What this run changed.</b> ${esc(x.changed)}</p>`:""}
    ${x.uncertainty?`<div class="callout"><b>Open question.</b> ${esc(x.uncertainty)}</div>`:""}
    ${rows?`<table><thead><tr><th style="width:38%">Proposed experiment</th><th>Why it is worth running</th><th class="num">Est. cost</th></tr></thead><tbody>${rows}</tbody></table>`:""}
    ${tests.length?`<p class="muted"><b>Immediate action.</b> Run “${esc(tests[0].name)}” first — ${esc(lowerFirst((tests[0].why||"").replace(/\.$/,"")))}.</p>`:""}</section>`;
}
function secProvenance(){
  const res=byType("result").map(m).filter(x=>x.provenance);
  const log=state.run.log||[];
  const pr=res.length?res[res.length-1].provenance:null;
  const rows=pr?Object.keys(pr).map(k=>`<tr><th style="width:150px">${esc(k)}</th><td>${esc(pr[k])}</td></tr>`).join(""):"";
  const logRows=log.map(e=>`<tr><td class="muted">${esc(e.time||"")}</td><td>${esc(e.agent||"")}</td><td>${esc(e.msg||"")}</td></tr>`).join("");
  return `<section><h2>10 · Provenance and run record</h2>
    ${rows?`<table>${rows}</table>`:"<p class='muted'>No run provenance recorded for this project.</p>"}
    ${logRows?`<h3>Agent activity</h3><table><thead><tr><th style="width:74px">Time</th><th style="width:120px">Agent</th><th>Step</th></tr></thead><tbody>${logRows}</tbody></table>`
      :`<p class="muted">No agent activity recorded in this session. Press Run on the graph to produce a live trace.</p>`}</section>`;
}

/* --- assembly --------------------------------------------------------- */
/* The claim check is stated in the document itself, not just in a toast.
   A reader has to be able to tell whether the prose was checked, and what
   came out of it, from the paper alone. Removals are listed rather than
   quietly dropped: what a fact-checker struck is itself a finding about the
   draft, and hiding it would defeat the point of running the check. */
function narrativeAudit(){
  if(!NARRATIVE.verified){
    return `<div class="callout warn"><b>Claim check did not run.</b> The drafted prose has
      <b>not</b> been checked against the recorded data${NARRATIVE.verifyError?` (${esc(NARRATIVE.verifyError)})`:""}.
      Treat the narrative sections as unverified and read them against the tables before circulating this report.</div>`;
  }
  const n=NARRATIVE.removed.length;
  if(!n) return `<p class="byline-gen">A second adversarial pass re-read the draft against the recorded data and found no unsupported claim.</p>`;
  const items=NARRATIVE.removed.map(x=>`<li><span class="muted">[${esc(x.section)}]</span>
      “${esc(x.sentence)}” — ${esc(x.why||"not supported by the recorded data")}</li>`).join("");
  return `<div class="callout"><b>Claim check: ${n} statement${n===1?"":"s"} removed.</b>
    A second adversarial pass re-read the draft against the recorded data and struck the following,
    which are <b>not</b> present in the report above:
    <ul class="audit-list">${items}</ul></div>`;
}

function buildPaper(){
  FIGN=0; TABN=0;   // numbering restarts for every assembly
  const p=curProj(), q=m(firstOf("question")), d=curData(), r=projResults();
  const when=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  const author=AUTH.user?`${esc(AUTH.user)} (GitHub)`:"Unattributed session";
  const mode=d.measured?"Verified sample data":"Illustrative placeholder data";
  const runLabel=state.run.mode==="live"?"live run":(state.run.mode==="replay"?"replayed trace":"no run in this session");
  const abstract=NARRATIVE.abstract||assembledAbstract();
  const discussion=NARRATIVE.discussion||assembledDiscussion();
  const limits=NARRATIVE.limitations||assembledLimitations();
  const wrote=NARRATIVE.source==="model";

  return `
    <h1>${esc(p.name)} — computational screening report</h1>
    <p class="p-lede">${esc((firstOf("question")&&firstOf("question").summary)||p.question||"")}</p>
    <div class="p-meta">
      <span><b>Prepared by</b> ${author}</span>
      <span><b>Date</b> ${esc(when)}</span>
      <span><b>Run</b> ${esc(p.run||"—")} · ${esc(runLabel)}</span>
      <span><b>Data</b> ${esc(mode)}</span>
    </div>

    <section><h2>Abstract</h2>
      <p>${esc(abstract)}</p>
      ${wrote?`<p class="byline-gen">Abstract, discussion and limitations drafted by ${esc(NARRATIVE.model||"a language model")} from this project's recorded data. All numbers, figures, tables and references in this report are assembled from the run record, not written by the model.</p>`:""}
      ${wrote?narrativeAudit():""}
      ${(p.scaffolded&&!r)?`<div class="callout warn"><b>Plan-stage project.</b> This project's question, hypotheses and experiment design were proposed by a model as a starting point and have not been grounded in sources or tested by a run. Nothing below is a finding.</div>`:""}
    </section>

    ${secQuestion()}
    ${secEvidence()}
    ${secHypotheses()}
    ${secMethods()}
    ${secResults()}
    ${secControls()}

    <section><h2>7 · Discussion</h2>${discussion.split(/\n\n+/).map(x=>`<p>${esc(x)}</p>`).join("")}</section>
    <section><h2>8 · Limitations</h2><p>${esc(limits)}</p></section>

    ${secNext()}
    ${secProvenance()}
    ${secReferences()}

    <footer class="p-foot">
      Generated by Relay from the project graph on ${esc(when)}.
      This is a computational triage report: it reprioritises candidates for assay and does not
      confirm binding, efficacy or safety. ${d.measured?"":"Figures shown are illustrative placeholders."}
    </footer>`;
}

function openReport(){
  $("#paper").innerHTML=buildPaper();
  $("#reportNote").textContent=NARRATIVE.source==="model"
    ? `Narrative drafted by ${NARRATIVE.model||"model"}`
    : "Assembled from the project graph";
  $("#reportOv").classList.add("open");
  document.body.style.overflow="hidden";
  $("#reportOv").scrollTop=0;
}
function closeReport(){
  $("#reportOv").classList.remove("open");
  document.body.style.overflow="";
}

/* The browser's own print pipeline is the PDF writer: the charts are inline
   SVG, so they come out as vector with selectable labels, which no
   screenshot-based exporter would manage. */
function exportPDF(){
  toast("Choose “Save as PDF” as the destination");
  setTimeout(()=>window.print(),260);
}

async function writeNarrative(){
  if(!AUTH.user){ toast("Sign in to draft the narrative"); return; }
  const btn=$("#reportWrite"); const label=btn.querySelector(".btn-label");
  const was=label.textContent; label.textContent="Writing…"; btn.disabled=true;
  try{
    const r=await api("/api/narrative",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({project:curProj(),metrics:(curData().stats||[]),dataMode:state.dataMode})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok){
      // The assembled report is already complete, so a failure here is a
      // declined upgrade, not a broken export.
      toast(j.reason||"Narrative unavailable — keeping the assembled text");
      return;
    }
    NARRATIVE.abstract=j.abstract||""; NARRATIVE.discussion=j.discussion||"";
    NARRATIVE.limitations=j.limitations||""; NARRATIVE.source="model";
    NARRATIVE.model=[j.provider,j.model].filter(Boolean).join(" · ");
    NARRATIVE.verified=!!j.verified; NARRATIVE.verifyError=j.verifyError||null;
    NARRATIVE.removed=Array.isArray(j.removed)?j.removed:[];
    openReport();
    const n=NARRATIVE.removed.length;
    toast(!NARRATIVE.verified ? "Drafted, but the claim check did not run — review carefully"
      : n ? `Drafted · ${n} unsupported claim${n===1?"":"s"} removed`
          : "Drafted · claim check found nothing unsupported");
  }catch(e){ toast("Could not reach the server — keeping the assembled text"); }
  finally{ label.textContent=was; btn.disabled=false; }
}

$("#reportBtn").addEventListener("click",openReport);
$("#reportClose").addEventListener("click",closeReport);
$("#reportPrint").addEventListener("click",exportPDF);
$("#reportWrite").addEventListener("click",writeNarrative);
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#reportOv").classList.contains("open")){ e.preventDefault(); closeReport(); }
});

init();

})();
</script>
</body>
